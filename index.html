
<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root{
    --paper:#FAF6EC; --paper-2:#F2ECDC; --card:#FFFDF7;
    --ink:#2C2A26; --ink-2:#6E6757; --ink-3:#9C9484;
    --line:#E7E0CF; --line-2:#DAD2BD; --accent:#5E7155; --accent-soft:#EAEAD9;
    --warn:#B45309;
    --r-sm:7px; --r-md:11px; --r-lg:15px;
    --serif:'Newsreader',Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
  #root{max-width:760px;margin:0 auto;padding:0 18px 64px}
  h1,h2,h3{font-family:var(--serif);font-weight:500;color:var(--ink);line-height:1.2}
  button{font-family:inherit;cursor:pointer;color:inherit}
  a{color:inherit}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
  ::selection{background:#dfe3d2}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .eyebrow{font-family:var(--serif);font-size:13px;color:var(--ink-3);font-style:italic}
  .rule{height:1px;background:var(--line);border:0}
  .num{font-family:var(--serif);font-variant-numeric:lining-nums;letter-spacing:-.01em}
  .ln-btn{background:transparent;border:0.5px solid var(--line-2);border-radius:var(--r-md);padding:7px 12px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;text-decoration:none;transition:background .15s,border-color .15s}
  .ln-btn:hover{background:var(--paper-2);border-color:var(--accent)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:20px;padding:4px 11px;border:0.5px solid var(--line-2);background:var(--card);color:var(--ink-2);text-decoration:none;transition:background .15s}
  .chip:hover{background:var(--paper-2)}
  .cb{appearance:none;-webkit-appearance:none;position:relative;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:6px;background:var(--card);flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;overflow:visible;transition:background .18s,border-color .18s,transform .18s}
  .cb:hover{border-color:var(--ck,#534AB7)}
  .cb:checked{background:var(--ck,#534AB7);border-color:var(--ck,#534AB7);animation:cbpop .34s ease-out}
  .cb:checked::after{content:"\2713";color:#fff;font-size:11px;font-weight:700;animation:ckin .34s ease-out}
  .cb::before{content:"";position:absolute;inset:-1px;border-radius:7px;border:2px solid var(--ck,#534AB7);opacity:0;pointer-events:none}
  .cb:checked::before{animation:ckring .52s ease-out}
  .navbtn{background:transparent;border:0;padding:10px 2px;font-size:14px;color:var(--ink-3);position:relative}
  .navbtn[aria-current="true"]{color:var(--ink)}
  .navbtn[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
  .seclabel{font-family:var(--serif);font-size:15px;color:var(--ink);margin:22px 0 4px}
  .txtin{width:100%;background:var(--card);border:0.5px solid var(--line-2);border-radius:var(--r-md);padding:9px 12px;outline:none}
  .txtin:focus{border-color:var(--accent)}
  .sm{font-size:13px;padding:7px 9px;border:0.5px solid var(--line-2);border-radius:var(--r-md);background:var(--card)}
  .iconbtn{background:transparent;border:0;color:var(--ink-3);padding:6px;border-radius:6px;line-height:1;transition:color .15s,background .15s}
  .iconbtn:hover{color:var(--ink);background:var(--paper-2)}
  .copied{font-size:11px;color:var(--accent)}
  /* health tracker — big touch targets, this gets used one-handed at night */
  .hslider{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;margin:2px 0}
  .hslider::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--line)}
  .hslider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:var(--card);border:1.5px solid var(--hc,var(--accent));box-shadow:0 1px 3px rgba(0,0,0,.16)}
  .hslider::-moz-range-track{height:6px;border-radius:6px;background:var(--line)}
  .hslider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--card);border:1.5px solid var(--hc,var(--accent));box-shadow:0 1px 3px rgba(0,0,0,.16)}
  .hslider.unset::-webkit-slider-thumb{border-color:var(--line-2);background:var(--paper-2);box-shadow:none}
  .hslider.unset::-moz-range-thumb{border-color:var(--line-2);background:var(--paper-2);box-shadow:none}
  .pick{flex:1;min-width:40px;padding:10px 0;font-size:14px;text-align:center;background:var(--card);border:0.5px solid var(--line-2);border-radius:var(--r-md);color:var(--ink-2);transition:background .15s,border-color .15s,color .15s}
  .pick[aria-pressed="true"]{background:var(--hc,var(--accent));border-color:var(--hc,var(--accent));color:#fff}
  .daychip{flex:none;min-width:46px;padding:7px 5px;border-radius:var(--r-md);border:0.5px solid var(--line-2);background:var(--card);text-align:center;line-height:1.25;transition:background .15s,border-color .15s}
  .daychip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  @keyframes cbpop{0%{transform:scale(1)}42%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes ckin{0%{transform:scale(0) rotate(-14deg);opacity:0}55%{transform:scale(1.28) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes ckring{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2.4);opacity:0}}
  @keyframes fieldpop{0%,100%{box-shadow:0 0 0 0 rgba(94,113,85,0)}35%{box-shadow:0 0 0 2px rgba(94,113,85,.5)}}
  .field-done{animation:fieldpop .6s ease-out}
  .strike{position:relative}
  .strike::after{content:"";position:absolute;left:0;top:52%;height:1.5px;background:var(--ink-3);width:0;pointer-events:none;transition:width .28s ease-out}
  .strike.on::after{width:100%}
  .microtoast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:8px 16px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:60;animation:toastin .28s ease-out}
  @keyframes toastin{0%{opacity:0;transform:translate(-50%,8px)}100%{opacity:1;transform:translate(-50%,0)}}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
  @media (max-width:520px){#root{padding:0 13px 64px}}
</style>
</head>
<body>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ── identity & links ───────────────────────────────────────────── */
const SUBJ = { physio:"#534AB7", micro:"#0F6E56", im:"#BE123C", czech:"#185FA5", italian:"#2F8F57", health:"#0E7490" };
const PROJECT_PHYSIO = "https://claude.ai/project/019cc8a2-db77-7717-b48d-d8fff233e1c9";
const CHAT_CZECH   = "https://claude.ai/chat/53820c71-73a6-4d0c-bd13-87f8136b833b";
const CHAT_ITALIAN = "https://claude.ai/chat/a3aebc22-8fa1-41ec-8205-a05785d4ba0f";
const FLASH = "physio_flashcards.html";
const FLASH_IM = "intrena_flashcards.html";
// Instagram "school events": the button hands off to Claude's /insta-checkup skill (it scrapes
// the accounts + writes events to Calendar); this app just reads them back. Swap in a dedicated
// chat URL if you keep one, else a fresh chat works.
const INSTA_CHAT = "https://claude.ai/new";
const INSTA_DEEPLINK = "claude://claude.ai/new?q=" + encodeURIComponent("/insta-checkup");
// One-tap flow: deep-link into the Claude app with /insta-checkup pre-filled (works even if the
// app is closed). If nothing handles the claude:// scheme within ~1.6s, fall back to claude.ai
// in this tab. The command is also copied as a paste backup either way.
function openInstaCheck(e){
  e.preventDefault();
  copyText("/insta-checkup");
  let left=false;
  const mark=function(){ left=true; };
  document.addEventListener("visibilitychange",mark,{once:true});
  window.addEventListener("pagehide",mark,{once:true});
  window.addEventListener("blur",mark,{once:true});
  try{ window.location.href=INSTA_DEEPLINK; }catch(err){}
  setTimeout(function(){
    document.removeEventListener("visibilitychange",mark);
    window.removeEventListener("pagehide",mark);
    window.removeEventListener("blur",mark);
    if(!left && document.hasFocus()){ window.location.assign(INSTA_CHAT); }
  },1600);
}
const INSTA_ACCOUNTS = ["lfp_pilsmed","lfp_unikarlova","skas_lfp_uk","synapse_cz","medsocz.s","uims.cz","ambassadors_cu","trimed.lf3","unikarlova"];
// Google Calendar colorId → hex, matching the /insta-checkup convention
const GCAL_COLORS = { "6":"#E8710A", "9":"#3F51B5", "8":"#616161" };
const LIVE_URL = "https://peppy-lokum-2c5109.netlify.app/";
const IS_FILE = (typeof location!=="undefined" && location.protocol === "file:");
const DECK_NAME = { nervous:"Nervous System", endocrine:"Endocrinology", genphys:"General Physiology", blood:"Blood", senses:"Special Senses", kidney:"Kidney", respiratory:"Respiratory", circulation:"Circulation", git:"GIT" };
const DECK_BY_PREFIX = { NS:"nervous", EN:"endocrine", GP:"genphys", BL:"blood", SS:"senses", KI:"kidney", RS:"respiratory", CV:"circulation", GI:"git", MT:"git" };

/* ── Google Calendar (browser OAuth, no backend) ─────────────────── */
const GOOGLE_CLIENT_ID = "272590603949-tfgcscp9b13kka7gg8epj5tg4o47g6cq.apps.googleusercontent.com";
const AUTH_SCOPES = "https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/drive.appdata";
const GCAL_BASE = "https://www.googleapis.com/calendar/v3/calendars/primary/events";
let _tokenClient = null, _accessToken = null, _tokenExpiry = 0, _tokenPromise = null, _gaccount = null, _refreshTimer = 0;

function gisReady(){ return !!(window.google && window.google.accounts && window.google.accounts.oauth2); }
function restoreAccount(){ try{ const s=localStorage.getItem("sp_gaccount"); if(s) _gaccount=s; }catch(e){} }
function persistAccount(em){ if(!em) return; _gaccount=em; try{ localStorage.setItem("sp_gaccount", em); }catch(e){} _tokenClient=null; /* rebuild with new hint */ }
restoreAccount();
function ensureTokenClient(){
  if(_tokenClient) return _tokenClient;
  if(!gisReady()) return null;
  // `hint` pins the token to the saved account, so silent refresh never shows the account picker.
  _tokenClient = window.google.accounts.oauth2.initTokenClient({ client_id:GOOGLE_CLIENT_ID, scope:AUTH_SCOPES, hint:_gaccount||"", callback:function(){} });
  return _tokenClient;
}
function waitForGis(ms){
  return new Promise(function(resolve,reject){
    if(gisReady()) return resolve(true);
    const t0=Date.now();
    const iv=setInterval(function(){
      if(gisReady()){ clearInterval(iv); resolve(true); }
      else if(Date.now()-t0>ms){ clearInterval(iv); reject(new Error("Google sign-in library didn't load. Check your connection and reload.")); }
    },150);
  });
}
function getToken(opts){
  opts = opts || {};
  if(!opts.force && _accessToken && Date.now() < _tokenExpiry - 60000) return Promise.resolve(_accessToken);
  if(_tokenPromise) return _tokenPromise;
  const tc=ensureTokenClient();
  if(!tc) return Promise.reject(new Error("Google sign-in is still loading. Wait a moment and tap Connect again."));
  _tokenPromise = new Promise(function(resolve,reject){
    tc.callback=function(resp){
      _tokenPromise=null;
      if(resp && resp.access_token){ _accessToken=resp.access_token; _tokenExpiry=Date.now()+((resp.expires_in||3600)*1000); persistToken(); scheduleRefresh(); resolve(_accessToken); }
      else { reject(resp||new Error("No access token")); }
    };
    tc.error_callback=function(err){ _tokenPromise=null; reject(err||new Error("Sign-in was cancelled")); };
    try{ tc.requestAccessToken({ prompt: opts.prompt || "" }); }catch(e){ _tokenPromise=null; reject(e); }
  });
  return _tokenPromise;
}
/* Proactively refresh the token ~5 min before it expires so the session never visibly lapses.
   Silent (prompt:"") needs the browser's Google session; if Safari/iOS ITP has dropped it, the
   refresh fails quietly and the app falls back to a one-tap Reconnect when a real call next fails. */
function scheduleRefresh(){
  try{ clearTimeout(_refreshTimer); }catch(e){}
  if(!_accessToken) return;
  const lead=5*60*1000;
  const dueIn=Math.max(15000, _tokenExpiry - Date.now() - lead);
  _refreshTimer=setTimeout(function(){ getToken({force:true, prompt:""}).catch(function(){}); }, dueIn);
}
function refreshIfStale(){ if(_accessToken && Date.now() > _tokenExpiry - 5*60*1000){ getToken({force:true, prompt:""}).catch(function(){}); } }
async function acquireToken(){
  // Returning users: silent token for the saved account (no picker). First connect, or a dropped
  // session, falls back to the account chooser once.
  if(_gaccount){ try{ return await getToken({force:true, prompt:""}); }catch(e){} }
  return await getToken({force:true, prompt:"select_account"});
}
function gcalForget(){ _accessToken=null; _tokenExpiry=0; try{ localStorage.removeItem("sp_gtok"); }catch(e){} }
function persistToken(){ try{ localStorage.setItem("sp_gtok", JSON.stringify({t:_accessToken, e:_tokenExpiry})); }catch(e){} }
function restoreToken(){ try{ const s=localStorage.getItem("sp_gtok"); if(s){ const o=JSON.parse(s); if(o && o.t && o.e && o.e > Date.now()+60000){ _accessToken=o.t; _tokenExpiry=o.e; } } }catch(e){} }
restoreToken(); scheduleRefresh();

const pad = n => String(n).padStart(2,"0");
function toNaiveLocal(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }
/* reminders by urgency: normal → 30 min before; important → 1 day, 1 hour, 10 min before */
function remindersFor(task){
  return task.important
    ? [{method:"popup",minutes:1440},{method:"popup",minutes:60},{method:"popup",minutes:10}]
    : [{method:"popup",minutes:30}];
}
function eventFromTask(task){
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "Europe/Berlin";
  const startStr = task.date + "T" + task.time + ":00";
  const end = new Date(new Date(startStr).getTime() + 30*60000);
  return {
    summary: task.text,
    description: "Added from Study planner",
    start: { dateTime:startStr, timeZone:tz },
    end:   { dateTime:toNaiveLocal(end), timeZone:tz },
    reminders: { useDefault:false, overrides:remindersFor(task) },
  };
}
async function gcalCreate(task){
  const tok=await getToken();
  const r=await fetch(GCAL_BASE,{method:"POST",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(eventFromTask(task))});
  if(!r.ok) throw new Error("create "+r.status); return r.json();
}
async function gcalUpdate(id,task){
  const tok=await getToken();
  const r=await fetch(GCAL_BASE+"/"+encodeURIComponent(id),{method:"PATCH",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(eventFromTask(task))});
  if(!r.ok) throw new Error("update "+r.status); return r.json();
}
async function gcalDelete(id){
  const tok=await getToken();
  const r=await fetch(GCAL_BASE+"/"+encodeURIComponent(id),{method:"DELETE",headers:{Authorization:"Bearer "+tok}});
  if(!r.ok && r.status!==404 && r.status!==410) throw new Error("delete "+r.status); return true;
}
// read upcoming events (today → +14 days) so the planner can show the daily briefing + what /insta-checkup put on the calendar
async function gcalListEvents(){
  const tok=await getToken();
  const now=new Date();
  const qs=new URLSearchParams({ timeMin:now.toISOString(), timeMax:new Date(now.getTime()+14*86400000).toISOString(), singleEvents:"true", orderBy:"startTime", maxResults:"50", timeZone:"Europe/Prague" });
  const r=await fetch(GCAL_BASE+"?"+qs.toString(),{headers:{Authorization:"Bearer "+tok}});
  if(!r.ok) throw new Error("Calendar read failed ("+r.status+")");
  const j=await r.json();
  return (j.items||[]).map(function(it){
    const start=(it.start&&(it.start.dateTime||it.start.date))||null;
    const allDay=!!(it.start&&it.start.date&&!it.start.dateTime);
    const desc=it.description||"";                              // full description (briefing summary lives here)
    const sm=desc.match(/Source:\s*(@[\w.]+)/i);                // Instagram handle, unchanged
    const um=desc.match(/https?:\/\/[^\s)<>"']+/i);             // first URL, e.g. the Instagram post link
    return { id:it.id, title:it.summary||"(untitled)", start:start, allDay:allDay, location:it.location||"", colorId:it.colorId||"", description:desc, source:sm?sm[1]:"", postUrl:um?um[0]:"", htmlLink:it.htmlLink||"" };
  }).filter(function(e){ return e.start; });
}

/* ── Google Drive sync — a hidden app-data file, invisible in your normal Drive ── */
const DRIVE_FILE = "study-planner-sync.json";
let _driveFileId = null;
function tokenValid(){ return !!_accessToken && Date.now() < _tokenExpiry - 60000; }
async function driveErr(prefix,r){ let t=""; try{ t=await r.text(); }catch(e){} let msg=t; try{ const j=JSON.parse(t); msg=(j.error&&j.error.message)||t; }catch(e){} return new Error(prefix+" "+r.status+(msg?(": "+String(msg).slice(0,200)):"")); }
async function driveAbout(){ try{ const tok=await getToken(); const r=await fetch("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)",{headers:{Authorization:"Bearer "+tok}}); if(!r.ok) return null; const j=await r.json(); return (j.user&&j.user.emailAddress)||null; }catch(e){ return null; } }
async function driveFind(){
  const tok=await getToken();
  const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&pageSize=20",{headers:{Authorization:"Bearer "+tok}});
  if(!r.ok) throw await driveErr("Drive list",r);
  const j=await r.json(); const files=j.files||[];
  return files.find(function(x){return x.name===DRIVE_FILE;}) || files[0] || null;
}
async function driveRead(id){
  const tok=await getToken();
  const r=await fetch("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media",{headers:{Authorization:"Bearer "+tok}});
  if(!r.ok) throw await driveErr("Drive read",r);
  return r.json();
}
async function driveCreate(obj){
  const tok=await getToken();
  const boundary="planner"+Date.now();
  const body="--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name:DRIVE_FILE,parents:["appDataFolder"]})+"\r\n--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify(obj)+"\r\n--"+boundary+"--";
  const r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{Authorization:"Bearer "+tok,"Content-Type":"multipart/related; boundary="+boundary},body:body});
  if(!r.ok) throw await driveErr("Drive create",r);
  const j=await r.json(); return j.id;
}
async function driveUpdate(id,obj){
  const tok=await getToken();
  const r=await fetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",{method:"PATCH",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(obj)});
  if(!r.ok) throw await driveErr("Drive update",r);
  return true;
}
// fire-and-forget update that keeps running even as the page is backgrounded (small payload; iOS-safe)
function driveUpdateKeepalive(id,obj){
  if(!_accessToken) return;
  try{ fetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",{method:"PATCH",headers:{Authorization:"Bearer "+_accessToken,"Content-Type":"application/json"},body:JSON.stringify(obj),keepalive:true}); }catch(e){}
}

/* ── exams ──────────────────────────────────────────────────────── */
const EXAMS = [
  { id:"ct", label:"Physiology · computer test", iso:"2026-08-14", time:"08:00", place:"Unimec 1 – 5. patro · U5.29-TESTY", color:SUBJ.physio },
  { id:"or", label:"Physiology · oral exam",      iso:"2026-08-24", time:"09:00", place:"Department of Physiology",        color:SUBJ.physio },
];

/* ── the nine keystone topics ─────────────────────────────────────── */
const T = {
  NS12:{t:"Autonomic NS — sympathetic", s:"adrenergic mediators, receptors, organ effects", cmd:"/physiology-guide Autonomic nervous system – sympathetic division", hrs:"~1 h", v:[["Ninja Nerd","Autonomic nervous system — overview","https://www.youtube.com/watch?v=7dZHmKMLdC0"]]},
  NS13:{t:"Autonomic NS — parasympathetic", s:"cholinergic mediators, receptors, organ effects", cmd:"/physiology-guide Autonomic nervous system – parasympathetic division", hrs:"~1 h"},
  KI02:{t:"Glomerular filtration", s:"filtration pressure, GFR, autoregulation, TGF", cmd:"/physiology-guide Glomerular Filtration", v:[["Ninja Nerd","Renal — glomerular filtration","https://www.youtube.com/watch?v=SVqSqPOcahY"]]},
  EN01:{t:"General endocrinology", s:"hormone classes, feedback, receptors, signalling", cmd:"/physiology-guide General Endocrinology"},
  EN04:{t:"Thyroid gland", s:"TH synthesis, effects, regulation, dysfunction", cmd:"/physiology-guide Thyroid Gland", v:[["Osmosis","Hypothyroidism","https://www.osmosis.org/learn/Hypothyroidism"]]},

function langForDate(iso){
  const anchor=parseISO("2026-06-27"), d=parseISO(iso);
  const off=Math.round((d-anchor)/86400000);
  if(off<0 || off%2!==0) return null;            // before the plan, or a break day

}

const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const parseISO = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
const fmtLong = iso => parseISO(iso).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = iso => parseISO(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const fmtDay = iso => parseISO(iso).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const daysUntil = iso => { const t=parseISO(iso); const n=new Date(); const a=new Date(n.getFullYear(),n.getMonth(),n.getDate()); return Math.round((t-a)/86400000); };
const countLabel = n => n<0 ? "passed" : n===0 ? "today" : n===1 ? "tomorrow" : n+" days";
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const addDays = (iso,n) => { const d=parseISO(iso); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const dayDiff = (a,b) => Math.round((parseISO(b)-parseISO(a))/86400000);   // whole days from a → b
const dateRange = (a,b) => { const out=[]; const n=dayDiff(a,b); for(let i=0;i<=n;i++) out.push(addDays(a,i)); return out; };

function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.top="-1000px"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand("copy"); document.body.removeChild(ta); return ok; }catch(e){ return false; }
}
function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(10); }catch(e){} }
function prefersReduced(){ try{ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }
function AnimatedNumber({value, suffix, dur=520, style, className}){
  const [disp,setDisp]=useState(value);
  const from=useRef(value), raf=useRef(0);
  useEffect(function(){
    const start=from.current, end=value;
    if(start===end) return;
    if(prefersReduced()){ setDisp(end); from.current=end; return; }
    const t0=performance.now();
    const tick=function(t){ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3); setDisp(Math.round(start+(end-start)*e)); if(p<1){ raf.current=requestAnimationFrame(tick); } else { from.current=end; } };
    cancelAnimationFrame(raf.current); raf.current=requestAnimationFrame(tick);
    return function(){ cancelAnimationFrame(raf.current); };
  },[value,dur]);
  return <span className={className} style={style}>{disp}{suffix||""}</span>;
}
function fmtTaskWhen(task){
  const dayPart = task.date===todayStr() ? "today" : fmtDay(task.date);
  return task.time ? dayPart+" · "+task.time : dayPart;
}

/* seeded flag, not an empty-array check: deleting the trial on purpose must not resurrect it */
function migrateHealth(h){
  if(!h || !h.seeded) return DEFAULT_HEALTH();
  const out = Object.assign({ seeded:true, interventions:[], experiments:[], entries:{} }, h);
  if(!Array.isArray(out.interventions)) out.interventions=[];
  if(!Array.isArray(out.experiments)) out.experiments=[];
  if(!out.entries || typeof out.entries!=="object") out.entries={};
  return out;
}

const emptyEntry = date => ({ date, metrics:{}, flags:{}, doses:{}, notes:"", loggedAt:0 });

/* "unknown" is deliberately distinct from "missed": an unanswered checkbox is not evidence
   that you skipped the dose, but it is equally unusable, so both void the day. */
function doseState(entry, ids){
  if(!ids.length) return "none";
  if(!entry || !entry.doses) return "unknown";
  let missed=false, unknown=false;
  ids.forEach(function(id){ const v=entry.doses[id]; if(v===false) missed=true; else if(v!==true) unknown=true; });
  return missed ? "missed" : unknown ? "unknown" : "taken";
}
function entryComplete(entry, ids){
  if(!entry) return false;
  const scored = METRICS.every(m=>typeof entry.metrics[m.key]==="number");
  return scored && doseState(entry,ids)!=="unknown";
}
function entryProgress(entry, ids){
  const total = METRICS.length + ids.length;
  if(!entry) return { done:0, total };
  let done = METRICS.filter(m=>typeof entry.metrics[m.key]==="number").length;
  ids.forEach(function(id){ if(typeof entry.doses[id]==="boolean") done++; });
  return { done, total };
}

function expStats(exp, health, today){
  const ids = (exp.interventionIds||[]).filter(id=>health.interventions.some(i=>i.id===id && i.active));
  const trialDays = dayDiff(exp.startDate, exp.readoutDate) + 1;
  const allowedMisses = Math.floor(trialDays * (100 - (exp.minAdherencePct||80)) / 100);
  const started = today >= exp.startDate;
  const lastDay = today < exp.readoutDate ? today : exp.readoutDate;
  const days = (started ? dateRange(exp.startDate, lastDay) : []).map(function(d){
    const e  = health.entries[d] || null;
    const ds = doseState(e, ids);
    // today is not a miss until the day is over — no nagging at breakfast
    const pending = (d===today && ds!=="missed" && ds!=="taken");
    return { date:d, entry:e, dose:ds, pending:pending, isVoid: !pending && ds!=="taken" };
  });
  const counted = days.filter(d=>!d.pending);
  const missed  = counted.filter(d=>d.isVoid).length;
  const pct     = counted.length ? Math.round((counted.length-missed)/counted.length*100) : 100;
  let streak=0;
  for(let i=days.length-1;i>=0;i--){
    if(days[i].dose==="taken") streak++;
    else if(days[i].pending) continue;      // an unlogged today doesn't break yesterday's streak
    else break;
  }
  const blown = missed > allowedMisses;
  return {
    ids, trialDays, allowedMisses, missed, pct, streak, days, counted, blown, started,
    remainingMisses: Math.max(0, allowedMisses - missed),
    dayNo: started ? dayDiff(exp.startDate, lastDay) + 1 : 0,
    daysToReadout: dayDiff(today, exp.readoutDate),
    readoutReached: today >= exp.readoutDate,
  };
}

function eventDateKey(e){
  if(e.allDay) return e.start;                                  // all-day start is already YYYY-MM-DD
  const d=new Date(e.start);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function fmtEventTime(e){
  if(e.allDay) return "All day";
  return new Date(e.start).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}
function dayHeaderLabel(key){
  const ts=todayStr();
  const tm=new Date(); tm.setDate(tm.getDate()+1);
  const tmStr=tm.getFullYear()+"-"+pad(tm.getMonth()+1)+"-"+pad(tm.getDate());
  if(key===ts) return "Today";
  if(key===tmStr) return "Tomorrow";
  return fmtDay(key);
}
// The daily-briefing routine writes ONE all-day event titled "📋 Daily Briefing — YYYY-MM-DD"; it's the card, never a row.
function isBriefing(e){ return !!e.allDay && typeof e.title==="string" && e.title.trim().indexOf("📋 Daily Briefing")===0; }
function groupByDay(events){
  const groups=[], idx={};
  events.forEach(function(e){
    const k=eventDateKey(e);
    if(!(k in idx)){ idx[k]=groups.length; groups.push([k,[]]); }
    groups[idx[k]][1].push(e);
  });
  return groups;
}

// one shared calendar read, lifted so the top-of-Today briefing card and the Upcoming list share a single fetch
function useCalendarFeed(gcalOn){
  const [events,setEvents]=useState(null);

  const [refreshedAt,setRefreshedAt]=useState(0);
  const [loading,setLoading]=useState(false);
  const [tick,setTick]=useState(0);
  useEffect(function(){
    if(!gcalOn || !tokenValid()) return;
    let live=true; setLoading(true);
    gcalListEvents().then(function(items){ if(live){ setEvents(items); setErr(""); setRefreshedAt(Date.now()); setLoading(false); } })
      .catch(function(e){ if(live){ setErr(e&&e.message?e.message:"couldn't load"); setLoading(false); } });
    const onF=function(){ setTick(function(t){return t+1;}); };
    window.addEventListener("focus",onF);
    return function(){ live=false; window.removeEventListener("focus",onF); };
  },[gcalOn,tick]);
  return { events:events, err:err, loading:loading, refreshedAt:refreshedAt, refresh:function(){ setTick(function(t){return t+1;}); } };
}

          {gcalOn && <button className="iconbtn" style={{fontSize:11,color:"var(--ink-3)"}} onClick={feed.refresh} title="Refresh from calendar"><i className={"fa-solid fa-rotate"+(loading?" fa-spin":"")} aria-hidden="true"/></button>}
        </div>
        <a className="ln-btn" href={INSTA_DEEPLINK} onClick={openInstaCheck} style={{marginBottom:10}}>
          <i className="fa-solid fa-bolt" aria-hidden="true"/> Run Instagram check <i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:10,opacity:.6}} aria-hidden="true"/>
        </a>
        <p style={{fontSize:11.5,color:"var(--ink-3)",margin:"0 0 10px"}}>Opens the Claude app with <span style={{fontFamily:"var(--mono)"}}>/insta-checkup</span> already typed — just hit send. It scans the 9 school accounts, adds new events to your Google Calendar with fitting reminders, and they appear below. Zero-tap option: schedule your saved shortcut in the Chrome extension (clock icon).</p>
        {!gcalOn && <p style={{fontSize:12,color:"var(--ink-3)",margin:0}}>Turn on reminders + sync above to see your briefing and upcoming events here.</p>}
        {gcalOn && err && <p style={{fontSize:12,color:"var(--warn)",margin:0}}>⚠ {err}</p>}
        {gcalOn && !err && (
          <>
            <div style={{display:"flex",alignItems:"center",gap:8,margin:"2px 0 6px"}}>
              <button className="iconbtn" style={{fontSize:11,color:!schoolOnly?SUBJ.physio:"var(--ink-3)"}} onClick={function(){ setSchoolOnly(false); }}>All</button>
              <span style={{color:"var(--line-2)"}}>·</span>
              <button className="iconbtn" style={{fontSize:11,color:schoolOnly?SUBJ.physio:"var(--ink-3)"}} onClick={function(){ setSchoolOnly(true); }}>School only</button>
              {ago!==null && <span style={{marginLeft:"auto",fontSize:10.5,color:"var(--ink-3)"}}>{ago<1?"just now":("checked "+ago+"m ago")}</span>}
            </div>
            {events===null && <p style={{fontSize:12,color:"var(--ink-3)",margin:0}}>Loading…</p>}
            {events!==null && groups.length===0 && <p style={{fontSize:12,color:"var(--ink-3)",margin:0}}>{schoolOnly?"No school events on your calendar yet — run a check.":"Nothing upcoming in the next 14 days."}</p>}
            {groups.map(function(g){
              const key=g[0], evs=g[1];
              return (
                <div key={key} style={{marginTop:10}}>
                  <div style={{fontSize:11,fontWeight:600,letterSpacing:".03em",textTransform:"uppercase",color:"var(--ink-3)",margin:"0 0 2px"}}>{dayHeaderLabel(key)}</div>
                  {evs.map(function(e){
                    const col=GCAL_COLORS[e.colorId]||"var(--ink-3)";   // default = neutral
                    return (
                      <div key={e.id} style={{display:"flex",gap:11,alignItems:"stretch",padding:"8px 0",borderTop:"0.5px solid var(--line)"}}>
                        <span style={{width:3,borderRadius:3,background:col,flex:"none",alignSelf:"stretch"}}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:13.5,color:"var(--ink)"}}>{e.title}</div>
                          <div style={{fontSize:11.5,color:"var(--ink-3)",marginTop:2}}>{fmtEventTime(e)}{e.location?" · "+e.location:""}{e.source?" · "+e.source:""}</div>
                          {e.postUrl && <a href={e.postUrl} target="_blank" rel="noopener noreferrer" className="chip" style={{marginTop:6,fontSize:11,padding:"3px 9px"}}><i className="fa-brands fa-instagram" style={{color:"#C13584"}} aria-hidden="true"/> Open post <i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:9,opacity:.6}} aria-hidden="true"/></a>}
                        </div>
                        <a href={e.htmlLink||"#"} target="_blank" rel="noopener noreferrer" className="iconbtn" style={{alignSelf:"flex-start",fontSize:12,color:"var(--ink-3)"}} title="Open in Google Calendar" aria-label="Open in Google Calendar"><i className="fa-regular fa-calendar" aria-hidden="true"/></a>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </>
        )}
      </div>
  );
}

/* ── task composer + item ────────────────────────────────────────── */
function TaskComposer({onAdd}){
  const [text,setText]=useState("");
  const [time,setTime]=useState("");
  const [date,setDate]=useState(todayStr());
  const [important,setImportant]=useState(false);
  const add=()=>{ const t=text.trim(); if(!t) return; onAdd({text:t,time:time||null,date:date||todayStr(),important}); setText(""); setTime(""); setDate(todayStr()); setImportant(false); };
  return (
    <div style={{marginTop:10}}>
      <input className="txtin" placeholder="Add a plan or task…" value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")add();}}/>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:8,alignItems:"center"}}>
        <input className="sm" type="time" value={time} onChange={e=>setTime(e.target.value)} aria-label="Time"/>
        <input className="sm" type="date" value={date} onChange={e=>setDate(e.target.value)} aria-label="Date"/>
        <button className="sm" onClick={()=>setImportant(v=>!v)} aria-pressed={important} style={{color:important?"var(--warn)":"var(--ink-3)",borderColor:important?"var(--warn)":"var(--line-2)",display:"inline-flex",alignItems:"center",gap:6}}>
          <i className={important?"fa-solid fa-star":"fa-regular fa-star"} aria-hidden="true"/> Important
        </button>
        <button className="ln-btn" style={{marginLeft:"auto"}} onClick={add}><i className="fa-solid fa-plus" aria-hidden="true"/> Add</button>
      </div>
      {!time && text && <div style={{fontSize:11.5,color:"var(--ink-3)",marginTop:6}}>No time set — this stays a checklist item with no reminder.</div>}
    </div>
  );
}

function TaskItem({task, A, gcalOn}){
  const [editing,setEditing]=useState(false);
  const [text,setText]=useState(task.text);
  const [time,setTime]=useState(task.time||"");
  const [date,setDate]=useState(task.date||todayStr());
  const [important,setImportant]=useState(!!task.important);
  const overdue = !task.done && task.date < todayStr();
  const save=()=>{ A.updateTask(task.id,{text:text.trim()||task.text,time:time||null,date:date||todayStr(),important}); setEditing(false); };
  return (
    <div style={{padding:"10px 0",borderBottom:"0.5px solid var(--line)"}}>
      {!editing ? (
        <div style={{display:"flex",alignItems:"flex-start",gap:11}}>
          <input type="checkbox" className="cb" style={{"--ck":"var(--accent)",marginTop:1}} checked={task.done} onChange={()=>A.toggleTask(task.id)} aria-label="Mark task done"/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14,color:"var(--ink)",opacity:task.done?.5:1,textDecoration:task.done?"line-through":"none",display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
              {task.important && <i className="fa-solid fa-star" style={{color:"var(--warn)",fontSize:11}} aria-hidden="true"/>}
              {task.text}
            </div>
            <div style={{fontSize:12,color:overdue?"var(--warn)":"var(--ink-3)",marginTop:2,display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
              <span>{overdue?"overdue · ":""}{fmtTaskWhen(task)}</span>
              {gcalOn && task.time && task.gcalId && !task.gcalError && <span style={{color:SUBJ.physio}}><i className="fa-regular fa-calendar-check" aria-hidden="true"/> reminder set</span>}
              {gcalOn && task.time && task.gcalError && <button onClick={()=>A.retryTask(task.id)} style={{background:"none",border:0,color:"var(--warn)",padding:0,fontSize:12}}><i className="fa-solid fa-triangle-exclamation" aria-hidden="true"/> not synced — retry</button>}
            </div>
          </div>
          <button className="iconbtn" onClick={()=>setEditing(true)} aria-label="Edit task"><i className="fa-solid fa-pen" style={{fontSize:12}} aria-hidden="true"/></button>
          <button className="iconbtn" onClick={()=>A.deleteTask(task.id)} aria-label="Delete task"><i className="fa-solid fa-xmark" aria-hidden="true"/></button>
        </div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <input className="txtin" value={text} onChange={e=>setText(e.target.value)}/>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
            <input className="sm" type="time" value={time} onChange={e=>setTime(e.target.value)}/>
            <input className="sm" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
            <button className="sm" onClick={()=>setImportant(v=>!v)} style={{color:important?"var(--warn)":"var(--ink-3)",borderColor:important?"var(--warn)":"var(--line-2)",display:"inline-flex",alignItems:"center",gap:6}}><i className={important?"fa-solid fa-star":"fa-regular fa-star"} aria-hidden="true"/> Important</button>
            <button className="ln-btn" onClick={save}><i className="fa-solid fa-check" aria-hidden="true"/> Save</button>
            <button className="ln-btn" onClick={()=>{setEditing(false);setText(task.text);setTime(task.time||"");setDate(task.date||todayStr());setImportant(!!task.important);}}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── views ───────────────────────────────────────────────────────── */
function Countdown(){
  const next=EXAMS.find(e=>daysUntil(e.iso)>=0)||EXAMS[EXAMS.length-1]; const d=daysUntil(next.iso);
  return (
    <div style={{background:"var(--card)",border:"0.5px solid var(--line)",borderRadius:"var(--r-lg)",padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
      <div style={{minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}><Dot color={next.color}/><span style={{fontSize:14.5,color:"var(--ink)"}}>{next.label}</span></div>
        <div style={{fontSize:12.5,color:"var(--ink-3)",marginTop:4}}>{fmtLong(next.iso)} · {next.time} · {next.place}</div>
      </div>
      <div style={{textAlign:"right",flex:"none"}}><div className="num" style={{fontFamily:"var(--serif)",fontSize:30,color:next.color,lineHeight:1}}>{d<0?"–":d}</div><div style={{fontSize:11,color:"var(--ink-3)",marginTop:2}}>{d<=0?countLabel(d):"days left"}</div></div>
    </div>
  );
}

function TodayView({data, A, gcalStatus}){
  const ts=todayStr();
  const today=PLAN.find(p=>p.date===ts);
  const overdue=data.tasks.filter(t=>!t.done && t.date<ts);
  const todays=data.tasks.filter(t=>t.date===ts);
  const upcoming=data.tasks.filter(t=>t.date>ts).sort((a,b)=> (a.date+ (a.time||"")) < (b.date+(b.time||"")) ? -1:1);
  const catchUp=PLAN.filter(p=>p.date<ts && !p.exam).flatMap(p=>p.keystones).filter(c=>!data.done[c]);
  const topGoals=data.goals.slice(0,2);
  const gcalOn=gcalStatus==="on";
  const cal=useCalendarFeed(gcalOn);
  return (
    <div>
      <div className="eyebrow" style={{marginTop:18}}>{fmtLong(ts)}</div>
      <h1 style={{fontSize:30,margin:"2px 0 16px"}}>Today</h1>
      <BriefingCard gcalOn={gcalOn} events={cal.events}/>
      <Countdown/>

      {today ? (
        <>
          <div className="seclabel">Today’s study — {today.label}</div><hr className="rule" style={{marginBottom:10}}/>
          <DayBody p={today} data={data} A={A} showNote={true}/>
          {today.exam && <p style={{fontSize:14,color:SUBJ.physio}}>Exam day — good luck. Nothing new to study.</p>}
        </>
      ) : (
        <>
          <div className="seclabel">Today’s study</div><hr className="rule" style={{marginBottom:10}}/>
          <p style={{fontSize:14,color:"var(--ink-2)"}}>No study block scheduled for today. Open <button onClick={()=>A.go("plan")} style={{background:"none",border:0,color:"var(--accent)",padding:0,textDecoration:"underline"}}>the plan</button>, or clear anything in catch-up below.</p>
        </>
      )}

      {catchUp.length>0 && (
        <>
          <div className="seclabel">Catch up <span style={{fontSize:12,color:"var(--ink-3)"}}>({catchUp.length} unfinished)</span></div><hr className="rule" style={{marginBottom:10}}/>
          {catchUp.map(c=><TopicCard key={c} code={c} done={!!data.done[c]} onToggle={()=>A.toggleDone(c)}/>)}
        </>
      )}

      <div className="seclabel">Today’s plan</div><hr className="rule" style={{marginBottom:10}}/>
      <CalendarBar status={gcalStatus} onConnect={A.connectGcal} onDisconnect={A.disconnectGcal} busy={A.gcalBusy} sync={A.syncState} onSync={A.syncNow} onReconnect={A.reconnect} email={A.syncEmail} err={A.syncErr} onSwitch={A.switchAccount}/>
      <UpcomingEvents gcalOn={gcalOn} feed={cal}/>
      {overdue.length>0 && <div style={{fontSize:11.5,color:"var(--warn)",margin:"4px 0 2px",fontWeight:500}}>Overdue</div>}
      {overdue.map(t=><TaskItem key={t.id} task={t} A={A} gcalOn={gcalOn}/>)}
      {todays.length>0 && overdue.length>0 && <div style={{fontSize:11.5,color:"var(--ink-3)",margin:"10px 0 2px"}}>Today</div>}
      {todays.map(t=><TaskItem key={t.id} task={t} A={A} gcalOn={gcalOn}/>)}
      <TaskComposer onAdd={A.addTask}/>
      {upcoming.length>0 && (
        <>
          <div style={{fontSize:11.5,color:"var(--ink-3)",margin:"16px 0 2px"}}>Upcoming</div>
          {upcoming.map(t=><TaskItem key={t.id} task={t} A={A} gcalOn={gcalOn}/>)}
        </>
      )}

      {topGoals.length>0 && (
        <>
          <div className="seclabel">Goals</div><hr className="rule" style={{marginBottom:10}}/>
          {topGoals.map(g=><GoalRowMini key={g.id} g={g}/>)}
          <button onClick={()=>A.go("goals")} className="ln-btn" style={{marginTop:8}}>All goals <i className="fa-solid fa-arrow-right" style={{fontSize:11}} aria-hidden="true"/></button>
        </>
      )}

      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:22}}>
        <a className="ln-btn" href={FLASH+"#master"} target="_blank" rel="noopener noreferrer"><i className="fa-solid fa-stopwatch" aria-hidden="true"/> Master Exam</a>
        <a className="ln-btn" href={FLASH} target="_blank" rel="noopener noreferrer"><i className="fa-regular fa-clone" aria-hidden="true"/> All flashcard decks</a>
        <button className="ln-btn" onClick={A.exportData}><i className="fa-solid fa-download" aria-hidden="true"/> Export backup</button>
        <button className="ln-btn" onClick={A.importData}><i className="fa-solid fa-upload" aria-hidden="true"/> Import</button>
      </div>
    </div>
  );
}

function GoalRowMini({g}){
  const total=g.steps.length, done=g.steps.filter(s=>s.done).length, pct=total?Math.round(done/total*100):0;
  return (
    <div style={{padding:"9px 0",borderBottom:"0.5px solid var(--line)"}}>
      <div style={{display:"flex",alignItems:"center",gap:9}}><i className="fa-regular fa-flag" style={{color:"var(--ink-2)",fontSize:14}} aria-hidden="true"/><span style={{flex:1,fontSize:14,color:"var(--ink)"}}>{g.title}</span>{g.date && <span style={{fontSize:11,color:"var(--ink-3)"}}>{fmtShort(g.date)}</span>}</div>
      {total>0 && <div style={{display:"flex",alignItems:"center",gap:8,margin:"8px 0 0 23px"}}><ProgressBar pct={pct} color={SUBJ.physio}/><span style={{fontSize:11,color:"var(--ink-3)"}}>{done}/{total}</span></div>}
    </div>
  );
}

function PlanView({data, A}){
  const ts=todayStr();
  return (
    <div>
      <div className="eyebrow" style={{marginTop:18}}>now → 26 June</div>
      <h1 style={{fontSize:28,margin:"2px 0 6px"}}>Physiology plan</h1>
      <p style={{fontSize:13,color:"var(--ink-2)",margin:"0 0 4px"}}>One keystone deep-dive (~2 h) on weekdays, two on weekends — the rest of each field comes from drilling its deck. Respiratory, circulation and GIT are done, so they appear as question blocks. Round 2 after the test goes deep on everything.</p>
      {PLAN.map(p=>{
        const done=p.keystones.filter(c=>data.done[c]).length; const isToday=p.date===ts, past=p.date<ts;
        return (
          <div key={p.date} style={{marginTop:18,opacity:past&&!isToday?.7:1}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
              {isToday && <span style={{fontSize:10,fontWeight:500,padding:"2px 9px",borderRadius:20,background:SUBJ.physio,color:"#fff"}}>today</span>}
              <h2 style={{fontSize:18}}>{p.day} {fmtShort(p.date)} — {p.label}</h2>
              <span style={{fontSize:12,color:"var(--ink-3)",marginLeft:"auto"}}>{p.est}{p.keystones.length>0?` · ${done}/${p.keystones.length}`:""}</span>
            </div>
            <hr className="rule" style={{marginBottom:10}}/>
            {p.note && !p.exam && <p style={{fontSize:12.5,color:"var(--ink-2)",margin:"0 0 10px",fontStyle:"italic"}}>{p.note}</p>}
            <DayBody p={p} data={data} A={A} showNote={false}/>
          </div>
        );
      })}
    </div>
  );
}

function GoalCard({g, A}){
  const [editing,setEditing]=useState(false); const [title,setTitle]=useState(g.title); const [date,setDate]=useState(g.date||""); const [step,setStep]=useState("");
  const total=g.steps.length, done=g.steps.filter(s=>s.done).length, pct=total?Math.round(done/total*100):0;
  const save=()=>{ A.updateGoal(g.id,{title:title.trim()||g.title,date}); setEditing(false); };
  const addStep=()=>{ const t=step.trim(); if(t){ A.addStep(g.id,t); setStep(""); } };
  return (
    <div style={{border:"0.5px solid var(--line)",borderRadius:"var(--r-lg)",background:"var(--card)",padding:"14px 16px",marginBottom:12}}>
      {!editing ? (
        <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
          <i className="fa-regular fa-flag" style={{color:SUBJ.physio,fontSize:15,marginTop:3}} aria-hidden="true"/>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:15.5,color:"var(--ink)",fontFamily:"var(--serif)"}}>{g.title}</div>{g.date && <div style={{fontSize:12,color:"var(--ink-3)",marginTop:2}}>target · {fmtLong(g.date)}</div>}</div>
          <button className="iconbtn" onClick={()=>setEditing(true)} aria-label="Edit goal"><i className="fa-solid fa-pen" style={{fontSize:12}} aria-hidden="true"/></button>
          <button className="iconbtn" onClick={()=>{ if(confirm("Delete this goal?")) A.delGoal(g.id); }} aria-label="Delete goal"><i className="fa-solid fa-trash" style={{fontSize:12}} aria-hidden="true"/></button>
        </div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <input className="txtin" value={title} onChange={e=>setTitle(e.target.value)} placeholder="Goal"/>
          <div style={{display:"flex",gap:8,alignItems:"center"}}><input className="txtin" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{maxWidth:180}}/><button className="ln-btn" onClick={save}><i className="fa-solid fa-check" aria-hidden="true"/> Save</button><button className="ln-btn" onClick={()=>{setEditing(false);setTitle(g.title);setDate(g.date||"");}}>Cancel</button></div>
        </div>
      )}
      {total>0 && <div style={{display:"flex",alignItems:"center",gap:8,margin:"12px 0 4px"}}><ProgressBar pct={pct} color={SUBJ.physio}/><span style={{fontSize:11,color:"var(--ink-3)"}}>{done}/{total}</span></div>}
      <div style={{marginTop:8}}>
        {g.steps.map(s=>(
          <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0"}}>
            <input type="checkbox" className="cb" style={{"--ck":SUBJ.physio,width:16,height:16}} checked={s.done} onChange={()=>A.toggleStep(g.id,s.id)} aria-label="Toggle step"/>
            <span style={{flex:1,fontSize:13.5,color:"var(--ink-2)",opacity:s.done?.5:1,textDecoration:s.done?"line-through":"none"}}>{s.text}</span>
            <button className="iconbtn" onClick={()=>A.delStep(g.id,s.id)} aria-label="Delete step"><i className="fa-solid fa-xmark" style={{fontSize:12}} aria-hidden="true"/></button>
          </div>
        ))}
        <div style={{display:"flex",gap:8,marginTop:6}}><input className="txtin" placeholder="Add a step…" value={step} onChange={e=>setStep(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addStep();}}/><button className="ln-btn" onClick={addStep}><i className="fa-solid fa-plus" aria-hidden="true"/></button></div>
      </div>
    </div>
  );
}

function GoalsView({data, A}){
  const [val,setVal]=useState("");
  const add=()=>{ const t=val.trim(); if(t){ A.addGoal(t); setVal(""); } };
  return (
    <div>
      <div className="eyebrow" style={{marginTop:18}}>what you’re working toward</div>
      <h1 style={{fontSize:28,margin:"2px 0 14px"}}>Goals</h1>
      <div style={{display:"flex",gap:8,marginBottom:18}}><input className="txtin" placeholder="Add a goal…" value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")add();}}/><button className="ln-btn" onClick={add}><i className="fa-solid fa-plus" aria-hidden="true"/> Add goal</button></div>
      {data.goals.length===0 ? <p style={{fontSize:14,color:"var(--ink-2)"}}>No goals yet. Add one above — then break it into steps and watch the bar fill.</p> : data.goals.map(g=><GoalCard key={g.id} g={g} A={A}/>)}
    </div>
  );
}

function TimelineView(){
  return (
    <div>
      <div className="eyebrow" style={{marginTop:18}}>the bigger arc</div>
      <h1 style={{fontSize:28,margin:"2px 0 16px"}}>Timeline</h1>
      <div style={{position:"relative",paddingLeft:22}}>
        <div style={{position:"absolute",left:5,top:6,bottom:6,width:1.5,background:"var(--line-2)"}}/>
        {TIMELINE.map((it,i)=>{ const c=it.color||(it.kind==="done"?"#9C9484":"var(--ink-3)"); return (
          <div key={i} style={{position:"relative",marginBottom:18}}>
            <span style={{position:"absolute",left:-22,top:4,width:it.big?12:9,height:it.big?12:9,borderRadius:"50%",background:it.kind==="exam"?c:"var(--paper)",border:`2px solid ${c}`,boxSizing:"border-box"}}/>
            <div style={{fontSize:it.big?16:14.5,color:"var(--ink)",fontFamily:it.big?"var(--serif)":"inherit",display:"flex",alignItems:"center",gap:8}}>{it.kind==="done" && <i className="fa-solid fa-check" style={{color:SUBJ.micro,fontSize:12}} aria-hidden="true"/>}{it.label}{it.final && <span style={{fontSize:10,padding:"1px 8px",borderRadius:20,background:SUBJ.physio+"18",color:SUBJ.physio}}>final</span>}</div>
            <div style={{fontSize:12.5,color:"var(--ink-3)",marginTop:2}}>{it.detail}</div>
          </div>
        );})}
      </div>
      <div style={{marginTop:8,padding:"12px 14px",background:"var(--card)",border:"0.5px solid var(--line)",borderRadius:"var(--r-lg)"}}>
        <div style={{fontSize:13,color:"var(--ink-2)",marginBottom:8}}>Past subjects — passed</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:7}}>

function FieldBlock({field, data, A}){
  const [open,setOpen]=useState(false);
  const codes=field.topics.map(t=>t[0]);
  const dn=codes.filter(c=>data.done[c]).length, tot=codes.length, pct=Math.round(dn/tot*100);
  const allDone=dn===tot;
  const [cel,setCel]=useState(false);
  const prev=useRef(allDone);
  useEffect(function(){
    if(allDone && !prev.current){ setCel(true); haptic(); const t=setTimeout(function(){ setCel(false); },1600); prev.current=allDone; return function(){ clearTimeout(t); }; }
    prev.current=allDone;
  },[allDone]);
  return (
    <div className={cel?"field-done":""} style={{border:"0.5px solid var(--line)",borderRadius:"var(--r-lg)",background:"var(--card)",marginBottom:10,overflow:"hidden"}}>
      {cel && <div className="microtoast"><i className="fa-solid fa-circle-check" style={{marginRight:7}} aria-hidden="true"/>{field.name} complete</div>}
      <div style={{display:"flex",alignItems:"center",gap:11,padding:"12px 14px"}}>
        <button onClick={()=>setOpen(o=>!o)} style={{flex:1,minWidth:0,textAlign:"left",background:"none",border:0,padding:0,display:"flex",alignItems:"center",gap:11}}>
          <i className={"fa-solid fa-chevron-"+(open?"down":"right")} style={{fontSize:11,color:"var(--ink-3)",flex:"none"}} aria-hidden="true"/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14.5,color:"var(--ink)"}}>{field.name}</div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginTop:5}}><ProgressBar pct={pct} color={SUBJ.physio}/><span style={{fontSize:11,color:"var(--ink-3)",flex:"none"}}><AnimatedNumber value={dn}/>/{tot}</span></div>
          </div>
        </button>
        <button className="iconbtn" style={{fontSize:11,flex:"none",color:allDone?"var(--ink-3)":"var(--accent)"}} onClick={()=>A.setMany(codes,!allDone)} title={allDone?"Clear all":"Mark all done"}>{allDone?"clear":"all done"}</button>
      </div>
      {open && (
        <div style={{padding:"0 14px 10px"}}>
          <hr className="rule" style={{marginBottom:8}}/>
          {field.topics.map(([code,title])=>(
            <div key={code} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0"}}>
              <input type="checkbox" className="cb" style={{"--ck":SUBJ.physio,width:16,height:16}} checked={!!data.done[code]} onChange={()=>A.toggleDone(code)} aria-label={"Mark "+title+" done"}/>
              <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:SUBJ.physio,flex:"none",width:38}}>{code}</span>
              <span className={"strike"+(data.done[code]?" on":"")} style={{flex:1,fontSize:13.5,color:"var(--ink-2)",opacity:data.done[code]?.55:1,transition:"opacity .28s"}}>{title}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ProgressView({data, A}){
  const allCodes=CURRICULUM.flatMap(f=>f.topics.map(t=>t[0]));
  const total=allCodes.length, done=allCodes.filter(c=>data.done[c]).length, pct=Math.round(done/total*100);

function MetricSlider({m, value, onChange, primary}){
  const set = typeof value==="number";
  const col = primary ? SUBJ.health : "var(--ink-2)";
  // a controlled range parked at 5 fires no change event when you tap dead-centre while unset,
  // so commit the DOM value on pointer release as well
  const commitIfUnset = e => { if(!set) onChange(Number(e.currentTarget.value)); };
  return (
    <div style={{padding:"10px 0",borderBottom:"0.5px solid var(--line)"}}>
      <div style={{display:"flex",alignItems:"baseline",gap:8}}>
        <span style={{fontSize:14,color:"var(--ink)"}}>{m.label}</span>
        {primary && <span style={{fontSize:10,padding:"1px 7px",borderRadius:10,background:SUBJ.health+"1c",color:SUBJ.health}}>primary</span>}

      </div>
      <input type="range" min="0" max="10" step="1" className={"hslider"+(set?"":" unset")} style={{"--hc":SUBJ.health}}
        value={set?value:5} onChange={e=>onChange(Number(e.target.value))} onPointerUp={commitIfUnset} onKeyUp={commitIfUnset}

      <div style={{fontSize:11.5,color:"var(--ink-3)"}}>{m.help}</div>

function WakingsPicker({m, value, onChange}){

/* The one screen that has to work: a void trial is stated plainly and is never dressed up
   as a negative finding. */
function TrialStrip({exp, st}){
  if(!exp || !st) return null;
  if(exp.status==="void" || st.blown){
    return (
      <div style={{border:"1px solid #B45309",borderRadius:"var(--r-lg)",background:"#B453090f",padding:"14px 16px",marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:7}}>
          <i className="fa-solid fa-triangle-exclamation" style={{color:"var(--warn)"}} aria-hidden="true"/>
          <span style={{fontFamily:"var(--serif)",fontSize:17,color:"#7A2E12"}}>This trial is void — restart it</span>
        </div>
        <p style={{fontSize:13.5,color:"#7A2E12",lineHeight:1.55,margin:0}}>
          You missed <strong>{st.missed}</strong> {st.missed===1?"day":"days"}; this trial allowed {st.allowedMisses}. Even a perfect run from
          here can no longer reach {exp.minAdherencePct}% adherence, so whatever the numbers do next, they can’t be read.
          <br/><strong>This is not a negative result — it is no result.</strong> Start a fresh trial with a new start date.
        </p>
      </div>
    );
  }
  if(!st.started){
    return (
      <div style={{border:"0.5px solid var(--line)",borderRadius:"var(--r-lg)",background:"var(--card)",padding:"12px 15px",marginBottom:14,fontSize:13,color:"var(--ink-2)"}}>
        <strong style={{color:"var(--ink)"}}>{exp.name}</strong> starts {fmtLong(exp.startDate)}.
      </div>
    );
  }
  return (
    <div style={{border:`0.5px solid ${SUBJ.health}33`,borderRadius:"var(--r-lg)",background:SUBJ.health+"0a",padding:"12px 15px",marginBottom:14}}>
      <div style={{fontSize:14,color:"var(--ink)",marginBottom:3}}>{exp.name}</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:"2px 14px",fontSize:12.5,color:"var(--ink-2)"}}>
        <span>Day <span className="num" style={{color:SUBJ.health}}>{st.dayNo}</span> of {st.trialDays}</span>
        <span>{st.streak} day{st.streak===1?"":"s"} in a row</span>
        <span style={{color:st.remainingMisses===0?"var(--warn)":"var(--ink-2)"}}>
          {st.missed} of {st.allowedMisses} missed {st.allowedMisses===1?"day":"days"} used
        </span>
      </div>
      <div style={{fontSize:11.5,color:"var(--ink-3)",marginTop:6,display:"flex",alignItems:"center",gap:6}}>
        <i className="fa-solid fa-lock" style={{fontSize:10}} aria-hidden="true"/>
        {st.readoutReached
          ? <span>Readout reached — the comparison is unlocked.</span>
          : <span>No verdict until {fmtShort(exp.readoutDate)} · {st.daysToReadout} day{st.daysToReadout===1?"":"s"} to go. Keep logging.</span>}
      </div>
    </div>
  );
}

          {!isToday && <span style={{fontSize:10.5,padding:"3px 9px",borderRadius:10,background:"var(--accent-soft)",color:"var(--accent)",flex:"none"}}>catching up</span>}

              <span style={{fontSize:13.5,color:"var(--ink)"}}>{f.label}</span>

          ))}

          <div style={{fontSize:11.5,color:"var(--ink-3)",textTransform:"uppercase",letterSpacing:".06em",margin:"16px 0 6px"}}>Notes <span style={{textTransform:"none",letterSpacing:0}}>· optional</span></div>
          <textarea className="txtin" rows="2" placeholder="Anything worth remembering about today…"

  );

/* ── root ───────────────────────────────────────────────────────── */
const TABS = [["today","Today"],["plan","Plan"],["progress","Progress"],["goals","Goals"],["health","Health"],["timeline","Timeline"]];

function App(){
  const [tab,setTab]=useState("today");
  const [data,setData]=useState(loadData);
  const [gcalStatus,setGcalStatus]=useState("off");   // off | on | reconnect
  const [gcalBusy,setGcalBusy]=useState(false);
  const [syncState,setSyncState]=useState("idle");    // idle | syncing | synced | error
  const [syncErr,setSyncErr]=useState("");
  const [syncEmail,setSyncEmail]=useState("");
  const fileRef=useRef(null);
  const dataRef=useRef(data);
  const first=useRef(true);
  const skipPush=useRef(false);
  const pushTimer=useRef(null);
  const dirty=useRef(false);

  useEffect(()=>{ dataRef.current=data; },[data]);

  // save locally on every change; push to Drive (debounced) for real edits
  useEffect(()=>{
    if(first.current){ first.current=false; return; }
    saveData(data);
    if(skipPush.current){ skipPush.current=false; return; }
    if(data.gcalEnabled){ dirty.current=true; if(tokenValid()){ schedulePush(); } else { setGcalStatus(s=>s==="on"?"reconnect":s); } }
  },[data]);

  // a change the user made → bump the timestamp so it wins on other devices and gets pushed
  const mutate = (updater)=> setData(d=>{ const nd=updater(d); return {...nd, updatedAt:Date.now()}; });
  // adopt the Drive copy without pushing it back; the connection flag stays device-local
  const adopt = (remote)=>{ skipPush.current=true; const m=migrate(remote); m.gcalEnabled=dataRef.current.gcalEnabled; setData(m); saveData(m); };

  // flush a pending push immediately when the app is backgrounded (keepalive survives the page freezing — key on iPhone)
  const flush=()=>{
    if(pushTimer.current){ clearTimeout(pushTimer.current); pushTimer.current=null; }
    if(dirty.current && dataRef.current.gcalEnabled && tokenValid() && _driveFileId){ driveUpdateKeepalive(_driveFileId, dataRef.current); dirty.current=false; }
  };

  // on load: a saved token (kept across reloads) lets us sync straight away; otherwise show reconnect
  useEffect(()=>{
    if(dataRef.current.gcalEnabled){ if(tokenValid()){ setGcalStatus("on"); autoSync(); } else { setGcalStatus("reconnect"); } }
  },[]);

  // sync when the app becomes active, flush when it backgrounds, and pull every 25s while open
  useEffect(()=>{
    const onVis=()=>{ if(document.visibilityState==="visible"){ refreshIfStale(); autoSync(); } else { flush(); } };
    document.addEventListener("visibilitychange",onVis);
    const onFocus=()=>{ refreshIfStale(); autoSync(); };
    window.addEventListener("focus",onFocus);
    window.addEventListener("pagehide",flush);
    const iv=setInterval(()=>{ if(document.visibilityState==="visible" && dataRef.current.gcalEnabled && tokenValid()){ resync(); } }, 25000);
    return ()=>{ document.removeEventListener("visibilitychange",onVis); window.removeEventListener("focus",onFocus); window.removeEventListener("pagehide",flush); clearInterval(iv); };
  },[]);

  // ── Drive sync orchestration ──
  const noteOk=()=>{ setSyncErr(""); setSyncState("synced"); driveAbout().then(em=>{ if(em){ setSyncEmail(em); persistAccount(em); } }); };
  const noteErr=(e)=>{ setSyncErr(e&&e.message?e.message:"sync failed"); setSyncState("error"); };
  const schedulePush=()=>{ if(pushTimer.current) clearTimeout(pushTimer.current); pushTimer.current=setTimeout(doPush,900); };
  const doPush=async ()=>{
    if(!dataRef.current.gcalEnabled || !tokenValid()) return;
    try{
      setSyncState("syncing");
      if(!_driveFileId){ const f=await driveFind(); if(f) _driveFileId=f.id; }
      if(_driveFileId){ await driveUpdate(_driveFileId, dataRef.current); }
      else { _driveFileId=await driveCreate(dataRef.current); }
      dirty.current=false; noteOk();
    }catch(e){ noteErr(e); }
  };
  // merge with Drive by timestamp: the newer side wins, so local unsynced edits are PUSHED, never silently lost
  const resync=async ()=>{
    if(!dataRef.current.gcalEnabled || !tokenValid()) return;
    try{
      setSyncState("syncing");
      if(!_driveFileId){ const f=await driveFind(); if(f) _driveFileId=f.id; }
      if(!_driveFileId){ _driveFileId=await driveCreate(dataRef.current); dirty.current=false; noteOk(); return; }
      const remote=await driveRead(_driveFileId);
      const rt=remote.updatedAt||0, lt=dataRef.current.updatedAt||0;
      if(rt>lt){ adopt(remote); }
      else if(lt>rt){ await driveUpdate(_driveFileId, dataRef.current); dirty.current=false; }
      noteOk();
    }catch(e){ noteErr(e); }
  };
  // load / focus / interval: merge if we hold a token, else show reconnect (never a surprise popup)
  const autoSync=()=>{
    if(!dataRef.current.gcalEnabled) return;
    if(tokenValid()){ resync(); } else { setGcalStatus(s=>s==="on"?"reconnect":s); }
  };
  // first-time connect on a device: take the shared Drive copy if it exists, else seed it from here
  const initialSync=async ()=>{
    try{
      setSyncState("syncing");
      const f=await driveFind();
      if(f){ _driveFileId=f.id; const remote=await driveRead(f.id); adopt(remote); }
      else { _driveFileId=await driveCreate(dataRef.current); }
      dirty.current=false; noteOk();
    }catch(e){ noteErr(e); }
  };

  // calendar sync helpers
  const syncCreate = (task)=>{
    if(!dataRef.current.gcalEnabled || !task.time) return;
    gcalCreate(task).then(ev=>{ mutate(d=>({...d,tasks:d.tasks.map(t=>t.id===task.id?{...t,gcalId:ev.id,gcalError:false}:t)})); })
    .catch(()=>{ setData(d=>({...d,tasks:d.tasks.map(t=>t.id===task.id?{...t,gcalError:true}:t)})); setGcalStatus(s=>s==="on"?"reconnect":s); });
  };
  const syncUpdate = (task)=>{
    if(!dataRef.current.gcalEnabled) return;
    if(task.gcalId){
      gcalUpdate(task.gcalId,task).then(()=>{ setData(d=>({...d,tasks:d.tasks.map(t=>t.id===task.id?{...t,gcalError:false}:t)})); })
      .catch(()=>{ setData(d=>({...d,tasks:d.tasks.map(t=>t.id===task.id?{...t,gcalError:true}:t)})); setGcalStatus(s=>s==="on"?"reconnect":s); });
    } else if(task.time){ syncCreate(task); }
  };

  // health entries save on change, exactly like every tick in the planner
  const patchEntry = (date,fn)=>mutate(d=>{
    const cur  = d.health.entries[date] || emptyEntry(date);
    const next = Object.assign({}, fn(cur), { loggedAt:Date.now() });
    return {...d, health:{...d.health, entries:{...d.health.entries, [date]:next}}};
  });

  const A = {
    go:setTab,

    setMetric:(date,key,val)=>patchEntry(date,e=>({...e,metrics:{...e.metrics,[key]:val}})),
    setFlag:(date,key,val)=>patchEntry(date,e=>({...e,flags:{...e.flags,[key]:val}})),
    setDose:(date,id,val)=>patchEntry(date,e=>({...e,doses:{...e.doses,[id]:val}})),
    setEntryNotes:(date,v)=>patchEntry(date,e=>({...e,notes:v})),
    voidExperiment:(id)=>mutate(d=>({...d,health:{...d.health,experiments:d.health.experiments.map(x=>x.id===id?{...x,status:"void"}:x)}})),

    gcalBusy, syncState, syncEmail, syncErr,
    toggleDone:(c)=>{ haptic(); mutate(d=>({...d,done:{...d.done,[c]:!d.done[c]}})); },
    setMany:(codes,val)=>mutate(d=>{ const nd={...d,done:{...d.done}}; codes.forEach(function(c){ nd.done[c]=val; }); return nd; }),

    addTask:(f)=>{ const task={id:uid(),text:f.text,date:f.date,time:f.time,important:!!f.important,done:false,gcalId:null};
      mutate(d=>({...d,tasks:[...d.tasks,task]})); syncCreate(task); },
    updateTask:(id,patch)=>{
      const cur=dataRef.current.tasks.find(t=>t.id===id)||{};
      const wasGId=cur.gcalId;
      const updated={...cur,...patch};
      mutate(d=>({...d,tasks:d.tasks.map(t=>t.id===id?{...t,...patch}:t)}));
      if(!dataRef.current.gcalEnabled) return;
      if(wasGId && !updated.time){ gcalDelete(wasGId).catch(()=>{}); mutate(d=>({...d,tasks:d.tasks.map(t=>t.id===id?{...t,gcalId:null}:t)})); return; }
      syncUpdate(updated);
    },
    toggleTask:(id)=>mutate(d=>({...d,tasks:d.tasks.map(t=>t.id===id?{...t,done:!t.done}:t)})),
    deleteTask:(id)=>{ const t=dataRef.current.tasks.find(x=>x.id===id); if(t && t.gcalId && dataRef.current.gcalEnabled){ gcalDelete(t.gcalId).catch(()=>{}); } mutate(d=>({...d,tasks:d.tasks.filter(x=>x.id!==id)})); },
    retryTask:(id)=>{ const t=dataRef.current.tasks.find(x=>x.id===id); if(t) syncUpdate(t); },

    connectGcal:async ()=>{
      if(IS_FILE){ alert("This is the offline copy sitting on your computer (file://).\n\nGoogle sign-in, reminders and sync only work on the live site. Open this instead:\n\n"+LIVE_URL); return; }
      setGcalBusy(true);
      try{
        await acquireToken();
        setData(d=>({...d,gcalEnabled:true}));
        setGcalStatus("on");
        await initialSync();
        const pending=dataRef.current.tasks.filter(t=>t.time && !t.gcalId && !t.done);
        for(const t of pending){ try{ const ev=await gcalCreate(t); mutate(d=>({...d,tasks:d.tasks.map(x=>x.id===t.id?{...x,gcalId:ev.id,gcalError:false}:x)})); }catch(e){} }
      }catch(e){ alert("Couldn't connect to Google.\n\n"+(e && e.message?e.message:"Please try again.")); setGcalStatus(s=>s==="on"?"on":"off"); }
      setGcalBusy(false);
    },
    disconnectGcal:()=>{ gcalForget(); _driveFileId=null; dirty.current=false; setData(d=>({...d,gcalEnabled:false})); setGcalStatus("off"); setSyncState("idle"); },
    // reconnect after the token expired — refresh, then MERGE by timestamp so offline edits are pushed, not lost
    reconnect:async ()=>{
      if(IS_FILE){ alert("Open the live app to reconnect:\n\n"+LIVE_URL); return; }
      setGcalBusy(true);
      try{
        await acquireToken();
        setGcalStatus("on");
        await resync();
        const pending=dataRef.current.tasks.filter(t=>t.time && !t.gcalId && !t.done);
        for(const t of pending){ try{ const ev=await gcalCreate(t); mutate(d=>({...d,tasks:d.tasks.map(x=>x.id===t.id?{...x,gcalId:ev.id,gcalError:false}:x)})); }catch(e){} }
      }catch(e){ setGcalStatus("reconnect"); }
      setGcalBusy(false);
    },
    switchAccount:async ()=>{
      if(IS_FILE){ alert("Open the live app first:\n\n"+LIVE_URL); return; }
      setGcalBusy(true);
      try{
        try{ localStorage.removeItem("sp_gaccount"); }catch(e){}
        _gaccount=null; _tokenClient=null; _accessToken=null; _tokenExpiry=0;
        await getToken({force:true, prompt:"select_account"});
        setData(d=>({...d,gcalEnabled:true}));
        setGcalStatus("on");
        await resync();
      }catch(e){ setGcalStatus(s=>s==="on"?"on":"reconnect"); }
      setGcalBusy(false);
    },
    syncNow:async ()=>{
      if(!dataRef.current.gcalEnabled) return;
      try{ await getToken(); setGcalStatus("on"); await resync(); }
      catch(e){ setGcalStatus("reconnect"); }
    },

    addGoal:(title)=>mutate(d=>({...d,goals:[...d.goals,{id:uid(),title,date:"",steps:[]}]})),
    updateGoal:(id,patch)=>mutate(d=>({...d,goals:d.goals.map(g=>g.id===id?{...g,...patch}:g)})),
    delGoal:(id)=>mutate(d=>({...d,goals:d.goals.filter(g=>g.id!==id)})),
    addStep:(gid,text)=>mutate(d=>({...d,goals:d.goals.map(g=>g.id===gid?{...g,steps:[...g.steps,{id:uid(),text,done:false}]}:g)})),
    toggleStep:(gid,sid)=>mutate(d=>({...d,goals:d.goals.map(g=>g.id===gid?{...g,steps:g.steps.map(s=>s.id===sid?{...s,done:!s.done}:s)}:g)})),
    delStep:(gid,sid)=>mutate(d=>({...d,goals:d.goals.map(g=>g.id===gid?{...g,steps:g.steps.filter(s=>s.id!==sid)}:g)})),

    exportData:()=>{ const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="planner-backup-"+todayStr()+".json"; a.click(); URL.revokeObjectURL(url); },
    importData:()=>{ if(fileRef.current) fileRef.current.click(); },
  };

  const onFile=(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(confirm("Replace your current planner data with this backup?")){ const m=migrate(d); setData(m); saveData(m); } }catch(err){ alert("That file isn't a valid planner backup."); } }; r.readAsText(f); e.target.value=""; };

  return (
    <div>
      <header style={{position:"sticky",top:0,zIndex:5,background:"var(--paper)",borderBottom:"0.5px solid var(--line)",padding:"15px 0 0"}}>
        <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:10}}><div style={{fontFamily:"var(--serif)",fontSize:18,color:"var(--ink)"}}>Study planner</div><div style={{fontSize:12,color:"var(--ink-3)"}}>2nd-year medicine · Plzeň</div></div>
        <nav style={{display:"flex",gap:18,marginTop:6,overflowX:"auto"}}>{TABS.map(([id,label])=>(<button key={id} className="navbtn" aria-current={tab===id} onClick={()=>setTab(id)} style={{whiteSpace:"nowrap"}}>{label}</button>))}</nav>
      </header>

      {IS_FILE && (
        <div style={{background:"#FBEAE5",border:"0.5px solid #E7B7A8",color:"#7A2E12",borderRadius:"var(--r-lg)",padding:"12px 14px",marginTop:14,fontSize:13.5,lineHeight:1.5}}>
          <strong>You’ve opened the offline file.</strong> Sign-in, reminders and sync don’t work here. Open the live app instead:<br/>
          <a href={LIVE_URL} style={{color:"#7A2E12",fontWeight:600,wordBreak:"break-all"}}>{LIVE_URL}</a>
        </div>
      )}

      {tab==="today" && <TodayView data={data} A={A} gcalStatus={gcalStatus}/>}
      {tab==="plan" && <PlanView data={data} A={A}/>}
      {tab==="progress" && <ProgressView data={data} A={A}/>}
      {tab==="goals" && <GoalsView data={data} A={A}/>}
      {tab==="health" && <HealthView data={data} A={A}/>}
      {tab==="timeline" && <TimelineView/>}

      <input ref={fileRef} type="file" accept="application/json,.json" onChange={onFile} style={{display:"none"}}/>

      <footer style={{marginTop:30}}>
        <hr className="rule"/>
        <p style={{fontSize:11.5,color:"var(--ink-3)",lineHeight:1.6,marginTop:12}}>Everything you tick, add or edit saves automatically. Tasks with a time sync to Google Calendar once reminders are on. Keep <span style={{fontFamily:"var(--mono)"}}>physio_flashcards.html</span> at the same address so the flashcard links open.</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
