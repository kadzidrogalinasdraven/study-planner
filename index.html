                          <div style={{fontSize:11.5,color:"var(--ink-3)",marginTop:2}}>{fmtEventTime(e)}{e.location?" · "+e.location:""}{e.source?" · "+e.source:""}</div>
                          {e.postUrl && <a href={e.postUrl} target="_blank" rel="noopener noreferrer" className="chip" style={{marginTop:6,fontSize:11,padding:"3px 9px"}}><i className="fa-brands fa-instagram" style={{color:"#C13584"}} aria-hidden="true"/> Open post <i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:9,opacity:.6}} aria-hidden="true"/></a>}

/* ── task composer + item ────────────────────────────────────────── */
function TaskComposer({onAdd}){
  const [text,setText]=useState("");
  const [time,setTime]=useState("");
  const [date,setDate]=useState(todayStr());
  const [important,setImportant]=useState(false);
  const add=()=>{ const t=text.trim(); if(!t) return; onAdd({text:t,time:time||null,date:date||todayStr(),important}); setText(""); setTime(""); setDate(todayStr()); setImportant(false); };
  return (
    <div style={{marginTop:10}}>
      <input className="txtin" placeholder="Add a plan or task…" value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")add();}}/>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:8,alignItems:"center"}}>
        <input className="sm" type="time" value={time} onChange={e=>setTime(e.target.value)} aria-label="Time"/>
        <input className="sm" type="date" value={date} onChange={e=>setDate(e.target.value)} aria-label="Date"/>
        <button className="sm" onClick={()=>setImportant(v=>!v)} aria-pressed={important} style={{color:important?"var(--warn)":"var(--ink-3)",borderColor:important?"var(--warn)":"var(--line-2)",display:"inline-flex",alignItems:"center",gap:6}}>
          <i className={important?"fa-solid fa-star":"fa-regular fa-star"} aria-hidden="true"/> Important
        </button>
        <button className="ln-btn" style={{marginLeft:"auto"}} onClick={add}><i className="fa-solid fa-plus" aria-hidden="true"/> Add</button>
      </div>
      {!time && text && <div style={{fontSize:11.5,color:"var(--ink-3)",marginTop:6}}>No time set — this stays a checklist item with no reminder.</div>}
    </div>
  );
}

function TaskItem({task, A, gcalOn}){
  const [editing,setEditing]=useState(false);
  const [text,setText]=useState(task.text);
  const [time,setTime]=useState(task.time||"");
  const [date,setDate]=useState(task.date||todayStr());
  const [important,setImportant]=useState(!!task.important);
  const overdue = !task.done && task.date < todayStr();
  const save=()=>{ A.updateTask(task.id,{text:text.trim()||task.text,time:time||null,date:date||todayStr(),important}); setEditing(false); };
  return (
    <div style={{padding:"10px 0",borderBottom:"0.5px solid var(--line)"}}>
      {!editing ? (
        <div style={{display:"flex",alignItems:"flex-start",gap:11}}>
          <input type="checkbox" className="cb" style={{"--ck":"var(--accent)",marginTop:1}} checked={task.done} onChange={()=>A.toggleTask(task.id)} aria-label="Mark task done"/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14,color:"var(--ink)",opacity:task.done?.5:1,textDecoration:task.done?"line-through":"none",display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
              {task.important && <i className="fa-solid fa-star" style={{color:"var(--warn)",fontSize:11}} aria-hidden="true"/>}
              {task.text}
            </div>
            <div style={{fontSize:12,color:overdue?"var(--warn)":"var(--ink-3)",marginTop:2,display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
              <span>{overdue?"overdue · ":""}{fmtTaskWhen(task)}</span>
              {gcalOn && task.time && task.gcalId && !task.gcalError && <span style={{color:UI.accent}}><i className="fa-regular fa-calendar-check" aria-hidden="true"/> reminder set</span>}
              {gcalOn && task.time && task.gcalError && <button onClick={()=>A.retryTask(task.id)} style={{background:"none",border:0,color:"var(--warn)",padding:0,fontSize:12}}><i className="fa-solid fa-triangle-exclamation" aria-hidden="true"/> not synced — retry</button>}
            </div>
          </div>
          <button className="iconbtn" onClick={()=>setEditing(true)} aria-label="Edit task"><i className="fa-solid fa-pen" style={{fontSize:12}} aria-hidden="true"/></button>
          <button className="iconbtn" onClick={()=>A.deleteTask(task.id)} aria-label="Delete task"><i className="fa-solid fa-xmark" aria-hidden="true"/></button>
        </div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <input className="txtin" value={text} onChange={e=>setText(e.target.value)}/>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
            <input className="sm" type="time" value={time} onChange={e=>setTime(e.target.value)}/>
            <input className="sm" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
            <button className="sm" onClick={()=>setImportant(v=>!v)} style={{color:important?"var(--warn)":"var(--ink-3)",borderColor:important?"var(--warn)":"var(--line-2)",display:"inline-flex",alignItems:"center",gap:6}}><i className={important?"fa-solid fa-star":"fa-regular fa-star"} aria-hidden="true"/> Important</button>
            <button className="ln-btn" onClick={save}><i className="fa-solid fa-check" aria-hidden="true"/> Save</button>
            <button className="ln-btn" onClick={()=>{setEditing(false);setText(task.text);setTime(task.time||"");setDate(task.date||todayStr());setImportant(!!task.important);}}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

const KIND_LABEL = { lecture:"lecture", practical:"practical", seminar:"seminar" };
function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }

function ClassRow({s, isToday, dense}){
  const subj=SUBJECT[s.subject]; if(!subj) return null;
  const nm=nowMinutes();
  const live = isToday && !s.cancelled && nm>=hm(s.start) && nm<hm(s.end);
  const past = isToday && nm>=hm(s.end);
  const next = isToday && !s.cancelled && !live && !past;
  return (
    <div style={{display:"flex",alignItems:"flex-start",gap:10,padding:dense?"6px 0":"8px 0",borderTop:"0.5px solid var(--line)",opacity:(s.cancelled||past)?.55:1}}>
      <span className="num" style={{fontFamily:"var(--mono)",fontSize:11.5,color:"var(--ink-2)",flex:"none",width:88,paddingTop:2}}>{s.start}–{s.end}</span>
      <span style={{marginTop:5}}><Dot color={subj.color} size={8}/></span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13.5,color:"var(--ink)",display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",textDecoration:s.cancelled?"line-through":"none"}}>
          {subj.short}
          <span style={{fontSize:10,padding:"1px 7px",borderRadius:10,background:s.kind==="lecture"?subj.color+"18":"var(--paper-2)",color:s.kind==="lecture"?subj.color:"var(--ink-3)"}}>{KIND_LABEL[s.kind]||s.kind}</span>
          {live && <span style={{fontSize:10,padding:"1px 7px",borderRadius:10,background:UI.accent,color:"#fff"}}>now</span>}
          {s.cancelled && <span style={{fontSize:10,padding:"1px 7px",borderRadius:10,background:"#B0203A14",color:"#B0203A"}}>cancelled</span>}
          {s.confirm && <span style={{fontSize:10,padding:"1px 7px",borderRadius:10,background:"#B4530914",color:"var(--warn)"}}>confirm in SIS</span>}
          {s.weeks!=="all" && !dense && <span style={{fontSize:10,color:"var(--ink-3)"}}>every second week</span>}
        </div>
        {s.today && <div style={{fontSize:12,color:"var(--ink-2)",marginTop:2,lineHeight:1.45}}>{s.today}</div>}
        <div style={{fontSize:11.5,color:"var(--ink-3)",marginTop:1}}>
          {s.place ? s.place : "room not shown"}{!dense && s.teacher ? " · "+s.teacher : ""}
        </div>
        {s.note && !dense && !s.cancelled && <div style={{fontSize:11.5,color:"var(--ink-3)",marginTop:1}}>{s.note}</div>}
      </div>
    </div>
  );
}

/* Today's classes, next one first in your eye. Sits under the countdown because on a teaching day
   it is the thing you actually need to know at 07:40. */
function ClassesToday({today}){
  const list=classesOn(today);
  const term=termOf(today);
  const total=classHours(today);
  const nm=nowMinutes();
  const upcoming=list.filter(function(s){ return !s.cancelled && nm<hm(s.start); });
  const nextIn = upcoming.length ? hm(upcoming[0].start)-nm : null;
  return (
    <div style={{background:"var(--card)",border:"0.5px solid var(--line)",borderRadius:"var(--r-lg)",padding:"12px 15px",marginTop:10}}>
      <div style={{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:13.5,color:"var(--ink)"}}>Today’s classes</span>
        <span style={{fontSize:11.5,color:"var(--ink-3)",flex:1}}>
          {!term ? "no teaching" : list.length ? Math.round(total*10)/10+" h · teaching week "+teachWeek(today)+" ("+(teachWeek(today)%2===0?"even":"odd")+")" : "none"}
        </span>
        {nextIn!==null && <span style={{fontSize:11.5,color:UI.accent}}>next in {nextIn>=60?Math.floor(nextIn/60)+" h "+(nextIn%60)+" min":nextIn+" min"}</span>}
      </div>
      {!term && <p style={{fontSize:12.5,color:"var(--ink-3)",margin:"6px 0 0"}}>
        {today<TERMS.winter.from ? "Winter teaching opens "+fmtLong(TERMS.winter.from)+"." : "Outside the teaching weeks."}
      </p>}
      {term && !list.length && <p style={{fontSize:12.5,color:"var(--ink-3)",margin:"6px 0 0"}}>
        {PUBLIC_HOLIDAYS[today] ? "Public holiday — "+PUBLIC_HOLIDAYS[today]+". No classes." : "Nothing timetabled today."}
      </p>}
      {list.length>0 && <div style={{marginTop:6}}>{list.map(function(s){ return <ClassRow key={s.id} s={s} isToday={true}/>; })}</div>}
    </div>
  );
}

/* One compact line per day on the Plan tab, so the study budget is read next to the contact
   hours it has to fit around. */
function ClassLine({date}){
  const list=classesOn(date).filter(function(s){ return !s.cancelled; });
  if(!list.length) return null;
  const subs=[]; list.forEach(function(s){ const n=SUBJECT[s.subject].short; if(subs.indexOf(n)<0) subs.push(n); });
  return (
    <div style={{fontSize:11.5,color:"var(--ink-3)",margin:"-4px 0 10px",display:"flex",gap:8,flexWrap:"wrap"}}>
      <i className="fa-regular fa-clock" style={{fontSize:10,marginTop:4}} aria-hidden="true"/>
      <span>classes {classSpan(date)} · {Math.round(classHours(date)*10)/10} h · {subs.join(", ")}</span>
    </div>
  );
}

          </div>
        );
      })}

      <div style={{marginTop:14,padding:"11px 14px",background:"var(--card)",border:"0.5px solid var(--line)",borderRadius:"var(--r-lg)"}}>
        <div style={{fontSize:12.5,color:"var(--ink-2)",lineHeight:1.6}}>
          <strong style={{color:"var(--ink)"}}>Every second week.</strong> SIS counts <em>teaching</em> weeks, and week 1 is the
          week of 1 October — so its “even” is an odd calendar week. Simulation Medicine (even) runs on

/* The date you book in SIS. Until it is set, everything paces to the first day of the period. */
function ExamDateEditor({exam, data, A, compact}){
  const w=examWhen(exam,data);
  const [open,setOpen]=useState(false);
  const [iso,setIso]=useState(w.iso);
  const [time,setTime]=useState(w.time||"09:00");
  if(!open) return (
    <button className="ln-btn" style={compact?{fontSize:12}:null} onClick={()=>{ setIso(w.booked?w.iso:w.from); setOpen(true); }}>
      <i className="fa-regular fa-calendar-plus" aria-hidden="true"/> {w.booked?"Change date":"Set date"}
    </button>
  );
  return (
    <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:7,marginTop:6}}>
      <input className="sm" type="date" value={iso} min={w.from} max={w.to} onChange={e=>setIso(e.target.value)} aria-label="Exam date"/>
      <input className="sm" type="time" value={time} onChange={e=>setTime(e.target.value)} aria-label="Exam time"/>
      <button className="ln-btn" onClick={()=>{ A.setExamDate(exam.id, iso, time); setOpen(false); }}>Save</button>
      {w.booked && <button className="iconbtn" style={{fontSize:12}} onClick={()=>{ A.setExamDate(exam.id, null); setOpen(false); }}>Clear</button>}
      <button className="iconbtn" style={{fontSize:12}} onClick={()=>setOpen(false)}>Cancel</button>
    </div>
  );
}

function Countdown({data, A}){
  const ts=todayStr();
  const m=nextMilestone(data, ts);
  if(!m) return (

function PhaseStrip({today}){

  const span=dateRange(p.from,p.to).length, gone=Math.max(0,Math.min(span,dayDiff(p.from,today)+1));

/* ── where each topic list came from, and how old it is ─────────────────────
   The full 2026/27 curricula are not published yet — some departments post the new edition only
   in October. Everything in CURRICULUM is therefore the most recent list that exists, which is
   not the same as the current one. Each block carries a `src`, and every screen that shows
   topics shows the age of the list it is showing, so a stale list can never be revised by
   accident. Statuses, worst to best:

     none     no official topic list is published at all — a syllabus is standing in
     old      a real question list, but from a previous academic year
     prefinal the 2026/27 list, but the department has said it will still change
     recent   the current list, with no academic year printed on it
     current  explicitly the 2026/27 edition
*/
const SRC_STATUS = {
  current: { label:"2026/27",        tone:"#0F6E56", bg:"#0F6E5614" },
  recent:  { label:"current",        tone:"#6E6757", bg:"var(--paper-2)" },
  prefinal:{ label:"2026/27 · pre-final", tone:"#B45309", bg:"#B4530914" },
  old:     { label:"a year behind",  tone:"#B45309", bg:"#B4530914" },
  none:    { label:"no official list", tone:"#B45309", bg:"#B4530914" },
  stale:   { label:"contradicted",   tone:"#B0203A", bg:"#B0203A14" },
};

function SourceBadge({src, compact}){
  const s = SOURCES[src]; if(!s) return null;
  const t = SRC_STATUS[s.status] || SRC_STATUS.recent;
  return (
    <span title={s.label+" · "+s.where+(s.note?" — "+s.note:"")}
      style={{fontSize:10,padding:"1px 7px",borderRadius:10,background:t.bg,color:t.tone,whiteSpace:"nowrap"}}>
      {compact ? t.label : "list: "+t.label}
    </span>
  );
}

/* The worst status across a subject's blocks — a subject is only as trustworthy as its weakest
   topic list, and that is the one worth surfacing on the card. */
const SRC_RANK = { stale:0, none:1, old:2, prefinal:3, recent:4, current:5 };
function worstSource(subjectId){
  const blocks = BLOCKS_OF[subjectId]||[];
  let worst = null;
  blocks.forEach(function(b){
    const s = SOURCES[b.src]; if(!s) return;
    if(!worst || SRC_RANK[s.status] < SRC_RANK[worst.status]) worst = s;
  });
  return worst;
}

function SubjectCard({s, data, A, today, over}){
  const cov=coverageOf(s.id, data);
  const pace=paceOf(s, data, today);
  const exam=s.examId ? EXAMS.filter(function(e){ return e.id===s.examId; })[0] : null;
  const w=exam?examWhen(exam,data):null;
  const due=deadlineOf(s, data);
  const d=daysUntil(w?w.iso:due);
  const blocks=BLOCKS_OF[s.id]||[];
  const worst=worstSource(s.id);
  const worstKey=worst ? Object.keys(SOURCES).filter(function(k){ return SOURCES[k]===worst; })[0] : null;
  const [rules,setRules]=useState(false);
  // behind = this subject is in the overflow list, i.e. the year projection could not place
  // all of it before its deadline. One source of truth, shared with the banner.
  const behind = !!(over && over.some(function(x){ return x.id===s.id && x.topics>=OVERFLOW_MIN_TOPICS; }));
  return (
    <div style={{border:`0.5px solid ${cov.pct===100?s.color+"55":"var(--line)"}`,borderRadius:"var(--r-lg)",background:"var(--card)",padding:"13px 15px",marginBottom:10}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:11}}>
        <span style={{marginTop:4}}><Dot color={s.color} size={10}/></span>
        <div style={{flex:1,minWidth:0}}>
          <button onClick={()=>A.go("progress", s.id)} style={{background:"none",border:0,padding:0,textAlign:"left",width:"100%"}}>
            <div style={{fontSize:15,color:"var(--ink)",lineHeight:1.3}}>{s.title}</div>
          </button>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginTop:5}}>
            <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:"var(--ink-3)"}}>{s.sis}</span>
            <span style={{fontSize:10,padding:"1px 8px",borderRadius:10,background:"var(--paper-2)",color:"var(--ink-3)"}}>{s.ects} credits</span>
            {s.sem!=="summer" && s.completion.winter && <CompletionBadge kind={s.completion.winter} color={s.color}/>}
            {s.sem!=="winter" && s.completion.summer && <CompletionBadge kind={s.completion.summer} color={s.color}/>}
            {worst && <SourceBadge src={worstKey}/>}
          </div>
        </div>
        <div style={{textAlign:"right",flex:"none"}}>
          <div className="num" style={{fontFamily:"var(--serif)",fontSize:24,color:s.color,lineHeight:1}}>{d<0?"–":d}</div>
          <div style={{fontSize:10,color:"var(--ink-3)"}}>days</div>
        </div>
      </div>

      {cov.total>0 && <div style={{display:"flex",alignItems:"center",gap:9,marginTop:11}}>
        <ProgressBar pct={cov.pct} color={s.color} h={5}/>
        <span style={{fontSize:11.5,color:"var(--ink-3)",flex:"none"}}>{cov.done}/{cov.total}</span>
      </div>}

      <div style={{fontSize:12,color:"var(--ink-2)",marginTop:8,lineHeight:1.5}}>
        {exam
          ? (w.booked
              ? <>Exam booked <strong>{fmtLong(w.iso)}</strong>{w.time?" · "+w.time:""} · {w.place}</>
              : <>{w.periodLabel} · {fmtShort(w.from)} – {fmtShort(w.to)} · <span style={{color:"var(--warn)"}}>date not booked</span></>)
          : <>Credit due {fmtLong(due)} — no exam</>}
      </div>
      {(DEADLINES_OF[s.id]||[]).filter(function(x){ return x.iso>=today; }).map(function(x){ return (
        <div key={x.id} style={{marginTop:7,padding:"7px 10px",borderLeft:"2px solid "+s.color,background:s.color+"0c",borderRadius:"0 var(--r-md) var(--r-md) 0"}}>
          <div style={{fontSize:12.5,color:"var(--ink)"}}>{x.label} · {fmtDay(x.iso)}, {x.time} <span style={{color:"var(--ink-3)"}}>· {countLabel(daysUntil(x.iso))}</span></div>
          <div style={{fontSize:11.5,color:"var(--ink-3)",marginTop:2,lineHeight:1.45}}>{x.detail}</div>
          {x.confirm && <div style={{fontSize:11.5,color:"var(--warn)",marginTop:2,lineHeight:1.45}}>{x.confirm}</div>}
        </div>
      ); })}
      {cov.total>0 && pace.remaining>0 && (
        <div style={{fontSize:12,color:behind?"var(--warn)":"var(--ink-3)",marginTop:3}}>
          {pace.remaining} topic{pace.remaining>1?"s":""} left · about {pace.perWeek} a week to be ready · {s.hrsRange} h each
        </div>
      )}
      {cov.total===0 && <div style={{fontSize:12,color:"var(--ink-3)",marginTop:3}}>No topic list captured yet.</div>}
      {s.note && <div style={{fontSize:11.5,color:"var(--ink-3)",marginTop:5,fontStyle:"italic"}}>{s.note}</div>}
      {(s.examFormat||s.creditRule) && (
        <div style={{marginTop:8}}>
          <button className="iconbtn" style={{fontSize:11.5,color:"var(--ink-3)"}} onClick={()=>setRules(r=>!r)}>
            <i className={"fa-solid fa-chevron-"+(rules?"up":"down")} style={{fontSize:9,marginRight:6}} aria-hidden="true"/>
            How it is assessed
          </button>
          {rules && <>
            <div style={{marginTop:6,padding:"9px 11px",background:"var(--paper-2)",borderRadius:"var(--r-md)"}}>
              {s.examFormat && <div style={{fontSize:12,color:"var(--ink-2)",lineHeight:1.5}}>
                <strong style={{color:"var(--ink)"}}>Exam.</strong> {s.examFormat}</div>}
              {s.creditRule && <div style={{fontSize:12,color:"var(--ink-2)",lineHeight:1.5,marginTop:s.examFormat?6:0}}>
                <strong style={{color:"var(--ink)"}}>Credit.</strong> {s.creditRule}</div>}

                <strong style={{color:"var(--ink)"}}>Topic list.</strong> {worst.label} · {worst.edition}. {worst.where}.{worst.note?" "+worst.note:""}</div>}

          <i className="fa-regular fa-square-check" aria-hidden="true"/> Topics
        </button>
        <span style={{fontSize:11,color:"var(--ink-3)"}}>{blocks.length} block{blocks.length===1?"":"s"} · dept {s.dept}</span>
      </div>

function SubjectsView({data, A}){
  const today=todayStr();

              <div style={{position:"relative",marginBottom:18,opacity:past?.72:1}}>
                <span style={{position:"absolute",left:-22,top:4,width:it.big?12:9,height:it.big?12:9,borderRadius:"50%",background:it.kind==="exam"?c:"var(--paper)",border:`2px solid ${c}`,boxSizing:"border-box"}}/>

          <span style={{position:"absolute",left:-26,top:1,width:17,height:17,borderRadius:"50%",background:"var(--paper)",border:"2px solid "+UI.accent,boxSizing:"border-box"}}/>
          <div style={{fontSize:12.5,color:UI.accent,fontWeight:500}}>you are here — {fmtLong(ts)}</div>

function FieldBlock({field, data, A, color, startOpen}){
  const [open,setOpen]=useState(!!startOpen);
  const codes=field.topics.map(t=>t[0]);
  const live=codes.filter(c=>tierOf(c,data)!=="skip");
  const dn=live.filter(c=>data.done[c]).length, tot=live.length, pct=tot?Math.round(dn/tot*100):0;
  const allDone=tot>0 && dn===tot;
  const skipped=live.length===0 && codes.length>0;
  const [cel,setCel]=useState(false);
  const prev=useRef(allDone);
  useEffect(function(){
    if(allDone && !prev.current){ setCel(true); haptic(); const t=setTimeout(function(){ setCel(false); },1600); prev.current=allDone; return function(){ clearTimeout(t); }; }
    prev.current=allDone;
  },[allDone]);
  return (
    <div className={cel?"field-done":""} style={{border:"0.5px solid var(--line)",borderRadius:"var(--r-lg)",background:"var(--card)",marginBottom:10,overflow:"hidden",opacity:skipped?.6:1}}>
      {cel && <div className="microtoast"><i className="fa-solid fa-circle-check" style={{marginRight:7}} aria-hidden="true"/>{field.name} complete</div>}
      <div style={{display:"flex",alignItems:"center",gap:11,padding:"12px 14px"}}>
        <button onClick={()=>setOpen(o=>!o)} style={{flex:1,minWidth:0,textAlign:"left",background:"none",border:0,padding:0,display:"flex",alignItems:"center",gap:11}}>
          <i className={"fa-solid fa-chevron-"+(open?"down":"right")} style={{fontSize:11,color:"var(--ink-3)",flex:"none"}} aria-hidden="true"/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14.5,color:"var(--ink)",display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>{field.name}
              {field.sem && <span style={{fontSize:10,padding:"1px 7px",borderRadius:10,background:"var(--paper-2)",color:"var(--ink-3)"}}>{field.sem==="winter"?"winter":field.sem==="summer"?"summer":"both"}</span>}
              {field.src && <SourceBadge src={field.src} compact/>}
            </div>
            {skipped
              ? <div style={{fontSize:11.5,color:"var(--ink-3)",marginTop:5}}>skipped — not scheduled and not counted</div>
              : <div style={{display:"flex",alignItems:"center",gap:8,marginTop:5}}><ProgressBar pct={pct} color={color}/><span style={{fontSize:11,color:"var(--ink-3)",flex:"none"}}><AnimatedNumber value={dn}/>/{tot}</span></div>}
          </div>
        </button>
        <button className="iconbtn" style={{fontSize:11,flex:"none",color:allDone?"var(--ink-3)":"var(--accent)"}} onClick={()=>A.setMany(live,!allDone)} title={allDone?"Clear all":"Mark all done"}>{allDone?"clear":"all done"}</button>
      </div>
      {open && (
        <div style={{padding:"0 14px 10px"}}>
          <hr className="rule" style={{marginBottom:8}}/>
          {field.topics.map(function(t){
            const code=t[0], title=t[1], sk=tierOf(code,data)==="skip";
            return (
              <div key={code} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0"}}>
                <input type="checkbox" className="cb" style={{"--ck":color,width:16,height:16}} disabled={sk} checked={!!data.done[code]} onChange={()=>A.toggleDone(code)} aria-label={"Mark "+title+" done"}/>
                <span style={{fontFamily:"var(--mono)",fontSize:10,color:color,flex:"none",width:48}}>{code}</span>
                <span className={"strike"+(data.done[code]||sk?" on":"")} style={{flex:1,fontSize:13.5,color:"var(--ink-2)",opacity:(data.done[code]||sk)?.5:1,transition:"opacity .28s"}}>{title}</span>
                <button className="iconbtn" style={{fontSize:10.5,flex:"none",color:sk?"var(--warn)":"var(--ink-3)"}}
                  title={sk?"Bring this topic back into the plan":"Skip this topic — never scheduled, never counted"}
                  onClick={()=>A.setSkip(code, !sk)}>
                  <i className={sk?"fa-solid fa-rotate-left":"fa-solid fa-ban"} aria-hidden="true"/>
                </button>
              </div>
            );
          })}
          <button className="iconbtn" style={{fontSize:11,marginTop:6,color:"var(--ink-3)"}}
            onClick={()=>A.setSkipMany(codes, !skipped)}>
            {skipped?"un-skip this block":"skip this whole block"}
          </button>
        </div>
      )}
    </div>
  );
}

/* ── productivity — rings ─────────────────────────────────────────────
   Arcs animate via a CSS transition on stroke-dashoffset, deliberately NOT rAF: the blanket
   prefers-reduced-motion rule already forces transition:none !important, so reduced motion lands
   instantly for free, with no separate code path to get wrong. The stagger timers are the one
   thing CSS can't cover, so those are skipped explicitly when reduced motion is on.

   Replay on every tab entry needs no machinery: views are conditionally rendered, so leaving the
   tab unmounts this and coming back remounts it. Mount-time animation replays by construction. */
const RING_EASE = "cubic-bezier(.215,.61,.355,1)";   // the curve form of AnimatedNumber's 1-(1-p)³
const RING_MS   = 800;

function useRingArm(delay){
  const [on,setOn]=useState(prefersReduced());
  useEffect(function(){
    if(prefersReduced()) return;                  // already true; nothing to schedule
    // useEffect runs after the commit has painted, and the timeout puts another frame between
    // the empty state and the target — enough for the transition to have something to run from
    const t=setTimeout(function(){ setOn(true); }, Math.max(30, delay||0));
    return function(){ clearTimeout(t); };
  },[]);
  return on;
}

/* ── past 100% ────────────────────────────────────────────────────────
   A full ring has nowhere left to go, so the surplus runs as a second, thinner lap just outside
   it: one orbit per extra 100%, drawn once the main lap has closed. Two are enough — languages
   top out at seven days against a three-day cadence, which is 233%.

   The orbits are ALWAYS in the DOM, at zero length when there is nothing to show, rather than
   mounted when the score first passes 100. An arc that mounts at its final length has nothing to
   transition from, so it would snap into place where every other arc on the page glides. */
const ORBIT_MAX = 2;
const ORBIT_MS  = 480;

/* The orbit waits for the main lap only while the ring is making its entrance. After that a tick
   has to move it at once: a pause of most of a second before the arc answers reads as a missed
   tap. This is a stagger timer, so like useRingArm it needs its own reduced-motion branch. */
function useRingSettled(delay){
  const [done,setDone]=useState(prefersReduced());
  useEffect(function(){
    if(prefersReduced()) return;
    const t=setTimeout(function(){ setDone(true); }, (delay||0)+RING_MS+ORBIT_MAX*ORBIT_MS+200);
    return function(){ clearTimeout(t); };
  },[]);
  return done;
}

function Ring({size, stroke, pct, color, overColor, delay, segments, children}){
  const r=(size-stroke)/2, C=2*Math.PI*r, cx=size/2;
  const on=useRingArm(delay);
  const settled=useRingSettled(delay);
  const tr={ transition:"stroke-dashoffset "+RING_MS+"ms "+RING_EASE };
  const thin=Math.max(2.5, stroke*0.4), gap=thin*0.8;
  const extra=Math.max(0, (pct||0)-100)/100;          // laps beyond the first: 1.33 at 233%
  const orbits=[];
  for(let k=0;k<ORBIT_MAX;k++){
    const f=Math.max(0, Math.min(1, extra-k));
    const ro=r+stroke/2+gap+thin/2+k*(thin+gap), Co=2*Math.PI*ro;
    const wait=settled ? 0 : Math.round(RING_MS*0.75)+k*ORBIT_MS;
    /* opacity is what guarantees an empty orbit is invisible: a zero-length dash with a round
       cap still paints a dot in some engines. It switches on the instant the arc starts to grow
       and off only after it has finished retracting. */
    orbits.push(<circle key={"orbit"+k} cx={cx} cy={cx} r={ro} fill="none" stroke={overColor||color} strokeWidth={thin} strokeLinecap="round"
      strokeDasharray={Co} style={{strokeDashoffset:(on ? Co*(1-f) : Co)+"px", opacity:(on&&f>0)?1:0,
        transition:"stroke-dashoffset "+ORBIT_MS+"ms "+RING_EASE+" "+wait+"ms, opacity 0ms linear "+(f>0?wait:ORBIT_MS)+"ms"}}/>);
  }
  return (
    <div style={{position:"relative",width:size,height:size,flex:"none"}}>
      {/* overflow is visible because the orbits sit outside the ring's own box */}
      <svg width={size} height={size} viewBox={"0 0 "+size+" "+size} style={{transform:"rotate(-90deg)",display:"block",overflow:"visible"}} aria-hidden="true">
        <circle cx={cx} cy={cx} r={r} fill="none" stroke="var(--line)" strokeWidth={stroke}/>
        {/* dashoffset goes in style, not as a presentation attribute: transitions on attributes
            are spec-legal but inconsistently honoured, and style leaves nothing to chance */}
        {segments && segments.length
          ? segments.map(function(s,i){
              const startFrac=segments.slice(0,i).reduce(function(a,x){ return a+x.frac; },0);
              const len=C*s.frac;
              return <circle key={i} cx={cx} cy={cx} r={r} fill="none" stroke={s.color} strokeWidth={stroke}
                strokeDasharray={len+" "+C} style={Object.assign({strokeDashoffset:(on?0:len)+"px"},tr)}
                transform={"rotate("+(startFrac*360)+" "+cx+" "+cx+")"}/>;
            })
          : <circle cx={cx} cy={cx} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
              strokeDasharray={C} style={Object.assign({strokeDashoffset:(on ? C*(1-Math.min(100,pct)/100) : C)+"px"},tr)}/>}
        {orbits}
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",lineHeight:1.15}}>{children}</div>
    </div>
  );
}

/* value is held at 0 until the arc starts, so the numeral counts up in step with its own ring */
function useStaggeredValue(value, delay){
  const [v,setV]=useState(prefersReduced()?value:0);
  useEffect(function(){
    if(prefersReduced()){ setV(value); return; }
    const t=setTimeout(function(){ setV(value); }, Math.max(20, delay||0));
    return function(){ clearTimeout(t); };
  },[value,delay]);
  return v;
}

function CategoryRing({c, delay, note, noteWarn}){
  const shown=useStaggeredValue(c.pct, delay);
  // extra days push the two arcs past a full circle, which would wrap the second segment over
  // the first — normalise so the main lap is always the Czech : Italian split of what was
  // logged. The surplus itself is not drawn here; Ring adds it as an orbit from c.pct.
  let segs=null;
  if(c.key==="lang" && c.d>0 && (c.split.czech+c.split.italian)>0){
    let cz=c.split.czech/c.d, it=c.split.italian/c.d;
    const sum=cz+it;
    if(sum>1){ cz/=sum; it/=sum; }
    segs=[{frac:cz,color:LANGC.czech},{frac:it,color:LANGC.italian}];
  }
  return (
    <div style={{border:"0.5px solid var(--line)",borderRadius:"var(--r-lg)",background:"var(--card)",padding:"14px 10px",display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
      <Ring size={92} stroke={7} pct={c.pct} color={c.color} delay={delay} segments={segs}>
        <AnimatedNumber value={shown} suffix="%" dur={RING_MS} className="num" style={{fontFamily:"var(--serif)",fontSize:19,color:c.configured?c.color:"var(--ink-3)"}}/>
        <span style={{fontSize:10.5,color:"var(--ink-3)",marginTop:1}}>{c.n} / {c.d||"–"}</span>
      </Ring>
      <div style={{fontSize:13,color:"var(--ink)"}}>{c.label}</div>
      {c.key==="lang" && (
        <div style={{display:"flex",gap:9,fontSize:10.5,color:"var(--ink-3)"}}>
          <span style={{display:"inline-flex",alignItems:"center",gap:4}}><Dot size={6} color={LANGC.czech}/>cz {c.split.czech}</span>
          <span style={{display:"inline-flex",alignItems:"center",gap:4}}><Dot size={6} color={LANGC.italian}/>it {c.split.italian}</span>
        </div>
      )}
      {note && <div style={{fontSize:11,color:noteWarn?"var(--warn)":"var(--ink-3)",textAlign:"center",lineHeight:1.35}}>{note}</div>}
      {!c.configured && <div style={{fontSize:10.5,color:"var(--ink-3)",fontStyle:"italic"}}>not counted yet</div>}
    </div>
  );
}

/* `dashed` marks a box that is open but not expected: an extra day, beyond the target. */
function TickCell({on, color, late, onClick, label, dashed}){
  return (
    <button onClick={onClick} aria-pressed={on} aria-label={label}
      style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:0,padding:"5px 0"}}>
      <span style={{width:19,height:19,borderRadius:6,border:"1.5px "+(dashed&&!on?"dashed":"solid")+" "+(on?color:"var(--line-2)"),background:on?color:"var(--card)",display:"flex",alignItems:"center",justifyContent:"center",transition:"background .18s,border-color .18s"}}>
        {on && <i className="fa-solid fa-check" style={{fontSize:9,color:"#fff"}} aria-hidden="true"/>}
      </span>
      <span style={{fontSize:8,color:"var(--ink-3)",height:8,lineHeight:1}}>{late?"late":""}</span>
    </button>
  );
}

/* One box per planned topic. It is the very same tick as the checkbox on Today, Plan and
   Progress — A.toggleDone on data.done — so there is nothing to keep in step. `missed` is a box
   still open on a day that has already gone: it stays where it was due, outlined, and ticking
   it late still counts for the week. */
function TopicTick({code, done, missed, onClick}){
  const s=SUBJECT[SUBJECT_OF[code]], title=CODE_TITLE[code]||code;
  return (
    <button onClick={onClick} aria-pressed={done} title={title}
      aria-label={s.short+": "+title+(missed?" — still open from an earlier day":"")}
      style={{display:"flex",background:"none",border:0,padding:"1px 0"}}>
      <span style={{width:19,height:19,borderRadius:6,border:"1.5px solid "+(done?s.color:missed?"#B4530999":"var(--line-2)"),background:done?s.color:"var(--card)",display:"flex",alignItems:"center",justifyContent:"center",transition:"background .18s,border-color .18s"}}>
        {done && <i className="fa-solid fa-check" style={{fontSize:9,color:"#fff"}} aria-hidden="true"/>}
      </span>
    </button>
  );
}

/* The label column. Wide enough for "Pathophysiology" on one line, narrow enough that seven
   19px boxes still fit beside it on a 375px phone. */
const GRID_LABEL_W = 112;

function WeekGrid({data, A, week, plan}){
  const p=data.prod, t=todayStr();
  const langOf=d=>{ const e=p.lang.log[d]; return e ? (e.lang||langSuggest(d)) : null; };
  /* The boxes carry no words, so a tick says which topic it was. The timer only takes the toast
     away again; the way it arrives is a CSS animation, which reduced motion already covers. */
  const [said,setSaid]=useState(null);
  useEffect(function(){
    if(!said) return;
    const tm=setTimeout(function(){ setSaid(null); }, 2200);
    return function(){ clearTimeout(tm); };
  },[said]);
  const tickTopic=function(code){ setSaid({ code:code, on:!data.done[code], k:Date.now() }); A.toggleDone(code); };
  const rows=[
    { key:"gym", label:"Gym", color:()=>"#BE123C",
      on:d=>!!p.gym.log[d], late:d=>p.gym.log[d]&&loggedLate(d,p.gym.log[d].tickedAt),
      click:d=>A.tickGym(d, !p.gym.log[d]) },
    /* All seven days are open. A cadence day is a plain on/off, exactly as it always was. An
       extra day cycles suggested language → the other one → off, because nothing in the app
       knows which language an unscheduled session was; the tick takes that language's colour. */
    { key:"lang", label:"Languages", color:d=>LANGC[langOf(d)]||LANGC.czech,
      on:d=>!!p.lang.log[d], late:d=>p.lang.log[d]&&loggedLate(d,p.lang.log[d].tickedAt),
      dashed:d=>!langForDate(d),
      name:d=>{ const l=langOf(d); return (l?LANG[l].name:"Languages")+(langForDate(d)?"":" (extra day)"); },
      click:d=>{
        const sched=langForDate(d), cur=langOf(d);
        if(sched) return A.tickLang(d, cur?null:sched);
        const first=langSuggest(d);
        A.tickLang(d, !cur ? first : cur===first ? otherLang(first) : null);
      } },
  ];
  return (
    <div style={{border:"0.5px solid var(--line)",borderRadius:"var(--r-lg)",background:"var(--card)",padding:"12px 12px 6px",marginTop:16}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <span style={{width:GRID_LABEL_W,flex:"none",fontSize:11.5,color:"var(--ink-3)",textTransform:"uppercase",letterSpacing:".06em"}}>this week</span>
        {week.map(function(d){
          const isT=d===t;
          return <span key={d} style={{flex:1,textAlign:"center",fontSize:10.5,color:isT?"var(--ink)":"var(--ink-3)",fontWeight:isT?600:400}}>
            {parseISO(d).toLocaleDateString("en-GB",{weekday:"narrow"})}
          </span>;
        })}
      </div>
      {rows.map(function(r){
        return (
          <div key={r.key} style={{display:"flex",alignItems:"center",gap:8,borderTop:"0.5px solid var(--line)"}}>
            <span title={r.label} style={{width:GRID_LABEL_W,flex:"none",fontSize:12.5,color:"var(--ink-2)",overflow:"hidden",lineHeight:1.25}}>
              <span style={{display:"block",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.label}</span>
            </span>
            {week.map(function(d){
              return <TickCell key={d} on={r.on(d)} color={r.color(d)} late={r.late?r.late(d):false}
                dashed={r.dashed?r.dashed(d):false} onClick={()=>{haptic();r.click(d);}}
                label={(r.name?r.name(d):r.label)+" on "+fmtShort(d)}/>;
            })}
          </div>
        );
      })}

      {/* Coursework: the week as the Plan laid it out on Monday, one row per course, one box per
          topic, under the day it is planned for. */}
      <div style={{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap",borderTop:"0.5px solid var(--line)",padding:"9px 0 6px"}}>
        <span style={{fontSize:11.5,color:"var(--ink-3)",textTransform:"uppercase",letterSpacing:".06em"}}>coursework</span>
        <span style={{fontSize:11,color:"var(--ink-3)"}}>
          {plan.total>0
            ? plan.done+" of "+plan.total+" planned topics done"+(plan.extra>0?" · +"+plan.extra+" beyond the plan":"")
            : plan.extra>0 ? "nothing planned this week · "+plan.extra+" done anyway"
            : "nothing is planned for this week"}
        </span>
      </div>
      {plan.subjects.map(function(s){
        const row=plan.cells[s.id];
        return (
          <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,borderTop:"0.5px solid var(--line)"}}>
            <span title={s.title} style={{width:GRID_LABEL_W,flex:"none",display:"flex",alignItems:"flex-start",gap:6,fontSize:12,color:"var(--ink-2)",lineHeight:1.25,padding:"6px 0"}}>
              <span style={{flex:"none",marginTop:4,display:"flex"}}><Dot size={7} color={s.color}/></span>
              <span style={{minWidth:0}}>{s.short}</span>
            </span>
            {week.map(function(d){
              const c=row[d];
              return (
                <div key={d} style={{flex:1,minWidth:0,display:"flex",flexWrap:"wrap",justifyContent:"center",alignItems:"center",gap:"2px 3px",padding:"5px 0"}}>
                  {c && c.planned.map(function(code){
                    return <TopicTick key={code} code={code} done={!!data.done[code]} missed={d<t && !data.done[code]} onClick={()=>tickTopic(code)}/>;
                  })}
                  {c && c.extra.length>0 && (
                    <span title={c.extra.map(function(code){ return CODE_TITLE[code]||code; }).join("\n")}
                      style={{fontSize:10.5,color:s.color,lineHeight:1,padding:"2px 0"}}>+{c.extra.length}</span>
                  )}

            })}
          </div>

      })}

      {said && (
        <div key={said.k} className="microtoast" role="status" style={{maxWidth:"88vw",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
          <i className={said.on?"fa-solid fa-circle-check":"fa-regular fa-circle"} style={{marginRight:7}} aria-hidden="true"/>
          {said.on?"Done":"Open again"} · {CODE_TITLE[said.code]||said.code}
        </div>
      )}

      <div style={{fontSize:10.5,color:"var(--ink-3)",marginTop:8,paddingTop:6,borderTop:"0.5px solid var(--line)",lineHeight:1.55}}>
        Languages: solid boxes are the cadence days; dashed ones are extra and count beyond 100%.
        An extra day takes the language of the day before — tap again for the other
        (<span style={{whiteSpace:"nowrap"}}><Dot size={6} color={LANGC.czech}/> Czech</span>
        {" "}·{" "}<span style={{whiteSpace:"nowrap"}}><Dot size={6} color={LANGC.italian}/> Italian</span>),
        once more to clear.
        <br/>
        Coursework: one box per topic, under the day the Plan gives it — the week as laid out
        on Monday. It is the same tick as on Today and the Plan. A box still open on a day that
        has passed stays there, outlined. “+2” is work beyond this week’s list.
        <br/>
        “late” marks a gym or language day filled in more than a day afterwards.
      </div>
    </div>
  );
}

function ProductivityView({data, A}){
  const t=todayStr();
  const S=prodStats(data,t);
  const reduced=prefersReduced();
  const delayFor=i=>reduced?0:180+i*80;
  const combinedShown=useStaggeredValue(S.combined,0);
  const work=S.byKey.work;
  const [editing,setEditing]=useState(false);
  const [draft,setDraft]=useState(String(data.prod.gym.targetPerWeek||3));

  return (
    <div>
      <div className="eyebrow" style={{marginTop:18}}>this week · {fmtShort(S.week[0])} – {fmtShort(S.week[6])}</div>
      <h1 style={{fontSize:30,margin:"2px 0 14px"}}>Productivity</h1>

      {/* Nothing above the week grid may change height when a score crosses 100%: a ring that
          grew, or a line that appeared, would shove the grid down under the finger that had just
          ticked it, and the next tap would land on the wrong row. So the room for the orbit is
          reserved always (the padding here), and the second caption line is always present —
          it only changes what it says. */}
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,marginBottom:6,padding:"8px 0 0"}}>
        {/* neutral ink, not a category hue: the headline is an aggregate, and painting it in one
            category's colour made the two read as the same thing */}
        <Ring size={168} stroke={10} pct={S.combined} color="var(--ink-2)" overColor="var(--ink)" delay={0}>
          <AnimatedNumber value={combinedShown} suffix="%" dur={RING_MS} className="num" style={{fontFamily:"var(--serif)",fontSize:38,color:"var(--ink)"}}/>
          <span style={{fontSize:11.5,color:"var(--ink-3)",marginTop:2}}>combined</span>
        </Ring>
        <div style={{fontSize:11.5,color:"var(--ink-3)",textAlign:"center",marginTop:8}}>
          <div>coursework counts double · {S.counted} of 3 categories tracked</div>
          {S.bonus>0
            ? <div style={{color:"var(--ink-2)"}}>includes +{S.bonus}% from extra language days</div>
            : <div>extra language days count beyond 100%</div>}
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginTop:12}}>
        {S.cats.map(function(c,i){
          // the plan's own number for the week, and — only once something is actually overdue —
          // how many of its topics are still open on days that have passed
          const behind = c.key==="work" ? S.plan.behind : 0;
          const note = c.key==="work" && c.d>0
            ? c.d+" planned this week"+(behind>0 ? " · "+behind+" behind" : "")
            : null;
          return <CategoryRing key={c.key} c={c} delay={delayFor(i)} note={note} noteWarn={behind>0}/>;
        })}
      </div>

      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginTop:12}}>
        {editing ? (
          <>
            <span style={{fontSize:12.5,color:"var(--ink-2)"}}>Gym sessions / week</span>
            <input className="sm" type="number" min="0" max="14" value={draft} onChange={e=>setDraft(e.target.value)} style={{width:70}} aria-label="Weekly gym target"/>
            <button className="ln-btn" onClick={()=>{ const v=parseInt(draft,10); A.setGymTarget(isNaN(v)||v<0?3:v); setEditing(false); }}>Save</button>
          </>
        ) : (
          <button className="ln-btn" onClick={()=>{ setDraft(String(data.prod.gym.targetPerWeek||3)); setEditing(true); }}>
            <i className="fa-regular fa-pen-to-square" aria-hidden="true"/> Gym target · {data.prod.gym.targetPerWeek||0} / week
          </button>
        )}
      </div>

      <WeekGrid data={data} A={A} week={S.week} plan={S.plan}/>

      <p style={{fontSize:11.5,color:"var(--ink-3)",lineHeight:1.6,marginTop:14}}>
        Combined = weighted mean over the categories you actually track (coursework ×2, gym ×1,
        languages ×1). A category you haven’t set up is left out of the average entirely rather
        than counted as zero. Coursework is every topic ticked this week against the number the
        Plan puts on this week’s seven days{work && work.d>0 ? " — "+work.d+" this week" : ""},
        fixed on Monday so the target holds still while you work through it. Language days
        follow the Czech / Italian cadence — {S.byKey.lang.d} scheduled this week. That is the
        target, not the limit: every day is open, and each day beyond the {S.byKey.lang.d} counts
        as extra, carrying the languages ring and the combined score past 100%. The surplus is
        drawn as a second, thinner lap outside the ring. Coursework and gym stop at 100%.
      </p>
    </div>
  );
}

/* the 3-second daily surface: logging that isn't on the default screen doesn't happen */
function ProdTodayStrip({data, A}){
  const t=todayStr(), p=data.prod;
  const lang=langForDate(t), logged=p.lang.log[t];
  const items=[
    { key:"gym", label:"Gym", color:"#BE123C", on:!!p.gym.log[t], click:()=>A.tickGym(t,!p.gym.log[t]) },
  ];
  /* A cadence day offers its one language, as it always has. Any other day offers both, marked
     as extra: the app cannot know which language an unscheduled session was, so here it asks
     instead of guessing. One entry per day — tapping the other language swaps it. */
  if(lang) items.push({ key:"lang", label:LANG[lang].name, color:LANG[lang].color,
                        on:!!logged, click:()=>A.tickLang(t, logged?null:lang) });
  else ["czech","italian"].forEach(function(l){
    const on=!!logged && (logged.lang||langSuggest(t))===l;
    items.push({ key:"lang-"+l, label:LANG[l].name, color:LANG[l].color, extra:true,
                 on:on, click:()=>A.tickLang(t, on?null:l) });
  });
  return (
    <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginTop:10}}>
      {items.map(function(it){
        return (
          <button key={it.key} className="chip" aria-pressed={it.on} onClick={()=>{haptic();it.click();}}
            title={it.extra?"Extra day — not on the cadence, so it counts beyond 100%":undefined}
            aria-label={it.extra?it.label+", extra day":undefined}
            style={{border:it.on?"0.5px solid "+it.color:it.extra?"1px dashed var(--line-2)":"0.5px solid var(--line-2)",background:it.on?it.color+"14":"var(--card)",color:it.on?it.color:"var(--ink-2)"}}>
            <i className={it.on?"fa-solid fa-circle-check":it.extra?"fa-solid fa-plus":"fa-regular fa-circle"} style={{fontSize:11}} aria-hidden="true"/>{it.label}
          </button>
        );
      })}
    </div>
  );
}

/* ── root ───────────────────────────────────────────────────────── */
const TABS = [["today","Today"],["plan","Plan"],["classes","Classes"],["subjects","Subjects"],["progress","Progress"],["goals","Goals"],["timeline","Timeline"],["prod","Productivity"]];

function App(){
  const [tab,setTab]=useState("today");
  const [focus,setFocus]=useState(null);   // a subject id, so Subjects → Progress opens expanded
  const [data,setData]=useState(loadData);
  const [gcalStatus,setGcalStatus]=useState("off");   // off | on | renewing | reconnect
  const [gcalBusy,setGcalBusy]=useState(false);
  const [syncState,setSyncState]=useState("idle");    // idle | syncing | synced | error
  const [syncErr,setSyncErr]=useState("");
  const [syncEmail,setSyncEmail]=useState("");
  const fileRef=useRef(null);
  const dataRef=useRef(data);
  const first=useRef(true);
  const skipPush=useRef(false);
  const pushTimer=useRef(null);
  const dirty=useRef(false);

  useEffect(()=>{ dataRef.current=data; },[data]);

  // save locally on every change; push to Drive (debounced) for real edits
  useEffect(()=>{
    if(first.current){ first.current=false; return; }
    saveData(data);
    if(skipPush.current){ skipPush.current=false; return; }
    _syncEnabled = !!data.gcalEnabled;
    if(data.gcalEnabled){ dirty.current=true; schedulePush(); }
  },[data]);

  // a change the user made → bump the timestamp so it wins on other devices and gets pushed
  const mutate = (updater)=> setData(d=>{ const nd=updater(d); return {...nd, updatedAt:Date.now()}; });
  // adopt the Drive copy without pushing it back; the connection flag stays device-local
  const adopt = (remote)=>{ skipPush.current=true; const m=migrate(remote); m.gcalEnabled=dataRef.current.gcalEnabled; setData(m); saveData(m); };

  // flush a pending push immediately when the app is backgrounded (keepalive survives the page freezing — key on iPhone)
  const flush=()=>{
    if(pushTimer.current){ clearTimeout(pushTimer.current); pushTimer.current=null; }
    if(dirty.current && dataRef.current.gcalEnabled && tokenValid() && _driveFileId){ driveUpdateKeepalive(_driveFileId, dataRef.current); dirty.current=false; }
  };

  // on load: a saved token (kept across reloads) lets us sync straight away; otherwise show reconnect
  useEffect(()=>{
    _syncEnabled = !!dataRef.current.gcalEnabled;
    scheduleRefresh();     // module load ran before the saved setting was known, so arm it now
    /* Cold load. Do NOT declare the session dead just because the stored token has aged out —
       try a silent renewal first. This single line is the difference between opening the app in
       the morning and finding "session expired", and it just working. */
    if(dataRef.current.gcalEnabled){
      if(tokenValid()){ setGcalStatus("on"); autoSync(); }
      else { setGcalStatus("renewing"); live().then(function(ok){ if(ok) autoSync(); }); }
    }
  },[]);

  // sync when the app becomes active, flush when it backgrounds, and pull every 25s while open
  useEffect(()=>{
    const onVis=()=>{ if(document.visibilityState==="visible"){ refreshIfStale().then(()=>autoSync()); } else { flush(); } };
    document.addEventListener("visibilitychange",onVis);
    const onFocus=()=>{ refreshIfStale().then(()=>autoSync()); };
    window.addEventListener("focus",onFocus);
    window.addEventListener("pagehide",flush);
    const iv=setInterval(()=>{ if(document.visibilityState==="visible" && dataRef.current.gcalEnabled){ resync(); } }, 25000);
    // another tab (or a flashcard deck on this origin) renewed the shared token: adopt it and
    // sync straight away rather than waiting for our own timer
    const offTok=onTokenChange(()=>{ if(dataRef.current.gcalEnabled && tokenValid()){ setGcalStatus("on"); autoSync(); } });
    // back online after a drop: renew if needed, then reconcile
    const onOnline=()=>{ if(dataRef.current.gcalEnabled) live().then(ok=>{ if(ok) autoSync(); }); };
    window.addEventListener("online", onOnline);
    return ()=>{ document.removeEventListener("visibilitychange",onVis); window.removeEventListener("focus",onFocus); window.removeEventListener("pagehide",flush); window.removeEventListener("online",onOnline); offTok(); clearInterval(iv); };
  },[]);

  // ── Drive sync orchestration ──
  const noteOk=()=>{ setSyncErr(""); setSyncState("synced"); driveAbout().then(em=>{ if(em){ setSyncEmail(em); persistAccount(em); } }); };
  const noteErr=(e)=>{ setSyncErr(e&&e.message?e.message:"sync failed"); setSyncState("error"); };
  const schedulePush=()=>{ if(pushTimer.current) clearTimeout(pushTimer.current); pushTimer.current=setTimeout(doPush,900); };
  const doPush=async ()=>{
    if(!dataRef.current.gcalEnabled) return;
    if(!(await live())) return;                    // stays dirty; the next renewal flushes it
    try{
      setSyncState("syncing");
      if(!_driveFileId){ const f=await driveFind(); if(f) _driveFileId=f.id; }
      if(_driveFileId){ await driveUpdate(_driveFileId, dataRef.current); }
      else { _driveFileId=await driveCreate(dataRef.current); }
      dirty.current=false; noteOk();
    }catch(e){ noteErr(e); }
  };
  // merge with Drive by timestamp: the newer side wins, so local unsynced edits are PUSHED, never silently lost
  const resync=async ()=>{
    if(!dataRef.current.gcalEnabled) return;
    if(!(await live())) return;
    try{
      setSyncState("syncing");
      if(!_driveFileId){ const f=await driveFind(); if(f) _driveFileId=f.id; }
      if(!_driveFileId){ _driveFileId=await driveCreate(dataRef.current); dirty.current=false; noteOk(); return; }
      const remote=await driveRead(_driveFileId);
      const rt=remote.updatedAt||0, lt=dataRef.current.updatedAt||0;
      if(rt>lt){ adopt(remote); }
      else if(lt>rt){ await driveUpdate(_driveFileId, dataRef.current); dirty.current=false; }
      noteOk();
    }catch(e){ noteErr(e); }
  };
  // load / focus / interval: merge if we hold a token, else show reconnect (never a surprise popup)
  /* One place that answers "do we have a usable session right now", renewing silently if not.
     Everything that touches Drive goes through it, so a lapsed hour is repaired in the
     background instead of surfacing as a button the user has to press. */
  const live=async ()=>{
    if(tokenValid()) { setGcalStatus(s=>s==="on"?s:"on"); return true; }
    if(!dataRef.current.gcalEnabled) return false;
    setGcalStatus(s=>s==="off"?s:"renewing");
    try{ await ensureFresh(); setGcalStatus("on"); return true; }
    catch(e){ setGcalStatus("reconnect"); return false; }
  };
  const autoSync=()=>{
    if(!dataRef.current.gcalEnabled) return;
    resync();
  };
  // first-time connect on a device: take the shared Drive copy if it exists, else seed it from here
  const initialSync=async ()=>{
    try{
      setSyncState("syncing");
      const f=await driveFind();
      if(f){ _driveFileId=f.id; const remote=await driveRead(f.id); adopt(remote); }
      else { _driveFileId=await driveCreate(dataRef.current); }
      dirty.current=false; noteOk();
    }catch(e){ noteErr(e); }
  };

  // calendar sync helpers
  const syncCreate = (task)=>{
    if(!dataRef.current.gcalEnabled || !task.time) return;
    gcalCreate(task).then(ev=>{ mutate(d=>({...d,tasks:d.tasks.map(t=>t.id===task.id?{...t,gcalId:ev.id,gcalError:false}:t)})); })
    .catch(()=>{ setData(d=>({...d,tasks:d.tasks.map(t=>t.id===task.id?{...t,gcalError:true}:t)})); setGcalStatus(s=>s==="on"?"reconnect":s); });
  };
  const syncUpdate = (task)=>{
    if(!dataRef.current.gcalEnabled) return;
    if(task.gcalId){
      gcalUpdate(task.gcalId,task).then(()=>{ setData(d=>({...d,tasks:d.tasks.map(t=>t.id===task.id?{...t,gcalError:false}:t)})); })
      .catch(()=>{ setData(d=>({...d,tasks:d.tasks.map(t=>t.id===task.id?{...t,gcalError:true}:t)})); setGcalStatus(s=>s==="on"?"reconnect":s); });
    } else if(task.time){ syncCreate(task); }
  };

  const A = {
    go:(t,f)=>{ setTab(t); setFocus(f||null); },
    gcalBusy, syncState, syncEmail, syncErr,
    /* Progress-tab overrides. A skipped topic is scheduled nowhere and counted nowhere; the
       override is checked before anything else in tierOf(), so a syllabus that turns out to be
       wrong is a one-tap fix rather than a redeploy. */
    setSkip:(code,on)=>{ haptic(); mutate(d=>{
      const t={...d.study.tier}; if(on) t[code]="skip"; else delete t[code];
      return {...d, study:{...d.study, tier:t}};
    }); },
    setSkipMany:(codes,on)=>mutate(d=>{
      const t={...d.study.tier};
      codes.forEach(function(c){ if(on) t[c]="skip"; else delete t[c]; });
      return {...d, study:{...d.study, tier:t}};
    }),
    /* "I could not say this one" from a review row: untick it and it re-enters the queue in
       curriculum order, so the schedule repairs itself from the evidence. */
    unTick:(code)=>{ haptic(); mutate(d=>{
      const doneAt={...(d.doneAt||{})}; delete doneAt[code];
      return {...d, done:{...d.done,[code]:false}, doneAt};
    }); },
    /* The date booked in SIS. Passing a null iso clears it and pacing falls back to the first
       day of the exam period. */
    setExamDate:(id,iso,time)=>mutate(d=>{
      const e={...(d.examDates||{})};
      if(iso) e[id]={iso:iso, time:time||""}; else delete e[id];
      return {...d, examDates:e};
    }),

    // done keeps its exact shape; doneAt runs alongside it so "topics done THIS week" is answerable.
    // Unticking deletes the stamp, otherwise it would leave phantom weekly credit behind.
    toggleDone:(c)=>{ haptic(); mutate(d=>{
      const on=!d.done[c], doneAt={...(d.doneAt||{})};
      if(on) doneAt[c]=todayStr(); else delete doneAt[c];
      return {...d, done:{...d.done,[c]:on}, doneAt};
    }); },
    setMany:(codes,val)=>mutate(d=>{
      const done={...d.done}, doneAt={...(d.doneAt||{})};
      codes.forEach(function(c){ done[c]=val; if(val) doneAt[c]=todayStr(); else delete doneAt[c]; });
      return {...d, done, doneAt};
    }),

    tickGym:(date,on)=>mutate(d=>{
      const log={...d.prod.gym.log};
      if(on) log[date]={tickedAt:nowISO()}; else delete log[date];
      return {...d, prod:{...d.prod, gym:{...d.prod.gym, log}}};
    }),
    /* lang is "czech" | "italian" to log that language for the day, or null to clear it. One
       entry per day, so logging the other language replaces the first rather than adding to it.
       tickedAt survives a swap: correcting Czech → Italian on an extra day is not a new tick, and
       must not turn a day logged on time into one marked "late". */
    tickLang:(date,lang)=>mutate(d=>{
      const log={...d.prod.lang.log};
      if(lang){ const was=log[date]; log[date]={lang:lang, tickedAt:(was&&was.tickedAt)||nowISO()}; }
      else delete log[date];
      return {...d, prod:{...d.prod, lang:{...d.prod.lang, log}}};
    }),
    setGymTarget:(v)=>mutate(d=>({...d, prod:{...d.prod, gym:{...d.prod.gym, targetPerWeek:v}}})),

    addTask:(f)=>{ const task={id:uid(),text:f.text,date:f.date,time:f.time,important:!!f.important,done:false,gcalId:null};
      mutate(d=>({...d,tasks:[...d.tasks,task]})); syncCreate(task); },
    updateTask:(id,patch)=>{
      const cur=dataRef.current.tasks.find(t=>t.id===id)||{};
      const wasGId=cur.gcalId;
      const updated={...cur,...patch};
      mutate(d=>({...d,tasks:d.tasks.map(t=>t.id===id?{...t,...patch}:t)}));
      if(!dataRef.current.gcalEnabled) return;
      if(wasGId && !updated.time){ gcalDelete(wasGId).catch(()=>{}); mutate(d=>({...d,tasks:d.tasks.map(t=>t.id===id?{...t,gcalId:null}:t)})); return; }
      syncUpdate(updated);
    },
    toggleTask:(id)=>mutate(d=>({...d,tasks:d.tasks.map(t=>t.id===id?{...t,done:!t.done}:t)})),
    deleteTask:(id)=>{ const t=dataRef.current.tasks.find(x=>x.id===id); if(t && t.gcalId && dataRef.current.gcalEnabled){ gcalDelete(t.gcalId).catch(()=>{}); } mutate(d=>({...d,tasks:d.tasks.filter(x=>x.id!==id)})); },
    retryTask:(id)=>{ const t=dataRef.current.tasks.find(x=>x.id===id); if(t) syncUpdate(t); },

    connectGcal:async ()=>{
      if(IS_FILE){ alert("This is the offline copy sitting on your computer (file://).\n\nGoogle sign-in, reminders and sync only work on the live site. Open this instead:\n\n"+LIVE_URL); return; }
      setGcalBusy(true);
      try{
        await acquireToken();
        _syncEnabled = true;
        setData(d=>({...d,gcalEnabled:true}));
        setGcalStatus("on");
        await initialSync();
        const pending=dataRef.current.tasks.filter(t=>t.time && !t.gcalId && !t.done);
        for(const t of pending){ try{ const ev=await gcalCreate(t); mutate(d=>({...d,tasks:d.tasks.map(x=>x.id===t.id?{...x,gcalId:ev.id,gcalError:false}:x)})); }catch(e){} }
      }catch(e){ alert("Couldn't connect to Google.\n\n"+(e && e.message?e.message:"Please try again.")); setGcalStatus(s=>s==="on"?"on":"off"); }
      setGcalBusy(false);
    },
    disconnectGcal:()=>{ gcalForget(); _syncEnabled=false; try{ clearTimeout(_refreshTimer); }catch(e){} _driveFileId=null; dirty.current=false; setData(d=>({...d,gcalEnabled:false})); setGcalStatus("off"); setSyncState("idle"); },
    // reconnect after the token expired — refresh, then MERGE by timestamp so offline edits are pushed, not lost
    reconnect:async ()=>{
      if(IS_FILE){ alert("Open the live app to reconnect:\n\n"+LIVE_URL); return; }
      setGcalBusy(true);
      try{
        await acquireToken();
        _syncEnabled = true;
        setGcalStatus("on");
        await resync();
        const pending=dataRef.current.tasks.filter(t=>t.time && !t.gcalId && !t.done);
        for(const t of pending){ try{ const ev=await gcalCreate(t); mutate(d=>({...d,tasks:d.tasks.map(x=>x.id===t.id?{...x,gcalId:ev.id,gcalError:false}:x)})); }catch(e){} }
      }catch(e){ setGcalStatus("reconnect"); }
      setGcalBusy(false);
    },
    switchAccount:async ()=>{
      if(IS_FILE){ alert("Open the live app first:\n\n"+LIVE_URL); return; }
      setGcalBusy(true);
      try{
        try{ localStorage.removeItem("sp_gaccount"); }catch(e){}
        _gaccount=null; _tokenClient=null; _accessToken=null; _tokenExpiry=0;
        await acquireToken();
        _syncEnabled = true;
        setData(d=>({...d,gcalEnabled:true}));
        setGcalStatus("on");
        await resync();
      }catch(e){ setGcalStatus(s=>s==="on"?"on":"reconnect"); }
      setGcalBusy(false);
    },
    syncNow:async ()=>{
      if(!dataRef.current.gcalEnabled) return;
      try{ await getToken(); setGcalStatus("on"); await resync(); }
      catch(e){ setGcalStatus("reconnect"); }
    },

    addGoal:(title)=>mutate(d=>({...d,goals:[...d.goals,{id:uid(),title,date:"",steps:[]}]})),
    updateGoal:(id,patch)=>mutate(d=>({...d,goals:d.goals.map(g=>g.id===id?{...g,...patch}:g)})),
    delGoal:(id)=>mutate(d=>({...d,goals:d.goals.filter(g=>g.id!==id)})),
    addStep:(gid,text)=>mutate(d=>({...d,goals:d.goals.map(g=>g.id===gid?{...g,steps:[...g.steps,{id:uid(),text,done:false}]}:g)})),
    toggleStep:(gid,sid)=>mutate(d=>({...d,goals:d.goals.map(g=>g.id===gid?{...g,steps:g.steps.map(s=>s.id===sid?{...s,done:!s.done}:s)}:g)})),
    delStep:(gid,sid)=>mutate(d=>({...d,goals:d.goals.map(g=>g.id===gid?{...g,steps:g.steps.filter(s=>s.id!==sid)}:g)})),

    exportData:()=>{ const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="planner-backup-"+todayStr()+".json"; a.click(); URL.revokeObjectURL(url); },
    importData:()=>{ if(fileRef.current) fileRef.current.click(); },
  };

  const onFile=(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(confirm("Replace your current planner data with this backup?")){ const m=migrate(d); setData(m); saveData(m); } }catch(err){ alert("That file isn't a valid planner backup."); } }; r.readAsText(f); e.target.value=""; };

  return (
    <div>
      <header style={{position:"sticky",top:0,zIndex:5,background:"var(--paper)",borderBottom:"0.5px solid var(--line)",padding:"15px 0 0"}}>
        <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:10}}><div style={{fontFamily:"var(--serif)",fontSize:18,color:"var(--ink)"}}>Study planner</div><div style={{fontSize:12,color:"var(--ink-3)"}}>3rd-year medicine · Plzeň</div></div>
        <nav style={{display:"flex",gap:18,marginTop:6,overflowX:"auto"}}>{TABS.map(([id,label])=>(<button key={id} className="navbtn" aria-current={tab===id} onClick={()=>{ setTab(id); setFocus(null); }} style={{whiteSpace:"nowrap"}}>{label}</button>))}</nav>
      </header>

      {IS_FILE && (
        <div style={{background:"#FBEAE5",border:"0.5px solid #E7B7A8",color:"#7A2E12",borderRadius:"var(--r-lg)",padding:"12px 14px",marginTop:14,fontSize:13.5,lineHeight:1.5}}>
          <strong>You’ve opened the offline file.</strong> Sign-in, reminders and sync don’t work here. Open the live app instead:<br/>
          <a href={LIVE_URL} style={{color:"#7A2E12",fontWeight:600,wordBreak:"break-all"}}>{LIVE_URL}</a>
        </div>
      )}

      {tab==="today" && <TodayView data={data} A={A} gcalStatus={gcalStatus}/>}
      {tab==="plan" && <PlanView data={data} A={A}/>}
      {tab==="classes" && <ClassesView/>}
      {tab==="subjects" && <SubjectsView data={data} A={A}/>}
      {tab==="progress" && <ProgressView data={data} A={A} focus={focus}/>}
      {tab==="goals" && <GoalsView data={data} A={A}/>}
      {tab==="timeline" && <TimelineView data={data}/>}
      {tab==="prod" && <ProductivityView data={data} A={A}/>}

      <input ref={fileRef} type="file" accept="application/json,.json" onChange={onFile} style={{display:"none"}}/>

      <footer style={{marginTop:30}}>
        <hr className="rule"/>
        <p style={{fontSize:11.5,color:"var(--ink-3)",lineHeight:1.6,marginTop:12}}>Everything you tick, add or edit saves automatically, on every device you are signed in on. Tasks with a time sync to Google Calendar once reminders are on. Subjects, credits and semesters come from the Faculty’s own study plan (SIS, EAVSEOB2023); the term and exam dates come from Dean’s Measure 6/2026.</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
