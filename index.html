
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Study planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --paper:#FAF6EC; --paper-2:#F2ECDC; --card:#FFFDF7;
    --ink:#2C2A26; --ink-2:#6E6757; --ink-3:#9C9484;
    --line:#E7E0CF; --line-2:#DAD2BD; --accent:#5E7155; --accent-soft:#EAEAD9;
    --warn:#B45309;
    --r-sm:7px; --r-md:11px; --r-lg:15px;
    --serif:'Newsreader',Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
  #root{max-width:760px;margin:0 auto;padding:0 18px 64px}
  h1,h2,h3{font-family:var(--serif);font-weight:500;color:var(--ink);line-height:1.2}
  button{font-family:inherit;cursor:pointer;color:inherit}
  a{color:inherit}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
  ::selection{background:#dfe3d2}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .eyebrow{font-family:var(--serif);font-size:13px;color:var(--ink-3);font-style:italic}
  .rule{height:1px;background:var(--line);border:0}
  .num{font-family:var(--serif);font-variant-numeric:lining-nums;letter-spacing:-.01em}
  .ln-btn{background:transparent;border:0.5px solid var(--line-2);border-radius:var(--r-md);padding:7px 12px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;text-decoration:none;transition:background .15s,border-color .15s}
  .ln-btn:hover{background:var(--paper-2);border-color:var(--accent)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:20px;padding:4px 11px;border:0.5px solid var(--line-2);background:var(--card);color:var(--ink-2);text-decoration:none;transition:background .15s}
  .chip:hover{background:var(--paper-2)}
  .cb{appearance:none;-webkit-appearance:none;position:relative;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:6px;background:var(--card);flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;overflow:visible;transition:background .18s,border-color .18s,transform .18s}
  .cb:hover{border-color:var(--ck,var(--accent))}
  .cb:checked{background:var(--ck,var(--accent));border-color:var(--ck,var(--accent));animation:cbpop .34s ease-out}
  .cb:checked::after{content:"\2713";color:#fff;font-size:11px;font-weight:700;animation:ckin .34s ease-out}
  .cb::before{content:"";position:absolute;inset:-1px;border-radius:7px;border:2px solid var(--ck,var(--accent));opacity:0;pointer-events:none}
  .cb:checked::before{animation:ckring .52s ease-out}
  .navbtn{background:transparent;border:0;padding:10px 2px;font-size:14px;color:var(--ink-3);position:relative}
  .navbtn[aria-current="true"]{color:var(--ink)}
  .navbtn[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
  .seclabel{font-family:var(--serif);font-size:15px;color:var(--ink);margin:22px 0 4px}
  .txtin{width:100%;background:var(--card);border:0.5px solid var(--line-2);border-radius:var(--r-md);padding:9px 12px;outline:none}
  .txtin:focus{border-color:var(--accent)}
  .sm{font-size:13px;padding:7px 9px;border:0.5px solid var(--line-2);border-radius:var(--r-md);background:var(--card)}
  .iconbtn{background:transparent;border:0;color:var(--ink-3);padding:6px;border-radius:6px;line-height:1;transition:color .15s,background .15s}
  .iconbtn:hover{color:var(--ink);background:var(--paper-2)}
  @keyframes cbpop{0%{transform:scale(1)}42%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes ckin{0%{transform:scale(0) rotate(-14deg);opacity:0}55%{transform:scale(1.28) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes ckring{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2.4);opacity:0}}
  @keyframes fieldpop{0%,100%{box-shadow:0 0 0 0 rgba(94,113,85,0)}35%{box-shadow:0 0 0 2px rgba(94,113,85,.5)}}
  .field-done{animation:fieldpop .6s ease-out}
  .strike{position:relative}
  .strike::after{content:"";position:absolute;left:0;top:52%;height:1.5px;background:var(--ink-3);width:0;pointer-events:none;transition:width .28s ease-out}
  .strike.on::after{width:100%}
  .microtoast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:8px 16px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:60;animation:toastin .28s ease-out}
  @keyframes toastin{0%{opacity:0;transform:translate(-50%,8px)}100%{opacity:1;transform:translate(-50%,0)}}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
  @media (max-width:520px){#root{padding:0 13px 64px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ── identity & links ───────────────────────────────────────────── */
/* UI.accent is the APP's own colour, not a subject's. It was SUBJ.physio for two years, which is
   why the calendar bar, task list and goal bars all went violet: they were borrowing a subject
   hue. Chrome uses UI.*; anything that belongs to a course uses that course's own colour. */
const UI = { accent:"#534AB7", accentSoft:"#ECEAFB" };
const LANGC = { czech:"#1F4E79", italian:"#2F8F57" };
const CHAT_CZECH   = "https://claude.ai/chat/53820c71-73a6-4d0c-bd13-87f8136b833b";
const CHAT_ITALIAN = "https://claude.ai/chat/a3aebc22-8fa1-41ec-8205-a05785d4ba0f";
// Instagram "school events": the button hands off to Claude's /insta-checkup skill (it scrapes
// the accounts + writes events to Calendar); this app just reads them back. Swap in a dedicated
// chat URL if you keep one, else a fresh chat works.
const INSTA_CHAT = "https://claude.ai/new";
const INSTA_DEEPLINK = "claude://claude.ai/new?q=" + encodeURIComponent("/insta-checkup");
// One-tap flow: deep-link into the Claude app with /insta-checkup pre-filled (works even if the
// app is closed). If nothing handles the claude:// scheme within ~1.6s, fall back to claude.ai
// in this tab. The command is also copied as a paste backup either way.
function openInstaCheck(e){
  e.preventDefault();
  copyText("/insta-checkup");
  let left=false;
  const mark=function(){ left=true; };
  document.addEventListener("visibilitychange",mark,{once:true});
  window.addEventListener("pagehide",mark,{once:true});
  window.addEventListener("blur",mark,{once:true});
  try{ window.location.href=INSTA_DEEPLINK; }catch(err){}
  setTimeout(function(){
    document.removeEventListener("visibilitychange",mark);
    window.removeEventListener("pagehide",mark);
    window.removeEventListener("blur",mark);
    if(!left && document.hasFocus()){ window.location.assign(INSTA_CHAT); }
  },1600);
}
// Google Calendar colorId → hex, matching the /insta-checkup convention
const GCAL_COLORS = { "6":"#E8710A", "9":"#3F51B5", "8":"#616161" };
const LIVE_URL = "https://kadzidrogalinasdraven.github.io/study-planner/";
const IS_FILE = (typeof location!=="undefined" && location.protocol === "file:");

/* ── Google Calendar (browser OAuth, no backend) ─────────────────── */
const GOOGLE_CLIENT_ID = "272590603949-tfgcscp9b13kka7gg8epj5tg4o47g6cq.apps.googleusercontent.com";
const AUTH_SCOPES = "https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/drive.appdata";
const GCAL_BASE = "https://www.googleapis.com/calendar/v3/calendars/primary/events";
let _tokenClient = null, _accessToken = null, _tokenExpiry = 0, _tokenPromise = null, _gaccount = null, _refreshTimer = 0;
/* Silent-renewal state. `_silentTries` drives the backoff; `_silentDead` is set only when a
   silent attempt has actually been made AND failed, so the UI can tell "stale, renewing" from
   "genuinely signed out". Before this existed the app showed "session expired" the instant the
   hour was up, without ever having tried to renew. */
let _silentTries = 0, _silentDead = false, _renewPromise = null;
/* Whether the user actually has sync switched on. Gating background auth on _gaccount alone was
   wrong: gcalForget() deliberately keeps sp_gaccount, so after "Turn off" the app went on trying
   to authenticate on timers and on every tap. */
let _syncEnabled = false;
let _tokenReject = null, _tokenInteractive = false;
const _tokenListeners = [];
function onTokenChange(fn){ _tokenListeners.push(fn); return function(){ const i=_tokenListeners.indexOf(fn); if(i>=0) _tokenListeners.splice(i,1); }; }
function emitToken(){ _tokenListeners.slice().forEach(function(fn){ try{ fn(); }catch(e){} }); }

function gisReady(){ return !!(window.google && window.google.accounts && window.google.accounts.oauth2); }
function restoreAccount(){ try{ const s=localStorage.getItem("sp_gaccount"); if(s) _gaccount=s; }catch(e){} }
function persistAccount(em){ if(!em) return; _gaccount=em; try{ localStorage.setItem("sp_gaccount", em); }catch(e){} _tokenClient=null; /* rebuild with new hint */ }
restoreAccount();
function ensureTokenClient(){
  if(_tokenClient) return _tokenClient;
  if(!gisReady()) return null;
  // `hint` pins the token to the saved account, so silent refresh never shows the account picker.
  _tokenClient = window.google.accounts.oauth2.initTokenClient({ client_id:GOOGLE_CLIENT_ID, scope:AUTH_SCOPES, hint:_gaccount||"", callback:function(){} });
  return _tokenClient;
}
/* This used to be defined and never called, which is why a cold load raced the GIS script and
   failed with "sign-in is still loading" if the script had not arrived yet. Every renewal path
   now waits for it. */
function waitForGis(ms){
  return new Promise(function(resolve,reject){
    if(gisReady()) return resolve(true);
    const t0=Date.now();
    const iv=setInterval(function(){
      if(gisReady()){ clearInterval(iv); resolve(true); }
      else if(Date.now()-t0>ms){ clearInterval(iv); reject(new Error("Google sign-in library didn't load. Check your connection and reload.")); }
    },150);
  });
}
function getToken(opts){
  opts = opts || {};
  const interactive = !!opts.interactive;
  if(!opts.force && _accessToken && Date.now() < _tokenExpiry - 60000) return Promise.resolve(_accessToken);
  if(_tokenPromise){
    /* A background attempt must never satisfy — or stall — an explicit one. The user's click
       carries the browser's transient activation, and that activation is the only reason a popup
       is allowed to open at all. Queueing the click behind an in-flight silent request spends it
       on the wrong window, and the account chooser then never appears. */
    if(!interactive || _tokenInteractive) return _tokenPromise;
    try{ if(_tokenReject) _tokenReject(new Error("superseded by an explicit sign-in")); }catch(e){}
    _tokenPromise=null; _tokenReject=null;
  }
  const tc=ensureTokenClient();
  if(!tc) return Promise.reject(new Error("Google sign-in is still loading. Wait a moment and tap Connect again."));
  _tokenInteractive = interactive;
  _tokenPromise = new Promise(function(resolve,reject){
    _tokenReject = reject;
    tc.callback=function(resp){
      _tokenPromise=null; _tokenReject=null;
      if(resp && resp.access_token){ _accessToken=resp.access_token; _tokenExpiry=Date.now()+((resp.expires_in||3600)*1000);
        _silentTries=0; _silentDead=false; persistToken(); scheduleRefresh(); emitToken(); resolve(_accessToken); }
      else { reject(resp||new Error("No access token")); }
    };
    tc.error_callback=function(err){ _tokenPromise=null; _tokenReject=null; reject(err||new Error("Sign-in was cancelled")); };
    try{ tc.requestAccessToken({ prompt: opts.prompt || "" }); }catch(e){ _tokenPromise=null; _tokenReject=null; reject(e); }
  });
  return _tokenPromise;
}
/* ── keeping the session alive ────────────────────────────────────────────
   Google Identity Services issues an access token that lasts about an hour, and a browser-only
   app gets no refresh token: the ONLY way to stay signed in is to ask for a new token before the
   old one dies, silently, using the Google session cookie the browser already holds. That works
   as long as the user is still signed in to Google and the browser has not blocked the hidden
   frame — Safari's tracking prevention will eventually kill it, and no amount of client code can
   change that. So the design is: renew early, renew again on focus, retry with backoff, and only
   admit defeat once a silent attempt has actually failed.

   Never ask Google for a token while you're working somewhere else. requestAccessToken can open
   a popup, and a popup drags the whole browser to the front — that's what yanks you into Chrome
   mid-sentence. visibilityState is NOT enough: a Chrome tab stays "visible" while another app
   covers it, so the only reliable "you're actually here" test is document.hasFocus(). */
function appIsInFront(){ try{ return document.visibilityState!=="hidden" && document.hasFocus(); }catch(e){ return true; } }

const RENEW_LEAD = 10*60*1000;      // start trying ten minutes out, not five: more room to retry
const RENEW_BACKOFF = [20000, 60000, 180000, 600000];

/* The single way the app asks for a live token. Resolves with one, or rejects when the session
   is genuinely gone and a real sign-in gesture is needed. */
function ensureFresh(opts){
  opts = opts || {};
  /* `force` is what makes PRE-EMPTIVE renewal possible. Without it this returned early on any
     still-valid token, so the whole "renew before it lapses" mechanism was dead code: it could
     only ever run once the token had already expired, which is precisely when a silent request
     cannot succeed and a popup does harm. */
  if(!opts.force && tokenValid()) return Promise.resolve(_accessToken);
  if(!_gaccount) return Promise.reject(new Error("not connected"));
  if(_renewPromise) return _renewPromise;
  _renewPromise = waitForGis(10000)
    .then(function(){ return getToken({ force:true, prompt:"" }); })
    .then(function(t){ _renewPromise=null; return t; })
    .catch(function(e){
      _renewPromise=null; _silentTries++; _silentDead=true;
      scheduleRefresh();                       // keep trying on a backoff rather than giving up
      throw e;
    });
  return _renewPromise;
}

/* One timer, armed whether or not a token is currently held. The old version returned early when
   _accessToken was null, so a page opened more than an hour after the last one never even tried
   to renew — it just showed the Reconnect banner. */
function scheduleRefresh(){
  try{ clearTimeout(_refreshTimer); }catch(e){}
  if(!_gaccount || !_syncEnabled) return;
  const dueIn = tokenValid()
    ? Math.max(15000, _tokenExpiry - Date.now() - RENEW_LEAD)
    : RENEW_BACKOFF[Math.min(_silentTries, RENEW_BACKOFF.length-1)];
  const attempt=function(){
    // not in front → don't touch it. Come back later; focus and visibilitychange also call
    // refreshIfStale(), so returning to the tab renews immediately either way.
    if(!appIsInFront()){ _refreshTimer=setTimeout(attempt, 30000); return; }
    ensureFresh().catch(function(){});
  };
  _refreshTimer=setTimeout(attempt, dueIn);
}
function refreshIfStale(){
  if(!_gaccount || !_syncEnabled || !appIsInFront()) return Promise.resolve(null);
  if(tokenValid() && Date.now() < _tokenExpiry - RENEW_LEAD) return Promise.resolve(_accessToken);
  return ensureFresh({force:true}).catch(function(){ return null; });
}
/* Connect / Reconnect / Switch account all land here, and they open the account chooser
   IMMEDIATELY, synchronously inside the click.

   This used to try a silent token first and fall back to the chooser only after that failed. It
   read as a courtesy — no picker for returning users — and it made reconnecting IMPOSSIBLE on
   exactly the dead session it existed to repair. Two awaits stand between the click and the
   fallback: waitForGis, and a failed network round trip to Google. By the time the chooser is
   requested the browser's transient activation is long gone, so its popup is blocked and the user
   sees "Couldn't connect to Google" no matter how many times they press the button.

   Silent-first belongs in the background paths, where there is no activation to spend. When
   somebody deliberately taps Reconnect, showing them the chooser is both correct and reliable. */
function acquireToken(){
  if(!gisReady()) return Promise.reject(new Error("Google sign-in is still loading — give it a second and tap again."));
  _silentDead=false; _silentTries=0;
  try{ clearTimeout(_refreshTimer); }catch(e){}
  return getToken({force:true, prompt:"select_account", interactive:true});
}
/* ── the part that actually keeps you signed in ───────────────────────────
   Google Identity Services opens a POPUP for requestAccessToken, even with prompt:"" — there is
   no hidden-iframe path in the token model, and the docs say plainly to call it "from a
   user-driven event such as a button press". A popup fired from a bare timer has no user
   activation behind it, so Chrome and Safari block it; that is exactly why the timer-driven
   renewal alone still ended in the Reconnect banner.

   So renewal rides on the user's own clicks. Any tap anywhere in the app carries transient
   activation, the popup is therefore allowed, and because consent was granted long ago it
   closes again immediately — usually as a flicker. In practice this means the session renews
   itself roughly once an hour while you are using the planner, with nothing to press.

   It is deliberately throttled and only fires when the token is genuinely near the end, so a
   normal minute of clicking costs nothing. */
let _lastGestureRenew = 0;
const GESTURE_RENEW_GAP = 60*1000;
function renewOnGesture(){
  if(!_syncEnabled || !_gaccount) return;
  if(Date.now() - _lastGestureRenew < GESTURE_RENEW_GAP) return;
  /* Only ever EXTEND a session that is still alive. Firing on an already-dead token turned every
     tap into a blocked popup, and worse, spent the activation that the Connect button needs.
     Reviving a dead session is the button's job, not a side effect of scrolling. */
  const aging = tokenValid() && Date.now() > _tokenExpiry - RENEW_LEAD;
  if(!aging) return;
  _lastGestureRenew = Date.now();
  ensureFresh({force:true}).catch(function(){});
}
try{
  ["pointerdown","keydown"].forEach(function(ev){
    window.addEventListener(ev, renewOnGesture, { capture:true, passive:true });
  });
}catch(e){}
function gcalForget(){ _accessToken=null; _tokenExpiry=0; try{ localStorage.removeItem("sp_gtok"); }catch(e){} }
function persistToken(){ try{ localStorage.setItem("sp_gtok", JSON.stringify({t:_accessToken, e:_tokenExpiry})); }catch(e){} }
function restoreToken(){ try{ const s=localStorage.getItem("sp_gtok"); if(s){ const o=JSON.parse(s); if(o && o.t && o.e && o.e > Date.now()+60000){ _accessToken=o.t; _tokenExpiry=o.e; } } }catch(e){} }
/* The planner and both flashcard decks share sp_gtok on one origin. Without this, a token
   renewed in one open tab was invisible to the others until they were reloaded, and each tab
   renewed separately. Now whichever tab renews first hands the token to the rest. */
function adoptStoredToken(){
  try{
    const raw=localStorage.getItem("sp_gtok"); if(!raw) return false;
    const o=JSON.parse(raw);
    if(o && o.t && o.e && o.e > _tokenExpiry){ _accessToken=o.t; _tokenExpiry=o.e; _silentDead=false; _silentTries=0;
      scheduleRefresh(); emitToken(); return true; }
  }catch(e){}
  return false;
}
try{
  window.addEventListener("storage", function(ev){
    if(ev && ev.key==="sp_gtok") adoptStoredToken();
    if(ev && ev.key==="sp_gaccount" && ev.newValue){ _gaccount=ev.newValue; _tokenClient=null; }
  });
}catch(e){}
restoreToken(); scheduleRefresh();

const pad = n => String(n).padStart(2,"0");
function toNaiveLocal(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }
/* reminders by urgency: normal → 30 min before; important → 1 day, 1 hour, 10 min before */
function remindersFor(task){
  return task.important
    ? [{method:"popup",minutes:1440},{method:"popup",minutes:60},{method:"popup",minutes:10}]
    : [{method:"popup",minutes:30}];
}
function eventFromTask(task){
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "Europe/Berlin";
  const startStr = task.date + "T" + task.time + ":00";
  const end = new Date(new Date(startStr).getTime() + 30*60000);
  return {
    summary: task.text,
    description: "Added from Study planner",
    start: { dateTime:startStr, timeZone:tz },
    end:   { dateTime:toNaiveLocal(end), timeZone:tz },
    reminders: { useDefault:false, overrides:remindersFor(task) },
  };
}
async function gcalCreate(task){
  const tok=await getToken();
  const r=await fetch(GCAL_BASE,{method:"POST",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(eventFromTask(task))});
  if(!r.ok) throw new Error("create "+r.status); return r.json();
}
async function gcalUpdate(id,task){
  const tok=await getToken();
  const r=await fetch(GCAL_BASE+"/"+encodeURIComponent(id),{method:"PATCH",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(eventFromTask(task))});
  if(!r.ok) throw new Error("update "+r.status); return r.json();
}
async function gcalDelete(id){
  const tok=await getToken();
  const r=await fetch(GCAL_BASE+"/"+encodeURIComponent(id),{method:"DELETE",headers:{Authorization:"Bearer "+tok}});
  if(!r.ok && r.status!==404 && r.status!==410) throw new Error("delete "+r.status); return true;
}
// read upcoming events (today → +14 days) so the planner can show the daily briefing + what /insta-checkup put on the calendar
async function gcalListEvents(){
  const tok=await getToken();
  const now=new Date();
  const qs=new URLSearchParams({ timeMin:now.toISOString(), timeMax:new Date(now.getTime()+14*86400000).toISOString(), singleEvents:"true", orderBy:"startTime", maxResults:"50", timeZone:"Europe/Prague" });
  const r=await fetch(GCAL_BASE+"?"+qs.toString(),{headers:{Authorization:"Bearer "+tok}});
  if(!r.ok) throw new Error("Calendar read failed ("+r.status+")");
  const j=await r.json();
  return (j.items||[]).map(function(it){
    const start=(it.start&&(it.start.dateTime||it.start.date))||null;
    const allDay=!!(it.start&&it.start.date&&!it.start.dateTime);
    const desc=it.description||"";                              // full description (briefing summary lives here)
    const sm=desc.match(/Source:\s*(@[\w.]+)/i);                // Instagram handle, unchanged
    const um=desc.match(/https?:\/\/[^\s)<>"']+/i);             // first URL, e.g. the Instagram post link
    return { id:it.id, title:it.summary||"(untitled)", start:start, allDay:allDay, location:it.location||"", colorId:it.colorId||"", description:desc, source:sm?sm[1]:"", postUrl:um?um[0]:"", htmlLink:it.htmlLink||"",
             isClass:/\[planner:class\]/.test(desc) };
  }).filter(function(e){ return e.start && !e.isClass; });   // classes come from TIMETABLE, not the feed
}

/* ── Google Drive sync — a hidden app-data file, invisible in your normal Drive ── */
const DRIVE_FILE = "study-planner-sync.json";
let _driveFileId = null;

async function driveErr(prefix,r){ let t=""; try{ t=await r.text(); }catch(e){} let msg=t; try{ const j=JSON.parse(t); msg=(j.error&&j.error.message)||t; }catch(e){} return new Error(prefix+" "+r.status+(msg?(": "+String(msg).slice(0,200)):"")); }
async function driveAbout(){ try{ const tok=await getToken(); const r=await fetch("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)",{headers:{Authorization:"Bearer "+tok}}); if(!r.ok) return null; const j=await r.json(); return (j.user&&j.user.emailAddress)||null; }catch(e){ return null; } }
async function driveFind(){
  const tok=await getToken();
  const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&pageSize=20",{headers:{Authorization:"Bearer "+tok}});
  if(!r.ok) throw await driveErr("Drive list",r);
  const j=await r.json(); const files=j.files||[];
  return files.find(function(x){return x.name===DRIVE_FILE;}) || files[0] || null;
}
async function driveRead(id){
  const tok=await getToken();
  const r=await fetch("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media",{headers:{Authorization:"Bearer "+tok}});
  if(!r.ok) throw await driveErr("Drive read",r);
  return r.json();
}
async function driveCreate(obj){
  const tok=await getToken();
  const boundary="planner"+Date.now();
  const body="--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name:DRIVE_FILE,parents:["appDataFolder"]})+"\r\n--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify(obj)+"\r\n--"+boundary+"--";
  const r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{Authorization:"Bearer "+tok,"Content-Type":"multipart/related; boundary="+boundary},body:body});
  if(!r.ok) throw await driveErr("Drive create",r);
  const j=await r.json(); return j.id;
}
async function driveUpdate(id,obj){
  const tok=await getToken();
  const r=await fetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",{method:"PATCH",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(obj)});
  if(!r.ok) throw await driveErr("Drive update",r);
  return true;
}
// fire-and-forget update that keeps running even as the page is backgrounded (small payload; iOS-safe)
function driveUpdateKeepalive(id,obj){
  if(!_accessToken) return;
  try{ fetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",{method:"PATCH",headers:{Authorization:"Bearer "+_accessToken,"Content-Type":"application/json"},body:JSON.stringify(obj),keepalive:true}); }catch(e){}
}

/* Phases drive the daily study budget. A flat ten-hour ceiling is a cramming-fortnight number:
   across a 300-day year it would generate a plan that is ignored by week two, and an ignored
   plan is exactly what the overflow doctrine exists to prevent. Teaching days assume lectures,
   labs and hospital practicals eat most of the day. */
const PHASES = [
  { id:"pre",    from:"2026-09-01", to:"2026-09-30", label:"Before the year opens",   hrs:2 },
  { id:"wteach", from:"2026-10-01", to:"2026-12-20", label:"Winter teaching",         hrs:3 },
  { id:"wbreak", from:"2026-12-21", to:"2027-01-01", label:"Winter holidays",         hrs:2 },
  { id:"wpre",   from:"2027-01-02", to:"2027-01-10", label:"Before the winter exams", hrs:8 },
  { id:"wexam",  from:"2027-01-11", to:"2027-02-14", label:"Winter exam period",      hrs:8 },
  { id:"steach", from:"2027-02-15", to:"2027-05-21", label:"Summer teaching",         hrs:3 },
  { id:"spre",   from:"2027-05-22", to:"2027-05-23", label:"Before the summer exams", hrs:8 },
  { id:"sexam",  from:"2027-05-24", to:"2027-06-30", label:"Summer exam period",      hrs:8 },
  { id:"resit",  from:"2027-07-01", to:"2027-09-15", label:"Holiday · resits open",   hrs:1 },
  { id:"closed", from:"2027-09-16", to:"2027-09-30", label:"Year ends",               hrs:1 },
];
const WEEKEND_BONUS = 2;         // no lectures on a teaching weekend, so the day holds more
function phaseById(id){ for(let i=0;i<PHASES.length;i++){ if(PHASES[i].id===id) return PHASES[i]; } return PHASES[0]; }
function phaseOf(iso){
  for(let i=0;i<PHASES.length;i++){ if(iso>=PHASES[i].from && iso<=PHASES[i].to) return PHASES[i]; }
  return iso < PHASES[0].from ? PHASES[0] : PHASES[PHASES.length-1];
}
function budgetFor(iso){
  const p=phaseOf(iso); let h=p.hrs;
  const wd=parseISO(iso).getDay();
  if((p.id==="wteach"||p.id==="steach") && (wd===0||wd===6)) h+=WEEKEND_BONUS;
  if(iso===DEANS_DAY) h+=WEEKEND_BONUS;
  return h;
}
/* Cumulative study hours from the start of the planning span, built once. The scheduler asks
   "how many hours are left before this deadline" for every block on every one of ~300 simulated
   days; walking the date range each time was the difference between instant and a visible stall. */
let _CUM = null;
function cumBudget(){
  if(_CUM) return _CUM;
  _CUM={};
  let h=0;
  dateRange(PHASES[0].from, PHASES[PHASES.length-1].to).forEach(function(d){ _CUM[d]=h; h+=budgetFor(d); });
  _CUM.__last=h;
  return _CUM;
}
function budgetBetween(fromISO, toISO){
  if(toISO < fromISO) return 0;
  const c=cumBudget();
  const a=(fromISO in c) ? c[fromISO] : 0;
  const b=(toISO in c) ? c[toISO]+budgetFor(toISO) : c.__last;
  return Math.max(0, b-a);
}

function termOf(iso){
  for(const k in TERMS){ const t=TERMS[k];
    if(iso>=t.from && iso<=t.to && !t.breaks.some(function(b){ return iso>=b[0] && iso<=b[1]; })) return k; }
  return null;
}
const hm = s => { const p=s.split(":"); return parseInt(p[0],10)*60+parseInt(p[1],10); };
/* The 1-based teaching week of the term `iso` falls in — what SIS means by odd and even. A week
   lying wholly inside a break is not counted, so 4–8 Jan 2027 is week 13, not 15. */
function teachWeek(iso){
  const term=termOf(iso); if(!term) return null;
  const t=TERMS[term]; let n=0;
  for(let m=weekStartOf(t.from); m<=iso; m=addDays(m,7)){
    const fri=addDays(m,4);
    if(!t.breaks.some(function(b){ return m>=b[0] && fri<=b[1]; })) n++;
  }
  return n;
}
function classesOn(iso){
  const term=termOf(iso); if(!term || PUBLIC_HOLIDAYS[iso]) return [];
  const dow=parseISO(iso).getDay();
  const parity=teachWeek(iso)%2===0 ? "even" : "odd";
  const cancelled=TIMETABLE_CANCELLED[iso]||[];
  const extra=TIMETABLE_EXTRA[iso]||[];
  const notes=TIMETABLE_NOTES[iso]||{};
  return TIMETABLE
    .filter(function(s){
      if(s.term!==term || s.day!==dow) return false;
      if(s.dates) return s.dates.indexOf(iso)>=0;
      return s.weeks==="all" || s.weeks===parity || extra.indexOf(s.id)>=0; })
    .map(function(s){ return Object.assign({}, s, {
      cancelled: cancelled.indexOf(s.id)>=0,
      confirm:   TIMETABLE_CONFIRM[iso]===s.id,
      today:     notes[s.id] || "",
      place:     ROOMS[s.room] || s.room }); })
    .sort(function(a,b){ return a.start<b.start?-1:1; });
}
function classHours(iso){
  return classesOn(iso).filter(function(s){ return !s.cancelled; })
    .reduce(function(a,s){ return a + (hm(s.end)-hm(s.start))/60; }, 0);
}
function classSpan(iso){
  const l=classesOn(iso).filter(function(s){ return !s.cancelled; });
  return l.length ? l[0].start+"–"+l[l.length-1].end : "";
}

/* ── derived indices ────────────────────────────────────────────────────────
   Built once at load. The console warnings are integrity guards, not decoration: a duplicate
   code would silently make two topics share one tick, and a mis-prefixed code would file a
   topic under the wrong subject in every count on every tab. */
const SUBJECT = {}; SUBJECTS.forEach(function(s){ SUBJECT[s.id]=s; });
const BLOCKS_OF = {}, CODES_OF = {}, SUBJECT_OF = {}, CODE_TITLE = {}, BLOCK_OF = {}, SEM_OF = {};
CURRICULUM.forEach(function(b){
  const s = SUBJECT[b.subject];
  if(!s) console.warn("CURRICULUM: block", b.key, "has no such subject:", b.subject);
  (BLOCKS_OF[b.subject]=BLOCKS_OF[b.subject]||[]).push(b);
  b.topics.forEach(function(t){
    const c=t[0];
    if(CODE_TITLE[c]!==undefined) console.warn("CURRICULUM: duplicate code", c);
    if(s && c.indexOf(s.key)!==0) console.warn("CURRICULUM: code", c, "is not prefixed", s.key);
    CODE_TITLE[c]=t[1]; SUBJECT_OF[c]=b.subject; BLOCK_OF[c]=b.key;
    SEM_OF[c]= b.sem || (s?s.sem:"both");
    (CODES_OF[b.subject]=CODES_OF[b.subject]||[]).push(c);
  });
});
/* Hours per topic, from its size. See SIZE_HOURS above. */
const HRS_OF = {}, SIZE_OF = {};
CURRICULUM.forEach(function(b){
  const h=SIZE_HOURS[b.subject];
  if(!h) console.warn("SIZE_HOURS: no hours for subject", b.subject);
  b.topics.forEach(function(t){
    const z=TOPIC_SIZE[t[0]] || BLOCK_SIZE[b.key] || "M";
    SIZE_OF[t[0]]=z; HRS_OF[t[0]]=h ? h[z] : 1;
  });
});
Object.keys(TOPIC_SIZE).forEach(function(c){ if(CODE_TITLE[c]===undefined) console.warn("TOPIC_SIZE: no such topic", c); });
/* The range shown on a subject's card, e.g. "1.5–3.5 h each". */
SUBJECTS.forEach(function(s){
  const hs=(CODES_OF[s.id]||[]).map(function(c){ return HRS_OF[c]; });
  const lo=Math.min.apply(null,hs), hi=Math.max.apply(null,hs);
  s.hrsRange = !hs.length ? "" : lo===hi ? String(lo) : lo+"–"+hi;
});
const COLOR_OF = function(code){ const s=SUBJECT[SUBJECT_OF[code]]; return s?s.color:UI.accent; };
const ALL_CODES = CURRICULUM.reduce(function(a,b){ return a.concat(b.topics.map(function(t){return t[0];})); },[]);

function examWhen(e, data){
  const b=((data&&data.examDates)||{})[e.id]||{}, p=EXAM_PERIODS[e.period];
  return { iso: b.iso || p.from, booked: !!b.iso, time: b.time||"",
           place: b.place||e.place, from:p.from, to:p.to, periodLabel:p.label, period:p.id };
}
function examOf(subjectId){ for(let i=0;i<EXAMS.length;i++){ if(EXAMS[i].subject===subjectId) return EXAMS[i]; } return null; }
/* The day you must be READY by. For an examined subject that is the day before the exam; for a
   credit-only subject it is the last teaching day of its semester. */
function deadlineOf(s, data){
  if(s.examId){ const e=EXAMS.filter(function(x){return x.id===s.examId;})[0];
                if(e) return addDays(examWhen(e,data).iso, -1); }
  return CREDIT_DUE[s.sem==="winter" ? "winter" : "summer"];
}
/* Block-level deadline. A winter block of a two-semester course is due at the January credit when
   that credit needs it — Simulation Medicine's winter sessions. A block marked paceTo:"exam" is
   due at the course's exam instead. General Pathology is taught in the winter, but the winter
   credit is "physical presence at the practicals" (SIS, checked 3 Oct 2026) and its questions
   are examined at the June final. Until that date this comment said the winter blocks were
   "examined by the January credit"; they never were, and the planner was charging Pathology's
   general questions against January for nothing. */
function blockDeadline(b, data){
  const s=SUBJECT[b.subject]; if(!s) return CREDIT_DUE.summer;
  if(b.sem==="winter" && s.sem==="both" && b.paceTo!=="exam") return CREDIT_DUE.winter;
  return deadlineOf(s, data);
}

   summer course: scheduling it in October would be planning against lectures that have not
   happened. */

/* Language cadence: one day on, one day off — alternating Czech → Italian → Czech …
   30 min each (≈ twice Czech + twice Italian a week). The anchor stays at 1 September and is
   NOT moved to the start of term: languages are the one habit that runs straight through the
   holiday, and re-anchoring would have switched them off for the whole of September.
   tickLang stores the language in each log entry, so past days keep the label they were
   ticked with regardless.

   The cadence sets the TARGET, not the limit. Every day of the week can be logged; a day off
   the cadence is an extra, and extras are what carry the languages ring past 100%. */
function langForDate(iso){
  const anchor=parseISO("2026-09-01"), d=parseISO(iso);
  const off=Math.round((d-anchor)/86400000);
  if(off<0 || off%2!==0) return null;            // before the anchor, or a break day
  return ((off/2)%2===0) ? "czech" : "italian";
}
/* An extra day has no language of its own, so the week grid proposes the one from the day before
   — on this cadence the day before a break day is always a language day, which makes an extra
   read as a second day on the same language. It is a first guess and nothing more: a second tap
   swaps it, and the Today strip asks outright instead of guessing. */
function langSuggest(iso){ return langForDate(iso) || langForDate(addDays(iso,-1)) || "czech"; }
const otherLang = l => l==="czech" ? "italian" : "czech";

/* ── helpers ────────────────────────────────────────────────────────── */
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const parseISO = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
const fmtLong = iso => parseISO(iso).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = iso => parseISO(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const fmtDay = iso => parseISO(iso).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const daysUntil = iso => { const t=parseISO(iso); const n=new Date(); const a=new Date(n.getFullYear(),n.getMonth(),n.getDate()); return Math.round((t-a)/86400000); };
const countLabel = n => n<0 ? "passed" : n===0 ? "today" : n===1 ? "tomorrow" : n+" days";
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const addDays = (iso,n) => { const d=parseISO(iso); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const dayDiff = (a,b) => Math.round((parseISO(b)-parseISO(a))/86400000);   // whole days from a → b
const dateRange = (a,b) => { const out=[]; const n=dayDiff(a,b); for(let i=0;i<=n;i++) out.push(addDays(a,i)); return out; };

function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.top="-1000px"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand("copy"); document.body.removeChild(ta); return ok; }catch(e){ return false; }
}
function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(10); }catch(e){} }
function prefersReduced(){ try{ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }
function AnimatedNumber({value, suffix, dur=520, style, className}){
  const [disp,setDisp]=useState(value);
  const from=useRef(value), raf=useRef(0);
  useEffect(function(){
    const start=from.current, end=value;
    if(start===end) return;
    if(prefersReduced()){ setDisp(end); from.current=end; return; }
    const t0=performance.now();
    const tick=function(t){ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3); setDisp(Math.round(start+(end-start)*e)); if(p<1){ raf.current=requestAnimationFrame(tick); } else { from.current=end; } };
    cancelAnimationFrame(raf.current); raf.current=requestAnimationFrame(tick);
    return function(){ cancelAnimationFrame(raf.current); };
  },[value,dur]);
  return <span className={className} style={style}>{disp}{suffix||""}</span>;
}
function fmtTaskWhen(task){
  const dayPart = task.date===todayStr() ? "today" : fmtDay(task.date);
  return task.time ? dayPart+" · "+task.time : dayPart;
}

/* ── productivity — data layer ────────────────────────────────────────
   Everything here is date-keyed. A bare boolean cannot answer "what did I do THIS week",
   which is the only question this tab asks.

   Weeks run Monday–Sunday, local time. Every log entry carries tickedAt — when the box was
   ticked, as opposed to the day it is ticked FOR. Back-filling four days on Sunday is a
   different fact from doing them daily, and without that field the two are indistinguishable. */
const weekStartOf = iso => addDays(iso, -(((parseISO(iso).getDay()+6)%7)));   // Mon = 0
const weekDaysOf  = iso => { const s=weekStartOf(iso); return dateRange(s, addDays(s,6)); };
const nowISO      = () => new Date().toISOString();
/* a tick landing more than a day after the day it is for was back-filled */
const loggedLate  = (date, tickedAt) => !!tickedAt && dayDiff(date, String(tickedAt).slice(0,10)) > 1;

/* Gym and languages only. The projects tracker and the physiology ring were both retired with
   second year: the physiology ring measured a curriculum that no longer exists, and the four
   projects it sat beside are finished. Coursework is now counted straight off doneAt, so it
   needs no definition object of its own. */
function DEFAULT_PROD(){
  return {
    gym:  { targetPerWeek:3, log:{} },
    lang: { log:{} },
  };
}
function migrateProd(p){
  const d=DEFAULT_PROD();
  if(!p || typeof p!=="object") return d;
  // built explicitly, so a retired key (projects, physio) is dropped rather than round-tripped
  // to Drive forever
  const out={
    gym:  Object.assign({}, d.gym,  p.gym||{}),
    lang: Object.assign({}, d.lang, p.lang||{}),
  };
  ["gym","lang"].forEach(function(k){ if(!out[k].log || typeof out[k].log!=="object") out[k].log={}; });
  if(!(out.gym.targetPerWeek>0)) out.gym.targetPerWeek=3;
  return out;
}

/* ── the derived schedule ──────────────────────────────────────────────────
   Nothing here is hand-written. Every day is recomputed from data.done, the academic calendar
   and how close each subject's deadline is, so the plan cannot go stale — which is exactly how
   the previous two hand-written versions failed.

   The window ROLLS. A fixed start-and-end pair is what left this app showing "Nothing scheduled"
   the day after its exam, and an academic year is 300 days: rendering all of them through
   in-browser Babel would freeze the page for no benefit. Fourteen days from today is what you
   can actually act on; the shape of the year lives on the Timeline and the Subjects tab.

   Three tiers, all derived:
     todo    unticked            → scheduled, cheapest-deadline-first
     review  ticked a while ago  → resurfaced before its exam, briefly
     skip    manually skipped    → never scheduled

   Days are filled to an HOURS budget that varies by phase (see PHASES). Whatever does not fit is
   returned as `overflow` and shown on Plan and Today. A schedule that quietly drops work is worse
   than one that admits it does not fit, because only the second lets you choose what to cut. */
const PLAN_DAYS = 14;
const REVIEW_AFTER = 21;      // days since ticking before a topic is worth seeing again
const REVIEW_HRS = 0.4;
const REVIEW_PER_DAY = 4;
const REVIEW_HORIZON = 60;    // only resurface topics whose deadline is inside this many days

/* The manual override is checked FIRST, deliberately. If a block turns out not to be examinable,
   one tap in Progress removes it from every count and every day — no code change, no redeploy. */
function tierOf(code, data){
  const ov = data && data.study && data.study.tier ? data.study.tier[code] : null;
  if(ov==="skip" || ov==="todo") return ov;
  if(data && data.done && data.done[code]) return "review";
  return "todo";
}
/* Curriculum order, not frequency order: when you are following a course, teaching order IS the
   right order, and jumping around a syllabus is how you arrive at a lecture unprepared. */
function blockQueue(b, data){
  return b.topics.map(function(t){ return t[0]; }).filter(function(c){ return tierOf(c,data)==="todo"; });
}
/* Everything the scheduler needs about one block, in deadline order. Blocks whose deadline has
   already passed are dropped: nothing is gained by scheduling a credit you have missed.
   A block whose topics are all done STAYS: its hours still count towards how far along its
   subject is (`total`, every topic not skipped), which is what fillDay's shares are measured in. */
function liveBlocks(data, today){
  return CURRICULUM.map(function(b){
      const total=b.topics.reduce(function(a,t){ return tierOf(t[0],data)==="skip" ? a : a+HRS_OF[t[0]]; }, 0);
      return { b:b, key:b.key, subject:b.subject, open:blockOpen(b), due:blockDeadline(b,data), total:total };
    })
    .filter(function(x){ return x.due >= today && x.total>0; })
    .sort(function(a,b){ return a.due<b.due ? -1 : a.due>b.due ? 1 : (a.key<b.key?-1:1); });
}
function coverageOf(id, data){
  const codes=(CODES_OF[id]||[]).filter(function(c){ return tierOf(c,data)!=="skip"; });
  const done=codes.filter(function(c){ return data.done[c]; }).length;
  return { done, total:codes.length, pct: codes.length?Math.round(done/codes.length*100):0 };
}
function yearCoverage(data){
  const codes=ALL_CODES.filter(function(c){ return tierOf(c,data)!=="skip"; });
  const done=codes.filter(function(c){ return data.done[c]; }).length;
  return { done, total:codes.length, pct: codes.length?Math.round(done/codes.length*100):0 };
}

/* Per-subject pace. Hours are compared against the share of the calendar this subject can
   realistically claim — its remaining work as a fraction of everything still outstanding — so
   "does Pathology fit" is answered against the days Pathology will actually get, not against
   every hour in the year. */
function paceOf(s, data, today){
  const codes = (CODES_OF[s.id]||[]).filter(function(c){ return tierOf(c,data)!=="skip"; });
  const left  = codes.filter(function(c){ return !data.done[c]; });
  const deadline = deadlineOf(s, data);
  const days  = Math.max(1, dayDiff(today, deadline)+1);
  const hoursNeed = left.reduce(function(a,c){ return a+HRS_OF[c]; }, 0);
  return { total:codes.length, done:codes.length-left.length, remaining:left.length,
           deadline, days, hoursNeed,
           perDay: left.length ? left.length/days : 0,
           perWeek: left.length ? Math.ceil(left.length/Math.max(0.5, days/7)) : 0,
           overdue: deadline < today };
}
/* Topics ticked long enough ago that they have probably gone, whose exam is close enough for
   that to matter. Over a fortnight the old planner got this free from triplet rehearsal; over
   nine months nothing re-exposes anything, and a topic ticked in October is gone by January. */
function dueForReview(data, today, live){
  const doneAt=data.doneAt||{}, liveIds={};
  live.forEach(function(s){ liveIds[s.id]=deadlineOf(s,data); });
  return Object.keys(doneAt).filter(function(c){
    if(!data.done[c] || tierOf(c,data)==="skip") return false;
    const sid=SUBJECT_OF[c]; if(!sid || !(sid in liveIds)) return false;
    if(dayDiff(today, liveIds[sid]) > REVIEW_HORIZON) return false;
    return dayDiff(doneAt[c], today) >= REVIEW_AFTER;
  }).sort(function(a,b){ return doneAt[a]<doneAt[b] ? -1 : doneAt[a]>doneAt[b] ? 1 : 0; });
}

/* Every subject moves, every week. Filling each day from one subject's queue would leave
   Pharmacology untouched until January.

   A second reason, from the pharmacology practical teacher on 1 October 2026: do not park
   pharmacology while you study pathophysiology. Every year the students who go
   pathophysiology-first get late pharmacology exam dates, and can end up with neither exam
   passed. Her advice is to read pharmacology alongside — which is what this does.

   SHARES OF THE HOURS (3 Oct 2026). Linas's order is "pathophysio, then pharma, then internal,
   and if still time once or twice a week patho". With topics of 1.5–3.5 h a three-hour day holds
   one or two, so a plain order would mean pathophysiology every day and pharmacology never.
   Instead each topic placed goes to the GROUP (STUDY_SHARE: pathophysiology 40, pharmacology 30,
   internal medicine 20, pathology 7, everything else 3) whose hours done so far are furthest
   below its share — hours done divided by the share, lowest first. At the start every group is
   at zero and the tie goes in that order; after that the hours settle into the shares, and a
   group that falls behind its share is the next one chosen, so nothing is ever parked.
   The shares hold until the summer semester opens. From then on Pathology and the summer
   courses are all "the rest", paced to their deadlines.

   Why hours, and not how far along each list (the rule from 2 to 3 Oct 2026): a weight on the
   share of a list DONE gives each subject time roughly in proportion to the length of its list,
   so the 42-question internal-medicine list got 0.9 topics a week — fewer than Pathology's 1.4,
   which was also being pushed towards a January deadline it did not have. And a weight on the
   hours REMAINING front-loads: tried on paper, 1.3 on pathophysiology meant about three weeks of
   nothing else. Hours done, divided by a share, does neither.

   Inside the rest, the subject furthest BEHIND AN EVEN PACE goes first: the share of its study
   time already gone (from the day its blocks open to their deadline) minus the share of its
   hours already done. So a January deadline moves faster than a June one, and a small course
   still gets its turn. Inside a subject, the block with most hours left goes first, which keeps
   its blocks moving together. Measuring by subject and group rather than by block matters: when
   blocks were ranked one by one, a subject cut into more blocks won more slots.

   Preparation pinned to a class (PREP_PIN) is placed before any of this, on its own day.

   A topic can cost more than a whole day — Pharmacology and Pathophysiology's largest are 3.5 h
   against a three-hour teaching day. Capping its cost at the day's budget is what stops such a
   topic from being unschedulable forever: it simply takes the day. Without the cap those
   subjects sat in overflow from October to January and were never once put on a day. */
const GROUP_SHARE = { rest:REST_SHARE }; STUDY_SHARE.forEach(function(g){ GROUP_SHARE[g.id]=g.share; });
const GROUP_ORDER = STUDY_SHARE.map(function(g){ return g.id; }).concat(["rest"]);
const SHARE_TOTAL = STUDY_SHARE.reduce(function(a,g){ return a+g.share; }, REST_SHARE);
function groupOf(subject, date){
  return date < SEM_OPEN.summer && GROUP_SHARE[subject]!==undefined && subject!=="rest" ? subject : "rest";
}

/* Preparation that belongs to a class rather than to a share. Simulation Medicine's Moodle
   theory and assignments are checked at the start of every practical and are a condition for
   being let in (the course coordinator's e-mail of 1 Oct 2026), so the k-th topic of the block
   is due the day before the k-th date of its timetable slot. The e-mail gives no topic per date;
   it says each topic builds on the one before, so syllabus order is taken as class order. A
   pinned topic that was missed is placed first on the next day it fits. Summer sessions get
   pinned once their dates are in TIMETABLE; until then SIM-S is paced like any other block. */
const PREP_PIN = { "SIM-W":"sim-prac" };
const PIN_DAY = {};
Object.keys(PREP_PIN).forEach(function(key){
  const b=CURRICULUM.filter(function(x){ return x.key===key; })[0];
  const slot=TIMETABLE.filter(function(t){ return t.id===PREP_PIN[key]; })[0];
  if(!b || !slot || !slot.dates){ console.warn("PREP_PIN: no block or no class dates for", key); return; }
  if(slot.dates.length!==b.topics.length) console.warn("PREP_PIN:", key, "has", b.topics.length, "topics but", slot.dates.length, "class dates");
  b.topics.forEach(function(t, i){ if(slot.dates[i]) PIN_DAY[t[0]]=addDays(slot.dates[i], -1); });
});

function fillDay(date, blocks, queue){
  const budget=budgetFor(date); let left=budget; const items=[];
  // the blocks being taught today and not yet due, and the hours still queued in each
  const open=blocks.filter(function(x){ return date >= x.open && date <= x.due; });
  const rem={}, gone={};
  open.forEach(function(x){
    let h=0; const q=queue[x.key]; for(let i=0;i<q.length;i++) h+=HRS_OF[q[i]];
    rem[x.key]=h;
    const span=budgetBetween(x.open, x.due);   // the block's whole study time, and the share of it already past
    gone[x.key]=span>0 ? budgetBetween(x.open, addDays(date,-1))/span : 1;
  });
  const opened=open.filter(function(x){ return queue[x.key].length; }).length;
  const fits=function(x){ const c=queue[x.key][0]; return !!c && Math.min(HRS_OF[c],budget) <= left+0.001; };
  const place=function(x){
    const c=queue[x.key].shift();
    items.push({ code:c, subject:x.subject, hrs:HRS_OF[c] });
    left -= Math.min(HRS_OF[c], budget); rem[x.key] -= HRS_OF[c];
  };
  // first, preparation pinned to a class: today's, and any that was missed, in class order
  open.forEach(function(x){
    if(!PREP_PIN[x.key]) return;
    while(queue[x.key].length && PIN_DAY[queue[x.key][0]] && PIN_DAY[queue[x.key][0]] <= date && fits(x)) place(x);
  });
  const shared=open.filter(function(x){ return !PREP_PIN[x.key]; });
  /* Every comparison below ends on a fixed order — group order, deadline, subject, key. Today's
     list and the week's table are built by running this from different starting points and are
     expected to agree; a tie left to the sort would let them differ. */
  while(left > 0.01){
    const g={};
    shared.forEach(function(x){
      const k=groupOf(x.subject, date), e=g[k]||(g[k]={ done:0, any:false });
      e.done+=x.total-rem[x.key]; if(fits(x)) e.any=true;
    });
    let best=null, bestScore=0;
    GROUP_ORDER.forEach(function(k){
      const e=g[k]; if(!e || !e.any) return;
      const score=e.done / GROUP_SHARE[k];
      if(best===null || score < bestScore-1e-9){ best=k; bestScore=score; }
    });
    if(best===null) break;
    // within the group: the subject furthest behind an even pace …
    const subj={};
    shared.forEach(function(x){
      if(groupOf(x.subject, date)!==best) return;
      const e=subj[x.subject]||(subj[x.subject]={ id:x.subject, total:0, rem:0, due:x.due, target:0, fit:false });
      e.total+=x.total; e.rem+=rem[x.key]; e.target+=x.total*gone[x.key];
      if(x.due<e.due) e.due=x.due; if(fits(x)) e.fit=true;
    });
    const behind=function(e){ return (e.target-(e.total-e.rem))/e.total; };
    const s=Object.keys(subj).map(function(k){ return subj[k]; }).filter(function(e){ return e.fit; })
      .sort(function(a,b){ return behind(b)-behind(a) || (a.due<b.due?-1:a.due>b.due?1:(a.id<b.id?-1:a.id>b.id?1:0)); })[0];
    // … then its block with most hours left
    const x=shared.filter(function(y){ return y.subject===s.id && fits(y); })
      .sort(function(a,b){ return rem[b.key]-rem[a.key] || (a.key<b.key?-1:a.key>b.key?1:0); })[0];
    place(x);
  }
  return { items, left, budget, open:opened };
}

/* What actually does not fit, established by simulating the whole remaining year rather than by
   dividing hours by days. The share-of-the-calendar arithmetic that stood here first was wrong in
   a way that mattered: it charged the October-to-January days against subjects not examined until
   May, and reported 181 h of overflow that did not exist. Simulating uses the same placement rule
   as the visible plan, so the banner and the schedule can never contradict each other. */
/* ── lists that hold still ─────────────────────────────────────────────────
   The scheduler only ever looks at what is unticked, so a list built from the live state moves
   every time a box is ticked: the ticked topic drops out and the next one slides up to take its
   place. For a queue that is right. For a day it is wrong — today's list could never be finished,
   and tomorrow's changed each time today's was touched.

   doneAt is what fixes it. `beforeTicks` rebuilds the state as it stood before the given days'
   ticks by putting those topics back, and anything that must not move while it is being worked
   through — today's list, the week's table — is planned from that state instead. */
function beforeTicks(data, days){
  const at=data.doneAt||{}, done=Object.assign({}, data.done);
  Object.keys(at).forEach(function(c){ if(done[c] && days.indexOf(at[c])>=0) done[c]=false; });
  return Object.assign({}, data, { done:done });
}
/* Today is planned from this morning's state, so its list is the one the day started with:
   ticking a topic marks it done where it stands rather than pulling tomorrow's first topic in
   behind it. Every later day is planned from what is really left, minus what today has claimed —
   so work done ahead still frees those days up at once.

   Returns the blocks, today's fill, and the queues as they stand for tomorrow. buildPlan and
   projectYear both start here, which is what keeps the banner and the schedule in step. */
function startDay(data, today){
  const morning=beforeTicks(data, [today]);
  const blocks=liveBlocks(morning, today);
  const q={}; blocks.forEach(function(x){ q[x.key]=blockQueue(x.b,morning).slice(); });
  const first=fillDay(today, blocks, q);
  const held={}; first.items.forEach(function(i){ held[i.code]=1; });
  const queue={};
  blocks.forEach(function(x){ queue[x.key]=blockQueue(x.b,data).filter(function(c){ return !held[c]; }); });
  return { blocks:blocks, first:first, queue:queue };
}

function projectYear(data, today){
  const sd=startDay(data, today), blocks=sd.blocks, queue=sd.queue;
  if(!blocks.length) return [];
  let last=today; blocks.forEach(function(x){ if(x.due>last) last=x.due; });
  // today is already placed by startDay; everything else has from tomorrow to its deadline
  dateRange(addDays(today,1), last).forEach(function(d){ fillDay(d, blocks, queue); });
  const bySub={};
  blocks.forEach(function(x){
    const missed=queue[x.key]; if(!missed.length) return;
    const s=SUBJECT[x.subject];
    const e=bySub[x.subject]||(bySub[x.subject]={ id:x.subject, short:s.short, color:s.color,
                                                  deadline:x.due, topics:0, hours:0 });
    e.topics+=missed.length;
    e.hours +=missed.reduce(function(a,c){ return a+HRS_OF[c]; },0);
    if(x.due<e.deadline) e.deadline=x.due;
  });
  return Object.keys(bySub).map(function(k){ const e=bySub[k]; e.hours=Math.round(e.hours); return e; })
    .sort(function(a,b){ return a.deadline<b.deadline?-1:1; });
}

function buildPlan(data, today){
  const days   = dateRange(today, addDays(today, PLAN_DAYS-1));
  const live   = SUBJECTS.filter(function(s){ return deadlineOf(s,data) >= today; });
  const pace={};
  live.forEach(function(s){ pace[s.id]=paceOf(s,data,today); });
  const sd=startDay(data, today), blocks=sd.blocks, queue=sd.queue;

  const reviewed={};
  const out = days.map(function(date, n){
    // day 0 is today, pinned to this morning: its items include the ones already ticked
    const f = n===0 ? sd.first : fillDay(date, blocks, queue);
    const items=f.items, review=[]; let left=f.left; const budget=f.budget, open=f.open;
    dueForReview(data, date, live).forEach(function(c){
      if(reviewed[c] || review.length>=REVIEW_PER_DAY || left < REVIEW_HRS) return;
      reviewed[c]=1; review.push(c); left-=REVIEW_HRS;
    });
    const subs=[]; items.forEach(function(i){ if(subs.indexOf(i.subject)<0) subs.push(i.subject); });
    const ph=phaseOf(date);
    return { date, day:parseISO(date).toLocaleDateString("en-GB",{weekday:"short"}),
             phase:ph.id, phaseLabel:ph.label,
             label: subs.length ? subs.map(function(id){ return SUBJECT[id].short; }).join(" · ")
                  : review.length ? "Review — nothing new due"
                  : ph.label,
             budget, est:"~"+(Math.round((budget-left)*2)/2)+" h",
             open, items, review };
  });

  const short = projectYear(data, today);
  out.overflow = { bySubject:short, hours: short.reduce(function(a,x){ return a+x.hours; },0) };
  out.pace = pace;
  return out;
}

/* ── the week, as it was planned on Monday ──────────────────────────────────
   The Productivity tab needs a week that holds still: a target that does not shrink when a day
   is skipped or grow when one is finished early, and a box for every topic that stays where it
   is once ticked. So the seven days are planned once, from the state as it stood on Monday
   morning — this week's ticks put back — with the very same fillDay the Plan uses.

   Followed day by day, this IS the Plan: both reach each morning with the same topics left, so
   they list the same things. They part only when you are off it, and then on purpose. Behind,
   the Plan re-flows the missed topics into the days that are left, within each day's budget,
   while this table leaves them open on the day they were due. Ahead, the Plan refills the freed
   days, while this table shows the week's own list finishing early.

   Nothing is stored. It is recomputed on every render from done + doneAt, so it cannot go
   stale — and that is also why booking an exam date or skipping a block mid-week re-deals the
   whole week, past days included. */
function weekPlan(data, today){
  const week  = weekDaysOf(today);
  const start = beforeTicks(data, week);
  const blocks= liveBlocks(start, week[0]);
  const queue = {}; blocks.forEach(function(x){ queue[x.key]=blockQueue(x.b,start).slice(); });
  const cells={}, planned={};                 // cells[subject][iso] = { planned:[code…], extra:[code…] }
  const cell=function(code, iso){
    const sid=SUBJECT_OF[code]; if(!sid) return null;
    const row=cells[sid]||(cells[sid]={});
    return row[iso]||(row[iso]={ planned:[], extra:[] });
  };
  week.forEach(function(d){
    fillDay(d, blocks, queue).items.forEach(function(i){ const c=cell(i.code, d); if(c){ c.planned.push(i.code); planned[i.code]=d; } });
  });
  /* Ticked this week but not on this week's list: work done ahead of it. It has no box of its
     own, so it is counted on the day it was ticked. */
  const at=data.doneAt||{}; let extra=0;
  Object.keys(at).forEach(function(code){
    if(!data.done[code] || planned[code] || week.indexOf(at[code])<0) return;
    const c=cell(code, at[code]); if(c){ c.extra.push(code); extra++; }
  });
  const codes=Object.keys(planned);
  return { week:week, cells:cells, planned:planned, total:codes.length, extra:extra,
           done:   codes.filter(function(c){ return data.done[c]; }).length,
           behind: codes.filter(function(c){ return planned[c]<today && !data.done[c]; }).length,
           subjects: SUBJECTS.filter(function(s){ return cells[s.id]; }) };
}

/* The next thing with a date on it — a booked exam, an exam period opening, a credit deadline,
   or one of your own (DEADLINES). Countdown and the Subjects tab both read this. */
function nextMilestone(data, today){
  const out=[];
  EXAMS.forEach(function(e){
    const w=examWhen(e,data), s=SUBJECT[e.subject];
    out.push({ iso:w.iso, label:e.label, sub:s, booked:w.booked, exam:e, when:w,
               detail: w.booked ? fmtLong(w.iso)+(w.time?" · "+w.time:"")+" · "+w.place
                                : w.periodLabel+" · "+fmtShort(w.from)+" – "+fmtShort(w.to)+" · date not booked" });
  });
  out.push({ iso:CREDIT_DUE.winter, label:"Winter credits due", sub:null, booked:true,
             detail:"All winter credits signed · "+fmtLong(CREDIT_DUE.winter) });
  out.push({ iso:CREDIT_DUE.summer, label:"Summer credits due", sub:null, booked:true,
             detail:"All summer credits signed · "+fmtLong(CREDIT_DUE.summer) });
  DEADLINES.forEach(function(x){
    out.push({ iso:x.iso, label:x.label, sub:SUBJECT[x.subject], booked:true,
               detail:fmtLong(x.iso)+" · "+x.time+" · "+x.short+(x.confirm?" · date to confirm":"") });
  });
  const future=out.filter(function(x){ return x.iso>=today; }).sort(function(a,b){ return a.iso<b.iso?-1:1; });
  return future[0]||null;
}

/* A category counts toward the combined score when it is CONFIGURED, not when it happens to have
   activity this week. Dropping out on a quiet week would make Monday read 100% off one gym
   session and then ratchet downwards as the week fills in. */
function prodStats(data, today){
  const week = weekDaysOf(today);
  const p    = data.prod;
  const doneAt = data.doneAt||{};

  // still ticked AND ticked within this week — unticking removes the doneAt entry entirely
  const workN   = Object.keys(doneAt).filter(function(c){ return data.done[c] && week.indexOf(doneAt[c])>=0; }).length;
  const gymN    = week.filter(function(d){ return p.gym.log[d]; }).length;
  const langDays= week.filter(function(d){ return langForDate(d); });
  const langN   = week.filter(function(d){ return p.lang.log[d]; }).length;

  const split={ czech:0, italian:0 };
  week.forEach(function(d){ const e=p.lang.log[d]; if(e){ const l=e.lang||langSuggest(d); split[l]=(split[l]||0)+1; } });

  /* The coursework target is what the Plan puts on this week's seven days — the number of topics
     the daily budgets actually hold, fixed on Monday (see weekPlan). It used to be the pace
     needed to finish every live subject on time, which came to 39 topics a week against a plan
     that schedules about half that: a target nobody was ever asked to meet, so the ring could
     not reach 100 by doing everything the Plan said. The shortfall between the two is real, and
     it is reported where it belongs — in the overflow banner on Today and Plan, not here.
     If nothing is planned the target is zero and the ring drops out of the average rather than
     sitting at 0%. */
  const plan = weekPlan(data, today);

  /* `uncapped` is the one switch that lets a category score past its target. Languages carry it,
     at Linas's request: the cadence is three or four days a week, he may well study six or seven,
     and the surplus should show — on its own ring and in the headline. Gym and coursework stop
     at 100 on purpose; he asked for gym to stay as it was, and nobody asked for coursework. */
  const cats=[
    { key:"work", label:"Coursework", color:UI.accent, weight:2, n:workN, d:plan.total,    configured:plan.total>0 },
    { key:"gym",  label:"Gym",        color:"#BE123C", weight:1, n:gymN,  d:p.gym.targetPerWeek||0, configured:(p.gym.targetPerWeek||0)>0 },
    { key:"lang", label:"Languages",  color:LANGC.czech, weight:1, n:langN, d:langDays.length, configured:langDays.length>0, split:split, uncapped:true },
  ].map(function(c){
    const raw   = c.d>0 ? c.n/c.d : 0;
    const score = c.uncapped ? raw : Math.min(1, raw);     // what the category is worth in the mean
    return Object.assign(c, { raw:raw, score:score, pct: Math.round(score*100) });
  });
  // keyed access as well as ordered: the old code read cats[0] and cats[2] positionally, which
  // broke silently the moment a category was removed
  const byKey={}; cats.forEach(function(c){ byKey[c.key]=c; });

  const inScore = cats.filter(function(c){ return c.configured; });
  const wsum    = inScore.reduce(function(a,c){ return a+c.weight; }, 0);
  const mean    = function(f){ return wsum>0 ? Math.round(inScore.reduce(function(a,c){ return a + c.weight*f(c); }, 0)/wsum*100) : 0; };
  /* A capped category contributes at most 1, so only an uncapped one can lift the headline past
     100. `bonus` is how much of the headline that surplus accounts for — the same mean taken with
     every category held at 1 — so the screen can say where the extra came from. */
  const combined= mean(function(c){ return c.score; });
  const bonus   = combined - mean(function(c){ return Math.min(1, c.score); });
  return { week, cats, byKey, combined, bonus, counted:inScore.length, plan };
}

/* ── persistence ──────────────────────────────────────────────────── */
const KEY = "study_planner_v2";
/* ── study state ───────────────────────────────────────────────────────
   One sparse map now, keyed the way the rest of the app is keyed.

   tier  code → "todo"|"skip", the manual override tierOf() honours first.

   `reh` (triplet rehearsals) and `prac` (practical numbers) went with second year — both were
   shapes of the physiology oral, and neither has a third-year meaning. */
function DEFAULT_STUDY(){ return { tier:{} }; }
function migrateStudy(x){
  const out = Object.assign({}, DEFAULT_STUDY(), (x && typeof x==="object") ? x : {});
  if(!out.tier || typeof out.tier!=="object" || Array.isArray(out.tier)) out.tier={};
  delete out.reh; delete out.prac;
  return out;
}

/* Object.assign in migrate() keeps a user's saved goals array, so a new DEFAULT_DATA goal never
   reaches anyone who has already used the app. Seeding has to be additive and idempotent — the
   flag means deleting a goal on purpose does not resurrect it on the next load. A NEW flag name
   is required for a new set: reusing goalsSeededOral would silently seed nobody. */
const Y3_GOALS = () => ([
  { id:"goal-y3-winter", title:"Clear the winter exam period", date:"2027-02-14", steps:[
    { id:"s-w-cred", text:"Every winter credit signed by 8 January",            done:false },
    { id:"s-w-pfy",  text:"Pathological Physiology II — exam passed",           done:false },
    { id:"s-w-pha",  text:"Pharmacology II — exam passed",                      done:false },
    { id:"s-w-iim",  text:"Introduction to Internal Medicine II — exam passed", done:false },
  ]},
  { id:"goal-y3-summer", title:"Clear the summer exam period", date:"2027-06-30", steps:[
    { id:"s-s-cred", text:"Every summer credit signed by 21 May",               done:false },
    { id:"s-s-pat",  text:"Pathology — the twenty-credit final passed",         done:false },
    { id:"s-s-mpe",  text:"Medical Psychology and Ethics — exam passed",        done:false },
  ]},
]);

/* schemaV lives here as 2, never 3, for the same reason the seeding flag cannot live here at
   all: Object.assign hands the default to any saved blob that lacks the key, so the default has
   to be the OLD value and migrate() stamps the new one. Getting this backwards would make the
   year-2 wipe below a no-op for exactly the person who needs it. */
const DEFAULT_DATA = () => ({
  done:{}, doneAt:{}, tasks:[], gcalEnabled:false, updatedAt:0,
  prod:DEFAULT_PROD(), study:DEFAULT_STUDY(),
  examDates:{},          // examId → {iso, time} once booked in SIS
  schemaV:2,
  goals:[],
});
function migrate(d){
  const out = Object.assign(DEFAULT_DATA(), d);
  if(out.tasks && !Array.isArray(out.tasks)){            // old per-date map → flat array
    const flat=[];
    Object.keys(out.tasks).forEach(function(date){
      (out.tasks[date]||[]).forEach(function(t){ flat.push({ id:t.id||uid(), text:t.text, date:date, time:t.time||null, important:!!t.important, done:!!t.done, gcalId:t.gcalId||null }); });
    });
    out.tasks=flat;
  }
  delete out.health;   // the Health tab is gone — drop the dead blob rather than syncing it forever

  /* Second year → third year, ONCE. The gate is not optional: migrate() runs on every page load
     AND on every Drive adopt, so an ungated wipe would erase every third-year tick on the next
     reload. The physiology codes could not collide with the new prefixes, but they would sit in
     the Drive blob forever and quietly inflate any future count over data.done. */
  if((out.schemaV||0) < 3){
    /* Wiped from the synced blob, but not destroyed: the old maps are dropped into a separate
       localStorage key that is never read, never rendered and never pushed to Drive. That keeps
       the reason for the wipe intact — no stale second-year data syncing forever — without
       making a year of ticks unrecoverable if it turns out someone wanted them. */
    try{
      if(Object.keys(out.done||{}).length){
        localStorage.setItem(KEY+"_y2_archive", JSON.stringify({
          archivedAt:new Date().toISOString(), subject:"Physiology, second year",
          done:out.done, doneAt:out.doneAt||{}, study:out.study||{} }));
      }
    }catch(e){}
    out.done={}; out.doneAt={};
    out.study={ tier:{} };
    delete out.goalsSeededOral;
    out.schemaV=3;
  }

  out.prod   = migrateProd(out.prod);
  out.study  = migrateStudy(out.study);
  if(!Array.isArray(out.goals)) out.goals=[];
  if(!out.goalsSeededY3){ out.goalsSeededY3=true;
    Y3_GOALS().forEach(function(g){ if(!out.goals.some(function(x){ return x.id===g.id; })) out.goals.push(g); }); }
  if(!out.examDates || typeof out.examDates!=="object" || Array.isArray(out.examDates)) out.examDates={};
  if(!out.doneAt || typeof out.doneAt!=="object" || Array.isArray(out.doneAt)) out.doneAt={};
  return out;
}
const hasCloud = () => { try{ return window.storage && typeof window.storage.get==="function"; }catch(e){ return false; } };
/* The fresh-install path goes through migrate() too. It must NOT be short-circuited to
   DEFAULT_DATA(): the goal-seeding flag has to be stamped here, and it cannot live in
   DEFAULT_DATA() because Object.assign would then hand it to existing users as already-true and
   the oral goal would never be seeded for the one person who needs it. */
function loadData(){ try{ const s=localStorage.getItem(KEY); if(s) return migrate(JSON.parse(s)); }catch(e){} return migrate({}); }
function saveData(d){ const s=JSON.stringify(d); if(hasCloud()){ try{ window.storage.set(KEY,s); }catch(e){} } try{ localStorage.setItem(KEY,s); }catch(e){} }

   the second lets you choose what to cut. This is the "does not fit" case, stated per subject —
   which is the only granularity you can act on when eleven courses share one calendar. */
/* A one-topic shortfall nine months out is noise, not news: it would leave the banner permanently
   on screen and train you to stop reading it. Only a shortfall worth acting on is reported. */
const OVERFLOW_MIN_TOPICS = 3;
function OverflowBanner({sched, A, compact}){
  const o=sched.overflow; if(!o) return null;
  const list=(o.bySubject||[]).filter(function(x){ return x.topics>=OVERFLOW_MIN_TOPICS; })
                              .sort(function(a,b){ return b.hours-a.hours; });
  if(!list.length) return null;
  const hours=list.reduce(function(a,x){ return a+x.hours; },0);
  const show=compact ? list.slice(0,2) : list;
  return (
    <div style={{padding:"13px 15px",border:"0.5px solid #b4530955",borderRadius:"var(--r-lg)",background:"#b453090f",marginBottom:16}}>
      <div style={{fontSize:14,color:"#92400e",marginBottom:5}}>
        <i className="fa-solid fa-triangle-exclamation" style={{marginRight:8}} aria-hidden="true"/>
        <strong>About {hours} h more than the calendar holds{list.length>1?", across "+list.length+" subjects":""}.</strong>
      </div>
      {show.map(function(x){ return (
        <p key={x.id} style={{fontSize:13,color:"#92400e",margin:"0 0 4px",lineHeight:1.5}}>
          <strong>{x.short}</strong> — {x.topics} topics unplaced before {fmtShort(x.deadline)}, about {x.hours} h.
        </p>
      );})}
      {compact
        ? <p style={{fontSize:12.5,color:"#92400e",margin:"6px 0 0",lineHeight:1.5}}>
            {list.length>2 ? "And "+(list.length-2)+" more. " : ""}
            Nothing has been dropped — see <button onClick={()=>A.go("plan")} style={{background:"none",border:0,padding:0,color:"#92400e",textDecoration:"underline",font:"inherit"}}>Plan</button> for the full picture.
          </p>
        : <p style={{fontSize:13,color:"#92400e",margin:"8px 0 0",lineHeight:1.5}}>
            Nothing has been quietly dropped — it is listed here so the cut is yours. The levers are
            booking a later exam date on <button onClick={()=>A.go("subjects")} style={{background:"none",border:0,padding:0,color:"#92400e",textDecoration:"underline",font:"inherit"}}>Subjects</button>,
            raising the daily budget, or marking blocks you will not study as skipped in <button onClick={()=>A.go("progress")} style={{background:"none",border:0,padding:0,color:"#92400e",textDecoration:"underline",font:"inherit"}}>Progress</button>.
          </p>}
    </div>
  );
}

      {langForDate(p.date) && <LangChip lang={langForDate(p.date)}/>}

  );
}

/* ── Today dashboard — daily briefing card + upcoming events, read back from your calendar ── */
function eventDateKey(e){
  if(e.allDay) return e.start;                                  // all-day start is already YYYY-MM-DD
  const d=new Date(e.start);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function fmtEventTime(e){
  if(e.allDay) return "All day";
  return new Date(e.start).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}
function dayHeaderLabel(key){
  const ts=todayStr();
  const tm=new Date(); tm.setDate(tm.getDate()+1);
  const tmStr=tm.getFullYear()+"-"+pad(tm.getMonth()+1)+"-"+pad(tm.getDate());
  if(key===ts) return "Today";
  if(key===tmStr) return "Tomorrow";
  return fmtDay(key);
}
// The daily-briefing routine writes ONE all-day event titled "📋 Daily Briefing — YYYY-MM-DD"; it's the card, never a row.
function isBriefing(e){ return !!e.allDay && typeof e.title==="string" && e.title.trim().indexOf("📋 Daily Briefing")===0; }
function groupByDay(events){
  const groups=[], idx={};
  events.forEach(function(e){
    const k=eventDateKey(e);
    if(!(k in idx)){ idx[k]=groups.length; groups.push([k,[]]); }
    groups[idx[k]][1].push(e);
  });
  return groups;
}

// one shared calendar read, lifted so the top-of-Today briefing card and the Upcoming list share a single fetch
function useCalendarFeed(gcalOn){
  const [events,setEvents]=useState(null);
  const [err,setErr]=useState("");
  const [refreshedAt,setRefreshedAt]=useState(0);
  const [loading,setLoading]=useState(false);
  const [tick,setTick]=useState(0);
  useEffect(function(){
    if(!gcalOn) return;
    if(!tokenValid()) return;
    let live=true; setLoading(true);
    gcalListEvents().then(function(items){ if(live){ setEvents(items); setErr(""); setRefreshedAt(Date.now()); setLoading(false); } })
      .catch(function(e){ if(live){ setErr(e&&e.message?e.message:"couldn't load"); setLoading(false); } });
    const onF=function(){ setTick(function(t){return t+1;}); };
    window.addEventListener("focus",onF);
    return function(){ live=false; window.removeEventListener("focus",onF); };
  },[gcalOn,tick]);
  return { events:events, err:err, loading:loading, refreshedAt:refreshedAt, refresh:function(){ setTick(function(t){return t+1;}); } };
}

// a) Briefing card — sits at the very top of Today; prominent when today's briefing exists, quiet placeholder otherwise
function BriefingCard({gcalOn, events}){
  if(!gcalOn || events===null) return null;

    <div style={{background:UI.accent+"0a",border:"0.5px solid "+UI.accent+"33",borderRadius:"var(--r-lg)",padding:"14px 16px",marginBottom:16}}>

// b) Upcoming list — windowed events grouped by day, color-tagged by colorId; excludes the briefing and your own app-created tasks

          <i className="fa-regular fa-calendar" style={{color:UI.accent}} aria-hidden="true"/>
          <span style={{fontSize:14.5,color:"var(--ink)",flex:1}}>Upcoming</span>

        {!gcalOn && <p style={{fontSize:12,color:"var(--ink-3)",margin:0}}>Turn on reminders + sync above to see your briefing and upcoming events here.</p>}
        {gcalOn && err && <p style={{fontSize:12,color:"var(--warn)",margin:0}}>⚠ {err}</p>}
        {gcalOn && !err && (
          <>
            <div style={{display:"flex",alignItems:"center",gap:8,margin:"2px 0 6px"}}>
              <button className="iconbtn" style={{fontSize:11,color:!schoolOnly?UI.accent:"var(--ink-3)"}} onClick={function(){ setSchoolOnly(false); }}>All</button>
              <span style={{color:"var(--line-2)"}}>·</span>
              <button className="iconbtn" style={{fontSize:11,color:schoolOnly?UI.accent:"var(--ink-3)"}} onClick={function(){ setSchoolOnly(true); }}>School only</button>
              {ago!==null && <span style={{marginLeft:"auto",fontSize:10.5,color:"var(--ink-3)"}}>{ago<1?"just now":("checked "+ago+"m ago")}</span>}

            {groups.map(function(g){

                        <div style={{flex:1,minWidth:0}}>
